: "a01_jack_douyin_03", "account": "A01 广州Jack麻麻（抖音 KOC）", "title": "翻相册翻到Jack最近刷KET阅读的截图📱", "body": "翻相册翻到Jack最近刷KET阅读的截图📱\n手指着一行一行读，读完自己圈关键词、标答案，突然有点感慨。\n\n他刚起步是真·零基础：字母认不全，外教说什么，他只能笑着点头😂\n那时候，KET三个字母我提都不敢提。\n\n我们没走捷径，就是每天一节，放假两三节，一直磨到现在。\n\n慢慢地，他能整段整段跟外教聊了；\n后来他自己指着KET的题说：我想试试这个。\n\n一开始错得多很正常😮‍💨现在这套Football主题的阅读，他读完能自己说出哪里是重点。\n\n从零基础到备考KET，没有惊天逆转，就是把\"今天这一节\"认真上好，重复900多次📚\n\n如果你家娃也在零基础阶段，别急——先让耳朵和嘴巴动起来，题目是后面自然长出来的🌱\n\n你家娃现在学到哪一步了？评论区聊聊👇\n\n【话题】", "tags": "#英语启蒙 #KET #零基础英语 #广州妈妈 #陪娃练口语", "date": "2026-10-17", "imgs": ["assets/a01_jack_douyin_03_01.jpg", "assets/a01_jack_douyin_03_02.jpg", "assets/a01_jack_douyin_03_03.jpg", "assets/a01_jack_douyin_03_04.jpg", "assets/a01_jack_douyin_03_05.jpg", "assets/a01_jack_douyin_03_06.jpg"], "zip": ""}, {"id": "a01_jack_douyin_04", "folder": "a01_jack_douyin_04", "account": "A01 广州Jack麻麻（抖音 KOC）", "title": "A｜零基础娃跟外教有没有用？我只盯这4个信号 ⭐推荐（数字+具体钩子，21字不截断）", "body": "总有妈妈问我：娃零基础跟外教，到底有没有用？🤔\n说实话，我以前也只会盯着一件事：他今天开口没。\n后来我发现，看热闹没用，得看信号📶\n\n1️⃣ 听懂了吗\nJack 刚起步那会儿，外教说什么他都只会笑着点头😅\n现在外教说一遍，他能直接动手做、接着答——耳朵通了，比会背多少单词都重要。\n\n2️⃣ 愿意说了吗\n不看说得标不标准，看他抢不抢着说。\nJack 现在会主动跟外教分享学校里的事，话痨模式一开就停不下来🤣\n\n3️⃣ 说错了，有人接住吗\n好的外教不会说\"你错了\"，会换个方式再问一遍，让娃自己改过来。\n被接住的错，才敢犯第二次。\n\n4️⃣ 下周还想见这位外教吗\n娃的态度，是最诚实的成绩单💯\n\n这4条，我每次都在旁边悄悄打分。\n一节两节看不出啥，攒上几个月，趋势骗不了人🌱\n（我家的观察，不一定适合每家娃，你按自家节奏来）\n\n你家娃中了几条？评论区聊聊👇", "tags": "#英语启蒙 #零基础英语 #陪娃练口语 #广州妈妈 #少儿英语", "date": "2026-10-24", "imgs": ["assets/a01_jack_douyin_04_01.jpg", "assets/a01_jack_douyin_04_02.jpg", "assets/a01_jack_douyin_04_03.jpg", "assets/a01_jack_douyin_04_04.jpg", "assets/a01_jack_douyin_04_05.jpg", "assets/a01_jack_douyin_04_06.jpg", "assets/a01_jack_douyin_04_07.jpg", "assets/a01_jack_douyin_04_08.jpg", "assets/a01_jack_douyin_04_09.jpg", "assets/a01_jack_douyin_04_10.jpg", "assets/a01_jack_douyin_04_11.jpg", "assets/a01_jack_douyin_04_12.jpg", "assets/a01_jack_douyin_04_13.jpg", "assets/a01_jack_douyin_04_14.jpg", "assets/a01_jack_douyin_04_15.jpg", "assets/a01_jack_douyin_04_16.jpg", "assets/a01_jack_douyin_04_17.jpg"], "zip": ""}, {"id": "a01_jack_douyin_05", "folder": "a01_jack_douyin_05", "account": "A01 广州Jack麻麻（抖音 KOC）", "title": "Jack 一周外教课表：雷打不动每天这一节", "body": "📅 不囤一大包KE，也能让娃天天有外教陪练。\n\nJack 的每周安排很简单：周一三五六日，晚上八点半，雷打不动一节外教。周二周四休息，不贪多。🌱\n\n这样排不是为了凑天数，是想让他把\"开口\"变成像刷牙一样的小事——每天一点点，比周末猛灌三节管用。\n\n外教也基本固定，换了人娃要重新熟络，节奏就断了。✅\n\n很多妈妈问怎么坚持，我的体会就一句：别一上来排满，先能天天见到外教，再谈别的。💡\n\n你家娃现在一周几节？评论区聊聊，我看看大家的节奏～💬", "tags": "#少儿启蒙 #外教一对一 #启蒙 #陪娃练口语", "date": "2026-10-29", "imgs": ["assets/a01_jack_douyin_05_01.jpg", "assets/a01_jack_douyin_05_02.jpg", "assets/a01_jack_douyin_05_03.jpg"], "zip": ""}, {"id": "a01_jack_douyin_06", "folder": "a01_jack_douyin_06", "account": "A01 广州Jack麻麻（抖音 KOC）", "title": "跟同一位外教第24周，Jack 从不敢说到抢着说", "body": "🌟 跟现在这位外教，Jack 已经连续第24周了，从来没换过人。\n\n刚开始他不敢开口，问我\"说错了怎么办\"。外教不急，错了就接住，慢慢他就敢了。\n\n现在倒好，到点自己搬小板凳坐好，抢着说，还爱显摆新词。😆\n\n我越来越觉得：能不能坚持，外教稳不稳定占了大头。换来换去，娃刚熟一个人又换，热情就磨没了。\n\n所以当初挑外教，我最看重的不是多厉害，是挑满意了能不能就固定下来。能固定，才值得长期跟着。✅\n\n你们家娃跟外教，是固定一位还是经常换？评论区聊聊～💬", "tags": "#固定外教 #外教一对一 #少儿启蒙 #口语 #陪娃练口语", "date": "2026-10-29", "imgs": ["assets/a01_jack_douyin_06_01.jpg", "assets/a01_jack_douyin_06_02.jpg", "assets/a01_jack_douyin_06_03.jpg"], "zip": ""}, {"id": "a01_jack_douyin_07", "folder": "a01_jack_douyin_07", "account": "A01 广州Jack麻麻（抖音 KOC）", "title": "好的外教是顺着娃走的，不是念课文的", "body": "🌟 有阵子我挺在意的：Jack 的外教，是不是一套内容所有娃都一样上？\n\n后来我发现不是。Jack 那阵迷足球，外教就顺着他聊球赛、聊球员名字；过阵子迷恐龙，又换成恐龙。⚽\n\n不是硬塞一本教材从头念到尾。\n\n我现在挑外教，最看重这一条：他愿不愿意跟着娃的兴趣和节奏走。\n\n娃聊得起的，才愿意多说。被当成流水线上一个号，念完就换下一个，热情很快就凉了。✅\n\n所以我家不追\"进度最快\"，更在意：这节他在不在状态、愿不愿意接着聊。状态对了，进步反而快。🌱\n\n挑外教别光看名气，先看他愿不愿意跟着你家娃走。你家娃最近迷啥？评论区聊聊～💬", "tags": "#少儿启蒙 #外教一对一 #陪娃练口语 #启蒙 #广州妈妈", "date": "2026-11-01", "imgs": [], "zip": ""}, {"id": "edgetutor_brand_01", "folder": "edgetutor_brand_01", "account": "A05 EDGE Tutor 易知（品牌号）", "title": "0-6岁英语启蒙路线图，一张图讲清", "body": "英语启蒙最怕的不是晚，是顺序乱了、阶段跳级。今天把0-6岁这条路一张图讲清，建议收藏慢慢看👇\n\n🌱 0-2岁 磨耳朵期\n目标：建立语音熟悉感，不追求输出\n做什么：英文儿歌当背景音、亲子共读布书纸板书、家长随口说简单词\n过关标准：听到熟悉的歌有反应、乐意翻英文书\n别做：逼着跟读、看教学视频\n\n🌿 2-4岁 开口前期\n目标：听懂日常指令和简单问句，开始蹦单词\n做什么：动画片每天20分钟（可理解性输入）、分级读物亲子共读、外教一对一以\"听懂+敢说\"为目标\n过关标准：能说单词和短句、上课不需要翻译\n别做：急着学拼读和写\n\n🌳 4-6岁 拼读启蒙期\n目标：从\"听说\"自然过渡到\"认读\"\n做什么：听说词汇量够了再进自然拼读、开始分级自读、外教一对一加入读说结合\n过关标准：见到常见词能读、敢整句输出\n别做：没有听说基础直接刷拼读规则\n\n💡 三个阶段通用的原则\n1️⃣ 听说先行，读写靠后——顺序乱了最费妈\n2️⃣ 每天20分钟，比周末突击3小时管用\n3️⃣ 每个阶段只解决一个任务，别贪多\n\n你家娃现在哪个阶段？评论区说下年龄+目前的状态，我帮你看看下一步重点👇\n\n收藏这篇，阶段切换时拿出来对照。", "tags": "#英语启蒙 #英语启蒙路线图 #零基础英语 #幼儿英语 #英语启蒙从哪里开始 #少儿英语 #英语启蒙顺序", "date": "2026-10-18", "imgs": ["assets/edgetutor_brand_01_01.jpg", "assets/edgetutor_brand_01_02.jpg", "assets/edgetutor_brand_01_03.jpg"], "zip": ""}, {"id": "edgetutor_brand_02", "folder": "edgetutor_brand_02", "account": "A05 EDGE Tutor 易知（品牌号）", "title": "启蒙的顺序，错了全白费", "body": "启蒙最怕的不是晚，是顺序乱了、阶段跳级。听说读写这4步，顺序不能乱👇\n\n① 听：先听够，磨耳朵是地基\n儿歌、动画每天一小段，不追求输出，听到熟悉的有反应就算数\n❌ 别做：逼着跟读\n\n② 说：听多了，自然蹦出词\n听得懂的内容才是有效输入，蹦单词、短句都是进步\n❌ 别做：急着纠正发音\n\n③ 读：有听说底子，再学认字\n听说词汇够了再进自然拼读，见到常见词能读\n❌ 别做：零基础直接刷拼读规则\n\n④ 写：放在最后，千万别抢跑\n先听说后读写，和学母语一个道理\n❌ 别做：听说没稳就练写\n\n💡 记住一句话：每个阶段只解决一个任务，别贪多。\n顺序对了，每一步都省力；顺序错了，每一步都费妈。\n\n你家娃现在走到第几步？评论区说下年龄+目前状态，我帮你看看下一步重点👇\n收藏这篇，阶段切换时拿出来对照。", "tags": "#启蒙顺序 #启蒙路线图 #少儿启蒙 #零基础启蒙 #幼儿启蒙 #家长收藏", "date": "2026-10-24", "imgs": ["assets/edgetutor_brand_02_01.jpg", "assets/edgetutor_brand_02_02.jpg", "assets/edgetutor_brand_02_03.jpg", "assets/edgetutor_brand_02_04.jpg", "assets/edgetutor_brand_02_05.jpg", "assets/edgetutor_brand_02_06.jpg", "assets/edgetutor_brand_02_07.jpg", "assets/edgetutor_brand_02_08.jpg"], "zip": ""}, {"id": "edgetutor_choose_01", "folder": "edgetutor_choose_01", "account": "A05 EDGE Tutor 易知（品牌号）", "title": "帮娃练英语，先看这几点", "body": "≤17字/行×6行）\n\n—— 第 1 页 · 封面 ——\n标题：帮娃练英语，先看这几点\n正文：比名气更该看中的\n是这几样\n角标：EDGE Tutor\n\n—— 第 2 页 · 引言 ——\n标题：开始前，先想清楚\n正文：合适比便宜更重要\n先看清要的是什么\n再比较，不踩坑\n角标：引言\n\n—— 第 3 页 · 看点1 ——\n标题：看点1 带的人稳不稳定\n正文：换来换去难熟悉\n固定下来更知根知底\n娃也更容易放松\n角标：看点 1\n\n—— 第 4 页 · 看点2 ——\n标题：看点2 能不能开口练\n正文：光听不说是学不牢的\n多给娃表达的机会\n敢说比说对更重要\n角标：看点 2\n\n—— 第 5 页 · 看点3 ——\n标题：看点3 内容贴不贴近生活\n正文：用得上的才记得住\n从日常话题聊起\n娃更有话可说\n角标：看点 3\n\n—— 第 6 页 · 看点4 ——\n标题：看点4 氛围会不会太紧\n正文：一紧张就更不敢开口\n轻松的环 ccount": "A05 EDGE Tutor 易知（品牌号）", "title": "EDGE Tutor", "body": "≤17字·行） ================\n\nP1 封面\n标题：小猪佩奇到底有没有用\n副文：放了300集还开不了口\n副文：问题可能不在佩奇\n\nP2 先说扎心真相\n标题：看了几百集还是不会说\n正文：很多娃只做到了看\n正文：输入不等于会说\n正文：卡在\"开口\"这一步\n\nP3 佩奇不是没用\n标题：佩奇给的是语境语感\n正文：它喂了大量地道表达\n正文：但光看不够\n正文：得有人接他的话\n\nP4 看完只做一件事\n标题：看完问他刚才啥事\n正文：用中文讲也行\n正文：讲得出才算看懂\n正文：别急着关掉\n\nP5 慢慢往英文引\n标题：他说的词你补英文\n正文：他说\"跳\"你接 jump\n正文：不逼整句\n正文：先愿意接你的话\n\nP6 一集这样用就够\n标题：一集10分钟这样排\n正文：看一集10分钟\n正文：聊5分钟刚才剧情\n正文：挑1个词跟读两遍\n\nP7 启蒙真正目标\n标题：不是输入了多少\n正文：是娃愿不愿意\n正文：自己把话说出来\n正文：佩奇只是引子\n\nP8 收尾\n标题：别神话任何动画片\n副文：陪聊才是关键\n副文：收藏照着试\n副文：关注我们，更多方法\n\n================ 可直接发布的配文正文 ================\n\n很多家长问：给娃看小猪佩奇，到底有没有用？\n\n先说扎心的——不少娃看了几百集，还是只会看、不会说。问题常常不在佩奇，在\"看完之后\"没人接话。\n\n佩奇当然有用，它给娃喂了大量地道语境和语感。但光看不够，得有人把话接下去。\n\n看完做一件事就够了：问他\"刚才发生了啥\"。用中文讲也行，讲得出来，说明他真看懂了、真听进去了。\n\n再慢慢往英文引：他说的那个词，你顺手补上英文。他说\"跳\"，你接 jump。不逼整句，先让他愿意接你的话。\n\n一集大概这样用：看10分钟，聊5分钟刚才剧情，挑1个词跟他读两遍。不求多。\n\n说到底，启蒙真正的目标不是\"输入了多少\"，是娃愿不愿意自己把话说出来。佩奇是引子，陪聊才是关键。\n\n别神话任何一部动画片。收藏起来，照着试。关注我们，分享更多陪娃练英语的方法。", "tags": "#英语启蒙 #少儿英语 #陪娃练口语", "date": "2026-10-14", "imgs": ["assets/edgetutor_media_01_01.jpg", "assets/edgetutor_media_01_02.jpg", "assets/edgetutor_media_01_03.jpg", "assets/edgetutor_media_01_04.jpg", "assets/edgetutor_media_01_05.jpg", "assets/edgetutor_media_01_06.jpg", "assets/edgetutor_media_01_07.jpg", "assets/edgetutor_media_01_08.jpg"], "zip": ""}, {"id": "edgetutor_parents_01", "folder": "edgetutor_parents_01", "account": "A05 EDGE Tutor 易知（品牌号）", "title": "自己英语不好，也能陪", "body": "≤17字/行、每页≤6行\n配色：主蓝 #2E5BFF + 辅黄 #FFC94D，浅色背景\n\nP1 封面\n自己英语不好，也能陪\n别被发音不标准劝退\n陪娃练，不靠你多厉害\n\nP2 先放宽心\n发音不准也没关系\n娃靠的是多听多说\n不是你教得标不标准\n敢开口比发音重要\n\nP3 做法1 · 把英语放进生活里\n看到什么随口说\n苹果、星星、小卡车的词\n不刻意，反而记得住\n\nP4 做法2 · 多听原声磨耳朵\n儿歌、动画、小故事\n每天听一小段就好\n耳朵熟了嘴才跟得上\n\nP5 做法3 · 陪他一起说\n你说一句他学一句\n说错了一起笑一笑\n气氛轻松他才乐意\n\nP6 做法4 · 夸努力不夸天赋\n敢说就值得鼓掌\n不纠结一句对不对\n他越练越有劲\n\nP7 收尾\n陪比教更重要\n你陪着就是底气\n每天一点点就够\n收藏起来，慢慢陪他走\n\n——", "tags": "#2E5BFF #FFC94D，浅色背景", "date": "2026-08-20", "imgs": [], "zip": ""}, {"id": "edgetutor_roadmap_01", "folder": "edgetutor_roadmap_01", "account": "A05 EDGE Tutor 易知（品牌号）", "title": "0基础到敢开口，分几步", "body": "≤17字/行、每页≤6行\n配色：主蓝 #2E5BFF + 辅黄 #FFC94D，浅色背景\n\nP1 封面\n0基础到敢开口，分几步\n不用一步到位\n顺着节奏慢慢来\n\nP2 第一步 · 先磨耳朵\n儿歌动画多听一听\n不要求马上会说\n耳朵熟了才开得了口\n\nP3 第二步 · 从词开始\n生活里常见的先说\n苹果星星小卡车\n一个词也是进步\n\nP4 第三步 · 敢接话\n你问一句他接一句\n不纠错先鼓励\n愿意接就是好开始\n\nP5 第四步 · 愿意多说\n聊熟悉的话题\n每天一小段固定时间\n说得越来越多\n\nP6 第五步 · 成了习惯\n看到东西就冒一句\n不催也不抵触\n把英语放进日子里\n\nP7 小提醒\n别跳步别着急\n每个娃节奏不一样\n多听多说慢慢来\n比快慢更重要的是乐意\n\nP8 收尾\n陪他走这一段\n收藏起来对照看\n关注我们，分享更多方法\n\n——", "tags": "#2E5BFF #FFC94D，浅色背景", "date": "2026-10-10", "imgs": ["assets/edgetutor_roadmap_01_01.jpg", "assets/edgetutor_roadmap_01_02.jpg", "assets/edgetutor_roadmap_01_03.jpg", "assets/edgetutor_roadmap_01_04.jpg", "assets/edgetutor_roadmap_01_05.jpg"], "zip": ""}, {"id": "edgetutor_scenes_01", "folder": "edgetutor_scenes_01", "account": "A05 EDGE Tutor 易知（品牌号）", "title": "家里就能练英语的几个地方", "body": "≤17字/行、每页≤6行\n配色：主蓝 #2E5BFF + 辅黄 #FFC94D，浅色背景\n\nP1 封面\n家里就能练英语的地方\n不用专门坐好\n生活里随处能聊\n\nP2 厨房 · 洗菜时聊一聊\napple 红红的番茄\n你说他跟着念\n顺手就记住了\n\nP3 超市 · 推车里指一指\n牛奶鸡蛋叫什么\n让他帮你拿一拿\n边走边说不难\n\nP4 洗澡 · 玩水时冒一句\nduck 小鸭子浮着\n泡泡英文一起数\n他玩着就开口\n\nP5 坐车 · 路上聊几句\n看到车说 car\n数数路边的树\n堵车也不闷\n\nP6 睡前 · 绘本读一段\n指着图说名字\n一句两句都行\n安静里慢慢说\n\nP7 小体会\n场景越多越自然\n不刻意反而记得牢\n英语就成了日常一部分\n\nP8 收尾\n从今天一个场景开始\n挑顺手的先试\n收藏起来慢慢加\n关注我们，分享更多日常\n\n——", "tags": "#2E5BFF #FFC94D，浅色背景", "date": "2026-10-10", "imgs": ["assets/edgetutor_scenes_01_01.jpg"], "zip": ""}, {"id": "edgetutor_search_01", "folder": "edgetutor_search_01", "account": "A05 EDGE Tutor 易知（品牌号）", "title": "外教一对一多少钱一节才不亏？菲教和欧美教的差价，今天摊开讲清楚💰", "body": "先说结论：外教一对一没有\"标准价\"，但有\"合理区间\"。搞懂差价在哪，你才知道自己的钱花没花对。\n\n1️⃣ 菲教和欧美教，差价到底差在哪\n\n行业常见区间（以25分钟一节算）：\n菲教：几十元一节\n欧美外教：上百元一节\n\n差价不是\"好坏\"的差，是这三件事的差👇\n🔹 供给量：菲教基数大、时区近，排课灵活，价格自然低\n🔹 口音需求：欧美外教是母语者，供给少、时区成本高\n🔹 你的目标：娃在哪个阶段，比老师是哪国人更重要\n\n2️⃣ 按阶段选，才是省钱的关键\n\n我的建议很直接：\n娃还在开口期、蹦单词阶段 → 菲教完全够用，把开口量堆上去，性价比最高\n娃已经能说整句、要纠口音提表达 → 欧美外教的价值才真正体现\n\n很多家长一上来就冲欧美外教，娃连整句都不敢说，好口音也无从谈起，这钱花得就冤😅\n\n3️⃣ 比\"每节多少钱\"更该问的三个问题\n\n🔸 一节是25分钟还是50分钟？（换算成每小时才知道贵不贵）\n🔸 老师固定还是每次换？（频繁换老师，前期互相熟悉的成本都是你买单）\n🔸 教材是体系化的还是老师随手讲？（决定娃是系统性进步还是散点聊天）\n\n4️⃣ 我们的做法\n\n我们是 EDGE Tutor，做少儿外教一对一。菲教和欧美外教都有，不按\"贵的推\"，按娃的阶段和家里的预算匹配🎯 娃在哪个阶段、该从哪种老师开始，评论区或者私信说下情况，正经给你分析。\n\n价格是选择的信息，不该是选择的障碍。敢把差价逻辑讲清楚的机构，才值得你多问一句。\n\n有其他想了解的，评论区问，都会回🙋", "tags": "#外教一对一 #少儿英语口语 #菲教 #欧美外教 #英语启蒙 #外教口语 #少儿英语 #EDGE", "date": "2026-10-17", "imgs": [], "zip": ""}, {"id": "edgetutor_search_02", "folder": "edgetutor_search_02", "account": "A05 EDGE Tutor 易知（品牌号）", "title": "孩子外教课用 ClassIn 上？家长该知道的几件事📱", "body": "很多妈妈第一次听说 ClassIn，是外教老师发消息说\"请先下载 ClassIn\"的时候，一脸懵：这是个啥？靠谱吗？今天一次讲清楚👇\n\n1️⃣ ClassIn 是什么\n\n一句话：它是一个专门给教学用的上课工具，不是卖课的机构，很多国内的学校和外教平台都在用它上课🏫\n\n你可以把它理解成\"专业的在线教室\"——比普通视频软件多了黑板、举手、答题这些课堂里才有的东西。\n\n2️⃣ 家长最关心的三件事\n\n🔸 设备：平板、电脑、手机都能装，上课建议平板或电脑（屏幕大，娃看得清课件）\n🔸 回放：课后有回放，娃哪句没听懂可以再听一遍，这是选机构时值得问的点\n🔸 效果：课堂里有答题和小奖励，娃是在\"上课\"不是在\"看视频\"，这是 ClassIn 和视频软件最大的区别\n\n3️⃣ 我们的使用体验\n\nEDGE Tutor 的外教课就跑在 ClassIn 上。用下来的真实感受：\n\n娃能上黑板\"写\"，老师圈出来纠正，娃特别有参与感✏️ 举手答题有金币奖励，娃上课像打游戏一样积极。一节课下来做了什么、答对多少，家长能看到，不是黑箱。\n\n4️⃣ 第一次用，两个小提醒\n\n🔹 提前10分钟进教室调试摄像头和耳机，别卡在开头\n🔹 给娃用有支架的设备，别让娃举着手机上完一节课，手酸脖子也酸😅\n\n搜到这篇的妈妈，家里娃应该正要上或者正在上在线外教课吧🙌 关于 ClassIn 或者选外教有什么想问的，评论区说，都会回。", "tags": "#ClassIn #外教一对一 #少儿英语口语 #在线外教 #英语启蒙 #网课 #外教口语 #EDGE", "date": "2026-10-17", "imgs": [], "zip": ""}, {"id": "edgetutor_search_03", "folder": "edgetutor_search_03", "account": "A05 EDGE Tutor 易知（品牌号）", "title": "EDGE Tutor 是什么？被问最多的6个问题，一次说清🙋", "body": "经常有妈妈在别的笔记下面刷到我们，跑来主页问一堆问题。今天把被问最多的6个，一次答完👇\n\n1️⃣ 你们是做什么的？\n\nEDGE Tutor，少儿外教一对一。一句话说我们的想法：让普通家庭的孩子，也能和世界自由对话🌏 我们不搞神童路线，就帮娃把\"敢说、会说\"这件事做扎实。\n\n2️⃣ 几岁可以开始？\n\n我们这里大多是4-12岁的娃。经验是：娃能坐得住15分钟、愿意跟人互动，就可以开始。不用等\"英语基础\"，外教一对一本来就是从零基础带着玩的🎈\n\n3️⃣ 菲教还是欧美外教？\n\n都有。启蒙开口期菲教完全够用，性价比高；娃能说整句了、要抠口音和表达了，再上欧美外教。不用一开始就冲贵的，阶段对了才是真的对。\n\n4️⃣ 用什么上课？\n\nClassIn，专业在线教室工具。有黑板、举手、答题、回放。娃是上课，不是看视频。\n\n5️⃣ 老师固定吗？\n\n可以固定。我们很多娃从启蒙跟到进阶，一直是同一位老师——老师了解娃的脾性和进度，省掉每次重新熟悉的过程，娃也更有安全感💛\n\n6️⃣ 零基础真的可以吗？\n\n可以，而且零基础娃的进步最明显：从躲镜头，到主动跟老师挥手说 see you，这个变化一般来得比家长预想的快。\n\n——\n\n以上是被问最多的6个。每个娃情况不一样，拿不准的（年龄/性格/预算），评论区或者私信说说情况，正经给你分析，不推销🙅", "tags": "#EDGE #外教一对一 #少儿英语口语 #英语启蒙 #菲教 #欧美外教 #在线英语 #广州少儿英语", "date": "2026-10-17", "imgs": [], "zip": ""}, {"id": "edgetutor_search_04", "folder": "edgetutor_search_04", "account": "A05 EDGE Tutor 易知（品牌号）", "title": "背了十几年单词还是开不了口？EDGE Tutor 成人外教一对一，体系长这样🗣️", "body": "先说一个扎心的事实：大多数成人学英语，不缺单词，缺的是一个\"必须开口、又不怕说错\"的场合。\n\n你是不是也这样👇\n📖 单词书永远背到 C 就放弃\n📱 下了五个口语APP，全在吃灰\n😰 开会轮到自己用英语发言，心跳直接拉满\n✈️ 出国旅游，全程靠比划+翻译软件\n\n问题不在你懒。是方法反了：先囤知识，再等\"敢说的那天\"。但那一天永远不会自己来——口语是用出来的，不是攒出来的。\n\nEDGE Tutor 的成人一对一，就是围绕\"让大人敢说\"来设计的👇\n\n1️⃣ 25分钟一对一，你不开口没人开口\n一对多的班，一节课你平均说不了三句。一对一没有退路，外教全程就对着你一个人，每分钟都在练\"说\"这件事本身。\n\n2️⃣ 按你要的场景学，不背用不上的\n日常口语、商务表达、旅游点单……你为什么学，就从哪个场景开始学。学完这周，下周就用得上，这是成人能坚持的唯一理由。\n\n3️⃣ 固定外教，不用每周重新鼓起勇气\n跟熟悉的人说话，人才敢出错。固定外教了解你的水平和卡点，不用每次从\"你好我叫什么\"开始，安全感是练口语的地基💛\n\n4️⃣ 错了就纠，但只纠一个\n成人最大的心理障碍是怕错。外教一次只纠一个点，纠完继续聊，说错不尴尬，改了就走。\n\n5️⃣ 每节有回放，通勤路上听自己\nClassIn 课后回放，听一遍自己说的英语，比听十遍标准音频都清楚问题在哪。\n\n——\n\n成人和孩子学英语不一样：孩子有的是时间，大人只有碎片时间和明确目标。所以成人一对一的体系不追求\"全面\"，追求\"从你的目标倒推着学\"。\n\n想知道自己适合从哪个场景切入？评论区说说你学英语是要干嘛（工作/旅游/陪娃/兴趣），正经帮你分析👇", "tags": "#EDGE #成人英语口语 #成人英语 #零基础英语 #上班族学英语 #一对一外教 #英语口语怎么练 #外教一对一", "date": "2026-10-17", "imgs": ["assets/edgetutor_search_04_01.jpg", "assets/edgetutor_search_04_02.jpg", "assets/edgetutor_search_04_03.jpg", "assets/edgetutor_search_04_04.jpg", "assets/edgetutor_search_04_05.jpg", "assets/edgetutor_search_04_06.jpg", "assets/edgetutor_search_04_07.jpg", "assets/edgetutor_search_04_08.jpg", "assets/edgetutor_search_04_09.jpg", "assets/edgetutor_search_04_10.jpg"], "zip": ""}, {"id": "edgetutor_search_05", "folder": "edgetutor_search_05", "account": "A05 EDGE Tutor 易知（品牌号）", "title": "网盘里囤了几十G启蒙资源全吃灰？EDGE Tutor 少儿外教一对一，娃从启蒙到开口的完整路线🗺️", "body": "先说结论：娃的英语启蒙，最缺的不是资源，是一个\"会等他说完\"的人。\n\n这两件事，当妈的应该都很熟👇\n📁 网盘囤了几十G儿歌动画绘本，娃看的时候挺乐，关掉就忘\n🤐 娃会认不少单词，让他张嘴说，头摇得像拨浪鼓\n\n资源是死的，语言是说出来的。娃缺的是一个敢开口的对象——一个语速放慢、说错了会笑、愿意等他把句子组织完的外教老师💛\n\nEDGE Tutor 的少儿一对一，路线是这样走的👇\n\n1️⃣ 零基础起步：先让娃觉得\"英语好玩\"\n4岁坐不住也没关系。这个阶段不认字母不背单词，外教带着做游戏、唱儿歌、指认东西，目标是娃看到外教不躲、愿意互动。兴趣是一切的地基。\n\n2️⃣ 开口期：把单词变成句子\n娃开始蹦单词了，外教就把词接成句还给他：\"Apple\"→\"I like apples\"，像传球一样，一来一回，句子就长出来了。\n\n3️⃣ 输出期：娃主动说完整的话\n能说整句了，外教开始带话题聊天、纠发音。很多娃到这一步，会反过来教爸妈，张口就是整句英文，家长反而跟不上😅\n\n4️⃣ 每一步家长都看得见\nClassIn 课堂有回放，娃这节课说了什么、外教怎么带，都能听到。启蒙不是黑箱，进度自己心里有数。\n\n5️⃣ 老师可以固定\n启蒙到进阶一直是同一位老师，不用每次重新熟悉。娃和老师处成朋友，上课这件事就从\"任务\"变成了\"去见朋友\"。\n\n——\n\n给娃选一对一，别问\"哪个外教好\"，先问\"娃现在在哪个阶段\"。阶段对了，普通老师也能带出效果；阶段错了，再好的老师也是白花钱。\n\n拿不准娃在哪个阶段？评论区说下娃的年龄+现在的基础（零基础/会蹦单词/能说整句），帮你判断从哪步开始👇", "tags": "#EDGE #少儿英语启蒙 #英语启蒙 #少儿英语口语 #外教一对一 #幼儿英语 #零基础英语启蒙 #几岁学英语", "date": "2026-10-17", "imgs": ["assets/edgetutor_search_05_01.jpg", "assets/edgetutor_search_05_02.jpg", "assets/edgetutor_search_05_03.jpg", "assets/edgetutor_search_05_04.jpg", "assets/edgetutor_search_05_05.jpg", "assets/edgetutor_search_05_06.jpg", "assets/edgetutor_search_05_07.jpg", "assets/edgetutor_search_05_08.jpg", "assets/edgetutor_search_05_09.jpg", "assets/edgetutor_search_05_10.jpg"], "zip": ""}, {"id": "edgetutor_search_06", "folder": "edgetutor_search_06", "account": "A05 EDGE Tutor 易知（品牌号）", "title": "雅思口语怎么备考？先说一个扎心的事实：口语卡在5.5，大概率不是词汇量不够。", "body": "雅思口语官方评分就四条：\n🗣️ 流利度与连贯性\n📚 词汇资源\n✍️ 语法广度与准确\n🔤 发音\n\n对着这四条自查👇\n1️⃣ 你背的高级词，能脱口而出几个？\n2️⃣ part2 独白两分钟，中间\"呃…那个…\"卡几次？\n3️⃣ part3 被考官追问 why，你的回答是不是越来越短？\n\n5.5 到 6.5 差的不是更厚的单词书，是\"开口的肌肉记忆\"。\n\n常见三件套：背题库、录音频、对着APP打分。\n问题在于——都是单机模式。口语是即时交互，考官会追问、会打断、会换话题，这些APP给不了。\n\n真正的练习必须有\"不可预测的对话对象\"：\n🤝 语伴：免费但难固定，水平对等更难\n🎓 外教陪练：稳定、有教学经验，能模拟真实问答节奏\n\nEDGE Tutor 做外教一对一陪练，说三条选陪练不踩坑的👇\n🎯 选懂雅思评分标准的，能按四项给你反馈，而不是只陪聊\n🎯 选能固定时间的，口语靠高频，一周一次不如每天20分钟\n🎯 选敢打断你的，考官不会等你慢慢想\n\n备考的尽头不是背更多素材，是让开口变成条件反射。\n\n正在备考或考过的，评论区聊聊你卡在哪个 part👇", "tags": "#雅思口语 #雅思口语怎么备考 #雅思备考 #口语陪练 #外教陪练 #雅思口语part2 #英语口语", "date": "2026-10-18", "imgs": [], "zip": ""}, {"id": "edgetutor_search_07", "folder": "edgetutor_search_07", "account": "A05 EDGE Tutor 易知（品牌号）", "title": "自然拼读要不要学？我的答案：要，但有前提。", "body": "先把最容易混的问题讲清👇\n\n自然拼读和音标的区别：\n🔤 音标，是给\"学英语的人\"的工具，像字典里的注音\n🔤 自然拼读，是英语母语娃的识字方式，英美小学都在用\n\n结论：启蒙阶段拼读优先，音标以后再说。\n\n⚠️ 但跳过听说直接学拼读，等于让还不会说话的娃学写字。\n\n判断你家娃能不能开始学拼读，问三个问题：\n1️⃣ 能听懂常见英语指令吗？（touch your nose 这种）\n2️⃣ 能开口说简单句子吗？（I like... / Where is...）\n3️⃣ 对英语儿歌、动画有反应吗？\n\n三个都是 yes → 可以开始\n有一个是 no → 先把听说补上，拼读不急\n\n几岁开始？\n不按年龄按状态。有的娃4岁听说量就够，有的娃6岁才起步也不晚。硬卡年龄反而容易毁兴趣。\n\n怎么学不踩坑：\n❌ 拿单词表干拼 → 娃把\"读英语\"和\"受罪\"画等号\n✅ 在阅读里拼：绘本里反复见同一规律，比抄十遍有用\n✅ 听说别断：拼读是水到渠成，听说是那个\"水\"\n\n听力词汇量够的娃碰拼读，几乎是\"一点就通\"——耳朵早熟悉了那些音。这也是为什么每天有真实英语输入（比如 EDGE Tutor 的外教陪娃聊20分钟），比突击学拼读更值。\n\n启蒙路上纠结的，评论区聊聊你家娃到哪一步了👇", "tags": "#自然拼读 #自然拼读要不要学 #英语启蒙 #少儿英语 #自然拼读几岁开始 #亲子英语 #陪娃学英语", "date": "2026-10-18", "imgs": [], "zip": ""}, {"id": "edgetutor_search_08", "folder": "edgetutor_search_08", "account": "A05 EDGE Tutor 易知（品牌号）", "title": "欧美外教和菲教哪个好？官方摊开讲，不绕弯子", "body": "经常有人来问：想给娃、或者给自己找外教，欧美外教和菲教，到底哪个好？\n\n先说结论：没有绝对的好坏，只有适不适合。今天官方一次说清，不绕弯子。\n\n💰 贵在哪\n\n欧美外教单价明显更高，菲教价格友好得多。这不是教学水平差了好几倍——差距主要来自当地收入水平和供需，怎么选看你更看重什么。\n\n🗣️ 口音真相\n\n欧美外教口音纯正；菲教口音个体有差异——但\"有差异\"不等于\"教得差\"。不少菲教老师发音清晰、语法扎实，而且他们自己就是非英语母语者，更懂中国人学英语卡在哪一环。\n\n⏰ 开口机会（最容易被忽略的）\n\n语言是说出来的，不是听出来的。欧美价格高，多数人一周约 1–2 次；菲教价格友好，可以天天练。对初学者，高频开口比\"口音完美\"更重要——先敢说、敢错，才有后面的事。\n\n📌 怎么选，看目标\n\n▫️ 追求纯正口音、备考口语或商务场合 → 欧美外教更稳\n▫️ 想天天练、培养开口习惯、预算有限 → 菲教更合适\n▫️ 进阶期可以混搭：菲教高频练 + 欧美定期纠\n\nEDGE Tutor 两种外教都有：少儿线从启蒙到开口输出，成人线从零基础到职场场景，按你的目标匹配，不硬推某一种。\n\n你家娃（或你本人）现在是什么阶段？评论区说下年龄+基础，我们帮你判断该选哪种👇", "tags": "#欧美外教和菲教哪个好 #菲教一对一 #欧美外教 #外教一对一 #菲教和欧美外教的区别 #英语启蒙 #成人英语 #怎么选外教", "date": "2026-10-18", "imgs": ["assets/edgetutor_search_08_01.jpg", "assets/edgetutor_search_08_02.jpg"], "zip": ""}, {"id": "edgetutor_search_09", "folder": "edgetutor_search_09", "account": "A05 EDGE Tutor 易知（品牌号）", "title": "成人外教怎么选？日常口语/商务/雅思对号入座", "body": "成人想找外教，第一步不是选平台，是想清楚一件事：你学英语是为了什么？\n\n用途不同，选老师的逻辑完全不一样。今天按三类最常见的用途一张表讲清，建议收藏，选之前拿出来对照👇\n\n🗣️ 日常口语族\n目标：出国旅行、日常交流敢开口\n选师重点：能天天练、价格友好；老师敢让你一直说，不冷场\n参考频率：每周3-5次，每次25分钟左右\n\n💼 商务英语族\n目标：会议发言、邮件、谈判场景用得上\n选师重点：有商务背景、能模拟真实工作场景；欧美外教为主\n参考频率：每周2-3次，每次45分钟以上\n\n🎓 雅思口语族\n目标：分数（常见卡5.5、冲6.5）\n选师重点：懂雅思四项评分标准、能按标准给反馈而不是只陪聊；时间能固定\n参考频率：备考期每周3次以上\n\n⚠️ 三类人都适用的避坑点\n1️⃣ 别只陪聊不纠错——说得流畅不等于说得对\n2️⃣ 别追求\"母语口音\"却忽略频率——一周一次，不如高频短练\n3️⃣ 别先买大套餐——先试听，确认老师对路再决定\n\nEDGE Tutor 成人外教一对一覆盖日常口语、商务、雅思三类场景，按用途匹配老师，不硬推某一种。\n\n评论区说下你的用途+目前水平，我帮你判断该选哪种👇", "tags": "#成人英语 #商务英语 #雅思口语 #外教一对一 #成人外教 #上班族英语 #日常口语 #英语口语", "date": "2026-10-18", "imgs": ["assets/edgetutor_search_09_01.jpg", "assets/edgetutor_search_09_02.jpg", "assets/edgetutor_search_09_03.jpg"], "zip": ""}, {"id": "edgetutor_search_teacher_01", "folder": "edgetutor_search_teacher_01", "account": "A12 外教一对一（搜索承接）", "title": "试听外教课，家长别光坐着", "body": "花了时间约了试听，很多家长坐在旁边不知道该看什么，光顾着看娃高不高兴。这份课堂观察清单收好，5个地方照着看👇\n\n① 谁说得更多\n好的课堂，外教说一半，孩子能接上一半。全程外教讲、娃只点头，要打个问号。\n\n② 被点名几次\n25分钟里娃被邀请开口几次？沉默超过1分钟没人管，说明互动设计不行。\n\n③ 答错了怎么反应\n先鼓励再带读的是好外教；直接说\"不对\"然后换人的，娃下次就不敢开口了。\n\n④ 课后状态\n下课娃还说\"还想上\"，比任何宣传都真实。愁眉苦脸出来的，再好也坚持不了。\n\n⑤ 有没有课堂回放\n能回放才能复盘，也能看到娃真实的参与度，别只信口头描述。\n\n收藏这份清单，下次试听带进去对照着用。\n你家娃试听时是什么表现？评论区聊聊👇", "tags": "#外教一对一 #少儿启蒙 #启蒙路线 #试听课 #外教怎么选 #家长收藏", "date": "2026-10-24", "imgs": ["assets/edgetutor_search_teacher_01_01.jpg", "assets/edgetutor_search_teacher_01_02.jpg", "assets/edgetutor_search_teacher_01_03.jpg", "assets/edgetutor_search_teacher_01_04.jpg", "assets/edgetutor_search_teacher_01_05.jpg", "assets/edgetutor_search_teacher_01_06.jpg", "assets/edgetutor_search_teacher_01_07.jpg"], "zip": ""}, {"id": "koc_huacha_03", "folder": "koc_huacha_03", "account": "A08 花花的茶（深圳跨境）", "title": "给娃选外教，我把VIPKID、51Talk、伴鱼、Polly都扒了一遍", "body": "住深圳、娃每天过关去香港上学的第三年，我对英语这件事比一般深圳妈妈敏感得多🍵\n\n之前聊过香港两文三语环境有多狠——全英语教学、粤语英语混着来，娃一进去就被推着开口。不少朋友问我：外教怎么选？欧美和菲教差在哪？今天把我研究过、也问过上过的朋友的真实情况一家家摊开，整理出来给你们避坑。\n\n📊 几个大牌的公开情况（价格为常见参考，以官方为准）：\n\n🔹 VIPKID —— 北美外教\n✅ 100%持证，口音纯正；教材精致低龄娃爱看；品牌老\n❌ 单价偏高，一节约150–230；热门外教要抢约，换人适应成本高；大套餐退费偏繁琐\n\n🔹 51Talk —— 菲教为主，高频练口语的代表\n✅ 便宜，菲教一节约40–60能天天练；外教基数大好约；老牌师资稳\n❌ 菲教口音参差需筛选；外教不固定要自己约，连贯性一般\n\n🔹 伴鱼 —— 绘本资源强，低龄娃接受度高\n✅ 菲教32–52、欧美120–171双师资灵活；绘本+动画趣味强，娃不抗拒；1个月后可申请固定外教\n❌ 高阶体系偏弱，考级配套不足；大套餐退费限制较多\n\n🔹 Polly English —— 牛津Thinkers正版教材，师资透明\n✅ 菲教45–55、欧美140–155，外教资质全公开；1对1真人，教材正版\n❌ 进国内不久品牌新，长期得自己判断；菲教口音需筛选\n\n💡 但我自己，后来是照着反面选的\n\n你看上面这几家，毛病就那几样：外教基本没法选，分到谁算谁，质量参差不齐；娃刚磨合熟又频繁换人；试的时候那位外教特别优质，正式约却约不到、要抢；再就是劝囤大套餐，身边不少朋友一囤几千上万、低消十几节，想退一堆限制。\n\n而我们现在学的这种，刚好反着来：外教自己挑，挑定了能固定，不随便换；试的KE满意，正式直接约同一位，不用抢；短KE时想练就练，一分不用囤；内容按娃的底子和节奏来，不是一套教材通吃。\n\n不是说哪家不好，只是这四件，是我踩过坑后最在意的。你家要选，也挨个问清再掏钱。\n\n之前聊的英语启蒙，选外教只是其中一步，别本末倒置。\n\n⚠️ 每家情况都不一样，别拿我家的当标准——适合自己家的，才是最好的。\n\n你家给娃选的哪种外教？评论区聊聊，踩过坑的妈妈真不少💬", "tags": "#vipkid怎么样 #51talk怎么样 #伴鱼英语 #Polly #欧美外教和菲教哪个好 #外教一对一 #菲教一对一 #英语启蒙 #陪娃练口语 #深圳妈妈 #怎么选外教", "date": "2026-10-18", "imgs": ["assets/koc_huacha_03_01.jpg", "assets/koc_huacha_03_02.jpg", "assets/koc_huacha_03_03.jpg", "assets/koc_huacha_03_04.jpg", "assets/koc_huacha_03_05.jpg", "assets/koc_huacha_03_06.jpg"], "zip": ""}, {"id": "koc_huacha_04", "folder": "koc_huacha_04", "account": "A08 花花的茶（深圳跨境）", "title": "跨境第三年，香港小学官津/直资/国际怎么选？我说点实话", "body": "住深圳、娃每天过关去香港上学，第三年了🍵\n\n之前聊过香港的两文三语环境，也扒过几家外教，今天顺着把\"学校怎么选\"这件事摊开说。先说清楚：我不是中介，就是一个天天跑口岸的妈，把亲眼看到+问了一圈在读家长的情况整理出来。每种学校都没有绝对的好坏，看你家要什么。\n\n📌 官津（政府资助）\n✅ 学费极低；本地体系，中文根基稳；和官小同轨道\n❌ 英文环境看具体学校，差别不小；班级人数多，个性化照顾有限；跨境生的交通膳食要自家解决\n\n📌 直资（直接资助）\n✅ 政府+学费双轨，价位中等；英文比重高，师资和设备好；海外出口选择多\n❌ 要交学费，学校之间差几倍；热门校竞争激烈，面试环节多\n\n📌 国际学校\n✅ 全英文环境，海外体系；活动多、圈子国际化；适合路线已定出国的家庭\n❌ 学费是三类里最贵的一档；中文机会少；圈子文化和通勤成本要考虑\n\n💡 我的真心话\n\n别问\"哪类最好\"，先问自己三个问题：\n1️⃣ 娃的中文根基想不想抓？想抓→官津/直资的本地体系\n2️⃣ 家庭预算能扛多少年？预算紧→官津优先\n3️⃣ 未来路线定没定出国？定了→国际；没定→直资弹性大\n\n我家当时就是按这三条倒推的，现在回头看，选对了。\n\n⚠️ 两句实话\n\n每所学校的两文三语比例、师生比都不一样，别拿别人家的当标准。\n\n学校没有完美的，适合自己家的节奏和路线，才是最好的。\n\n你家在纠结哪一类？评论区聊聊，跑过十几场开放日的妈真不少💬", "tags": "#香港小学 #香港小学怎么选 #跨境学童 #官津 #直资 #国际学校 #官津直资国际区别 #深圳妈妈 #英语启蒙", "date": "2026-10-24", "imgs": ["assets/koc_huacha_04_01.jpg", "assets/koc_huacha_04_02.jpg", "assets/koc_huacha_04_03.jpg", "assets/koc_huacha_04_04.jpg", "assets/koc_huacha_04_05.jpg", "assets/koc_huacha_04_06.jpg", "assets/koc_huacha_04_07.jpg", "assets/koc_huacha_04_08.jpg", "assets/koc_huacha_04_09.jpg", "assets/koc_huacha_04_10.jpg"], "zip": ""}, {"id": "koc_huacha_05", "folder": "koc_huacha_05", "account": "A08 花花的茶（深圳跨境）", "title": "跨境上学三年，这三类家庭我劝退🍵", "body": "住深圳、每天过关送娃去香港上学的第三年，问我\"要不要也送过去\"的朋友越来越多🤔\n\n先说清楚：我不是中介，没拿任何学校好处，就一个在读家长的实话。香港两文三语环境、全英文教学确实香，但跨境本身有代价，不是挂个深圳户口就能轻松搞定。\n\n这三类家庭，我真心劝你想清楚再动：\n\n第一类，爸妈都上班、家里没老人搭手的。\n过关、校巴、接娃，每天至少得有一个人全天候盯。我家的节奏是早上送、下午接，三年没断过。双职工又没支援的，光通勤就能把人拖垮💔\n\n第二类，娃性格慢热、分离焦虑重的。\n天天过关、换环境、粤语和英文一起砸过来，慢热娃前半年很难受。我家适应了快一年才稳。这类娃不如先在深圳把底子稳住。\n\n第三类，冲着\"香港身份、升学捷径\"来的。", "tags": "#跨境上学 #深港跨境 #香港上学 #深圳妈妈 #两文三语 #香港小学 #跨境学童 #启蒙 #陪娃练口语", "date": "2026-10-29", "imgs": ["assets/koc_huacha_05_01.jpg", "assets/koc_huacha_05_02.jpg", "assets/koc_huacha_05_03.jpg", "assets/koc_huacha_05_04.jpg", "assets/koc_huacha_05_05.jpg"], "zip": ""}, {"id": "koc_huacha_06", "folder": "koc_huacha_06", "account": "A08 花花的茶（深圳跨境）", "title": "决定送娃跨境？这3样不提前备好，前半年会崩溃", "body": "跨境第三年，劝退帖发过好几篇，但有妈妈私信：那要是真决定送了，到底该怎么备？\n\n我不是中介，就一个在读家长的实话。前半年最难的其实不是英文，是这三样，没人提前跟我说：\n\n第一，娃的作息得先调过来。\n香港校早，过关还要时间，我家第一个月每天六点起。没提前两三个月把作息拉过来，开学直接崩。别等开学再调。\n\n第二，娃自己得能管自己。\n过关、换鞋、收书包、记作业，全靠自己。慢热的、依赖强的，先在家练\"自己的事自己做\"，比急着补英文重要。\n\n第三，家里的支援得先排好。\n每天至少得有一个人全天候盯接送。双职工又没老人的，先把\"谁送谁接\"定死，别开学了才吵。\n\n英文反而是最后才愁的——环境一进去，耳朵自己就开了。\n\n之前聊过三类家庭劝退、两文三语环境，这套是\"决定送了怎么备\"：先把这三样搞定，你比中介靠谱。\n\n你家卡在哪一关？评论区聊聊，跨境妈妈互相托底💬", "tags": "#跨境上学 #深港跨境 #香港上学 #深圳妈妈 #跨境准备 #香港小学 #跨境学童 #启蒙 #陪娃练口语", "date": "2026-11-03", "imgs": ["assets/koc_huacha_06_01.jpg", "assets/koc_huacha_06_02.jpg", "assets/koc_huacha_06_03.jpg", "assets/koc_huacha_06_04.jpg", "assets/koc_huacha_06_05.jpg"], "zip": ""}, {"id": "koc_huacha_07", "folder": "koc_huacha_07", "account": "A08 花花的茶（深圳跨境）", "title": "过关那20分钟，我把它变成娃的免费磨耳朵时间", "body": "住深圳每天过关送娃去香港上学，单程差不多20分钟。头一年这20分钟基本浪费在发呆和催娃。\n\n后来我想通了：与其焦虑英文，不如把这碎片时间变成\"磨耳朵\"。不报班、不刷题，就听。\n\n我家的做法很简单，三件事：\n\n第一，上车就放儿歌或分级音频。\n不要求懂，就当背景音，耳朵先熟悉节奏再说。\n\n第二，挑娃感兴趣的放。\n他爱车，就放车相关的简单对话，肯听才有效，硬塞的他自动屏蔽。\n\n第三，不考不问。\n听完绝不问\"听懂没\"，不把磨耳朵变成考试，娃才不抗拒。\n\n坚持半年，最明显的变化是：进了全英文环境他不懵，因为耳朵早就开过门了。\n\n之前聊过决定送了怎么备、英文反而是最后才愁的，这套是\"碎片时间怎么用\"：别小看每天这20分钟。\n\n你家过关或者通勤路上都听点啥？评论区聊聊，跨境妈妈互相抄作业💬", "tags": "#跨境上学 #深港跨境 #香港上学 #深圳妈妈 #磨耳朵 #英语启蒙 #碎片时间 #启蒙 #陪娃练口语", "date": "2026-11-03", "imgs": ["assets/koc_huacha_07_01.jpg", "assets/koc_huacha_07_02.jpg", "assets/koc_huacha_07_03.jpg", "assets/koc_huacha_07_04.jpg", "assets/koc_huacha_07_05.jpg"], "zip": ""}, {"id": "koc_jackmom_02", "folder": "koc_jackmom_02", "account": "A01 广州Jack麻麻（抖音 KOC）", "title": "账号：A01 广州 Jack 妈妈（KOC 软广 · 有教育思考的妈妈视角）", "body": "（可直接发）\n\n**越秀家长还在抢 KET，可政策其实早就改了**\n\n这学期开学，我群里又有人在问：\"要不要给娃报 KET？\"\n\n我本来也心动。后来把越秀区 2026 年的招生细则从头到尾翻了一遍，发现跟我们以为的不太一样。\n\n先说三件白纸黑字的事：\n\n**一、电脑派位跟成绩、证书完全无关。**\n\n招生问答里写得很清楚：派位系统只录电脑号、姓名、性别和志愿，学生的毕业成绩、平时成绩根本不进派位系统。派位当天给每个孩子随机一个九位数号码，按号码和志愿录取，公证处现场公证，参加派位的孩子人人有学位。\n\n**二、2026 年\"均衡分班\"正式写进细则。**\n\n学校必须按随机原则编班、公布编班结果，严禁设重点班、快慢班，也不得以\"国际部\"\"国际课程班\"的名义招生。\n\n**三、免试就近入学，全面取消特长生招生。**\n\n公办初中 95% 以上的生源由就近入学方式确定。\n\n所以结论其实挺硬：如果你家走的是对口直升或者分组派位，KET 对派位结果没有直接作用。这是政策明文，不是我猜的。\n\n但另一头也是真的——禁止重点班之后，分层没有消失，只是挪了地方：挪到简历、面谈、民办、外国语、国际路线那几条路上。这些地方，KET/PET 依然是很多家庭默认的\"通用语言\"。\n\n所以我的判断是这样的：\n\n**KET 既不是智商税，也不是救命稻草，它是一张\"保留选择权\"的票。**\n\n要不要考，先问自己家走哪条路——\n\n**走对口 / 派位** → 真不用为证书焦虑，把钱和时间花在\"孩子能不能真的用英语\"上，回报更实在。\n\n**想冲外国语、民办、国际路线** → 那它基本就是门票。家长圈普遍的说法是时间窗口卡在五升六之前，六年级才起步就来不及了（这是经验之谈，官方不会这么说）。\n\n**最亏的是中间那一类**：路还没想清楚，先砸一笔钱刷个证，考完一扔。证拿到了，能力没长，选择权也没多。\n\n还有一点我自己的感受：2026 之后，越秀这边\"拼学校\"的收益在变小，\"拼孩子真实能力\"的收益在变大。所以 Jack 的英语，我先把\"能开口聊\"放在第一位，证书是顺带的结果，不是目标。\n\n你们家走的是哪条路？评论区说说，我看看是不是我太乐观了。\n\n====================", "tags": "#广州妈妈 #越秀区 #小升初 #广州小升初 #英语启蒙 #少儿英语", "date": "2026-10-15", "imgs": [], "zip": ""}, {"id": "koc_jackmom_03", "folder": "koc_jackmom_03", "account": "A01 广州Jack麻麻（抖音 KOC）", "title": "账号：A01 广州 Jack 妈妈（KOC 软广 · 有教育思考的妈妈视角）", "body": "（可直接发）\n\n**越秀家长抢破头的 KET，派位系统里根本没有这一栏**\n\n先把话说难听一点：如果你家娃走的是越秀的对口直升或者分组派位，KET 这笔钱，大概率是白花的。\n\n别急着骂我。我一开始也准备掏钱，后来把越秀区 2026 年的招生细则和初中招生问答从头翻到尾，才发现我们焦虑的那件事，根本不在那张表上。\n\n招生问答里写得清清楚楚：\n\n派位系统只录电脑号、姓名、性别和志愿。学生的毕业成绩、平时成绩**根本不进派位系统**——学业表现跟派位没有任何关联。派位当天，每个孩子随机一个九位数号码，按号码和志愿录取，公证处现场公证，参加派位的孩子人人有学位。\n\n2026 年起，\"均衡分班\"还正式写进了细则：学校必须按随机原则编班、公布编班结果，严禁重点班、快慢班，也不得以\"国际部\"\"国际课程班\"的名义招生。\n\n再加上免试就近入学、全面取消特长生招生、公办初中 95% 以上的生源由就近入学方式确定——\n\n说白了：**派位这条路上，没有\"证书\"这个变量。**\n\n那 KET 就一无是处吗？也不是。\n\n禁止明面分层之后，分层没有消失，只是挪了地方：挪到简历、面谈、民办、外国语、国际路线那几条路上。在这些地方，KET/PET 依然是很多家庭默认的通用语言。\n\n所以我的判断只有一句：\n\n**证书不是升学门票，它是选择权的价格。**\n\n**走对口 / 派位** → 别为证书焦虑。把这笔钱和时间花在\"孩子能不能真的用英语\"上，回报更实在。\n\n**想冲外国语 / 民办 / 国际路线** → 那它基本就是门票。家长圈普遍的说法是窗口卡在五升六之前，六年级才起步就来不及了（这是经验之谈，官方不会这么说）。\n\n**最亏的是中间那一类**：路还没想清楚，先砸一笔钱刷个证，考完一扔。证拿到了，能力没长，选择权也没多。\n\n我差点就走了第三条路。所以现在 Jack 的英语，我先把\"能开口聊\"放在第一位，证书是顺带的结果，不是目标。\n\n你们家走的是哪条路？评论区说说，我看看是不是我太乐观了。\n\n====================", "tags": "#广州妈妈 #越秀区 #小升初 #广州小升初 #KET #英语启蒙", "date": "2026-10-15", "imgs": ["assets/koc_jackmom_03_01.jpg", "assets/koc_jackmom_03_02.jpg", "assets/koc_jackmom_03_03.jpg", "assets/koc_jackmom_03_04.jpg", "assets/koc_jackmom_03_05.jpg", "assets/koc_jackmom_03_06.jpg", "assets/koc_jackmom_03_07.jpg", "assets/koc_jackmom_03_08.jpg", "assets/koc_jackmom_03_09.jpg", "assets/koc_jackmom_03_10.jpg", "assets/koc_jackmom_03_11.jpg", "assets/koc_jackmom_03_12.jpg", "assets/koc_jackmom_03_13.jpg", "assets/koc_jackmom_03_14.jpg", "assets/koc_jackmom_03_15.jpg"], "zip": ""}, {"id": "koc_momo_phonics_03", "folder": "koc_momo_phonics_03", "account": "A10 Momo拼读课堂", "title": "娃见词能拼，听写却崩了？拼读只练了一半👂", "body": "陪娃学自然拼读几个月，我摔在一个坑上：他看着词能拼出来，我说一个词让他写，他愣住。\n\n见词会读，听词写不出。我以为他不专心，后来才知道，这不是态度问题，是练的结构缺了一半。\n\n🔄 拼读其实有两半\n\n一半是\"看\"：见词能拼，眼睛到嘴。娃练的多数是这半，卡片、绘本跟读，全是练输出。\n\n另一半是\"听\"：听音能辨，耳朵到手。这半最容易被跳过，但拼写的根基恰恰在这——写不出来，多半是没听清这个音在词里长什么样。\n\n🍽 我家补\"耳朵\"的三个土办法\n\n1️⃣ 饭桌\"我说你拼\"：我念一个词，他口头拆音，不写字，就练耳朵。一餐饭三五个词就够\n2️⃣ 拍手数节拍：念个词拍几下，先让他感觉一个词里装了几个音\n3️⃣ 绘本先听后看：翻开新书前两页，先合上书听我念，猜猜是什么词\n\n没有一个是正经\"学\"，全是顺嘴玩。但两周下来，听写那种愣住的表情明显少了😊\n\n✍️ 我的结论\n\n拼读不是背规则，是耳朵先打开。选材料的时候别只问\"教了哪些组合\"，先问\"娃的耳朵有没有被练到\"。\n\n耳朵的功夫到不了，嘴巴练再多也是空的。\n\n你家娃听写崩过吗？都用什么办法练耳朵？评论区交换一下💬", "tags": "#自然拼读 #英语启蒙 #亲子英语 #陪娃练口语 #英语听力 #幼小衔接 #深圳妈妈 #日常说英语", "date": "2026-10-17", "imgs": ["assets/koc_momo_phonics_03_01.jpg", "assets/koc_momo_phonics_03_02.jpg", "assets/koc_momo_phonics_03_03.jpg", "assets/koc_momo_phonics_03_04.jpg", "assets/koc_momo_phonics_03_05.jpg"], "zip": ""}, {"id": "koc_momo_phonics_04", "folder": "koc_momo_phonics_04", "account": "A10 Momo拼读课堂", "title": "自然拼读到底怎么学？我把伴鱼、app、真人外教都试了一遍", "body": "关注我的应该知道，我家娃跟着gem（外教）一KE一KE学自然拼读，一个音纠正8遍那种——\"跟着gem学拼读\"那个系列我一直在更😊\n\n但在找gem之前，我也踩过坑。今天顺着聊：自然拼读到底怎么学才走得通，把试过的几种方式真实摊开说。\n\n一开始图省事，试了某app、也看了伴鱼、51Talk、Polly——规则教得挺清楚，价格也不贵。可娃拼着拼着，拼成了拼音腔，还是不敢开口。后来才明白：拼读关键不是\"学没学规则\"，是\"有没有人肯一遍遍纠正、能不能高频练\"。\n\n📊 几种方式我都扒了：\n\n🔹 自然拼读app / 伴鱼这类 —— 规则清楚、能反复看\n✅ 便宜、随时能学；动画趣味强，低龄娃不抗拒\n❌ 读错了没人当场纠，拼读容易拼成中式英语，娃自己都不知道错；高阶体系偏弱\n\n🔹 欧美外教 —— 纠音地道、表达自然\n✅ 口音准、纠音专业，敢开口后提升快\n❌ 单价高（一节约120–180），很难天天练，钱包扛不住；外教不固定要抢约\n\n🔹 菲教一对一 —— 高频纠音的性价比路线\n✅ 价格友好（一节约40–60），能天天练；外教一遍遍带娃纠音，开口机会多\n❌ 口音有个体差异，得多试几位外教\n\n💡 我的真心话\n\n这几家都能学，看你家节奏和预算——预算紧就高频菲教纠音，追求地道口音就上欧美外教，只想先认规则、培养兴趣，app或绘本类也够用。没有标准答案。\n\n也正是试过错，才更珍惜现在gem这样肯一遍遍纠正的外教。之后\"跟着gem学拼读\"继续更，欢迎来看娃的真实变化。\n\n⚠️ 几句实话\n\n每个娃节奏不一样，别看别人家\"3个月拼读自由\"就焦虑。\n\n自然拼读不是必须砸钱报大牌，但\"有人肯一遍遍纠正\"这件事，挺关键。\n\n你家娃怎么学自然拼读的？还是还在犹豫？评论区聊聊，卡这关的妈妈真不少💬", "tags": "#自然拼读 #伴鱼自然拼读 #Polly #51talk #自然拼读app #真人外教 #菲教一对一 #英语启蒙 #陪娃练口语 #零基础英语 #怎么学自然拼读", "date": "2026-10-18", "imgs": ["assets/koc_momo_phonics_04_01.jpg", "assets/koc_momo_phonics_04_02.jpg", "assets/koc_momo_phonics_04_03.jpg", "assets/koc_momo_phonics_04_04.jpg", "assets/koc_momo_phonics_04_05.jpg", "assets/koc_momo_phonics_04_06.jpg"], "zip": ""}, {"id": "koc_momo_phonics_05", "folder": "koc_momo_phonics_05", "account": "A10 Momo拼读课堂", "title": "娃拼读常踩的3个坑，gem是这样一个个纠的", "body": "关注我的知道，我家娃跟着gem（外教）学自然拼读有段时间了，\"跟着gem学拼读\"系列一直在更😊\n\n今天不聊选哪家，聊点更实在的：娃拼读最常踩的3个坑，gem在课上是怎么一个个纠的。家里有同款娃的，可以对号入座。\n\n坑1️⃣ 拼成\"拼音腔\"\nc 不读 /k/，读成了\"ci\"；a 不读 /æ/，读成了\"阿\"\ngem怎么纠：不急着吼\"不对\"，先让娃摸到嘴巴怎么动——对着镜子看口型，一个音一个音拆慢了带。娃自己发现嘴巴和gem不一样，比家长说一百遍都管用。\n\n坑2️⃣ 见词就乱猜，根本不拼\n看着图猜词，图不认识就直接卡壳\ngem怎么纠：手指指着字母一个一个划，划完再读，立下\"见词就拼\"的规矩。一开始慢，但规矩立住了，后面才快。\n\n坑3️⃣ 单字会拼，连成句就不会\n单个词读得飞起，一到句子就散架\ngem怎么纠：从词到短语再到短句，一级一级来；每句先慢后快，读顺了再提速。娃发现自己能读完一整句的时候，眼睛是亮的。\n\n💡 我最大的感受\n\n拼读这事，\"学规则\"几天就够，\"改习惯\"要以月算。有个肯一遍遍纠的人在身边，比刷十本练习册管用。\n\n家里有同款坑的，评论区聊聊，卡第几个了👇", "tags": "#自然拼读 #孩子拼读 #自然拼读常见错误 #拼读发音 #自然拼读怎么学 #英语启蒙 #陪娃练口语 #亲子英语", "date": "2026-10-24", "imgs": ["assets/koc_momo_phonics_05_01.jpg", "assets/koc_momo_phonics_05_02.jpg", "assets/koc_momo_phonics_05_03.jpg", "assets/koc_momo_phonics_05_04.jpg", "assets/koc_momo_phonics_05_05.jpg", "assets/koc_momo_phonics_05_06.jpg", "assets/koc_momo_phonics_05_07.jpg", "assets/koc_momo_phonics_05_08.jpg", "assets/koc_momo_phonics_05_09.jpg", "assets/koc_momo_phonics_05_10.jpg", "assets/koc_momo_phonics_05_11.jpg", "assets/koc_momo_phonics_05_12.jpg", "assets/koc_momo_phonics_05_13.jpg", "assets/koc_momo_phonics_05_14.jpg", "assets/koc_momo_phonics_05_15.jpg"], "zip": ""}, {"id": "koc_momo_phonics_06", "folder": "koc_momo_phonics_06", "account": "A10 Momo拼读课堂", "title": "试了伴鱼和Polly之后，我还是决定继续跟着gem这么学", "body": "关注我的应该知道，我家娃跟着gem（外教）一KE一KE学自然拼读，一个音纠正8遍那种——\"跟着gem学拼读\"那个系列我一直在更😊\n\n但前阵子，我还是好奇，去试了一阵子伴鱼和Polly。不是因为gem不好，是想看看大牌那种标准化方式，会不会更适合我们。试完一段时间，加上身边妈妈们踩过的坑，今天掏心窝说。\n\n🔹 先说它们好的地方\n伴鱼绘本资源强、低龄娃接受度高；Polly牛津教材正版、师资透明，体系完整。这点我不否认，适合想稳稳跟着走的家庭。\n\n🔹 但对比下来，我现在这种一对一（短KE时）赢在这四点，都是真实踩出来的：\n✅ 外教质量：随便选不踩雷。之前试过的地方，水平参差还频繁换人，娃刚跟一位磨合熟，又来新面孔，几乎每次从头再来\n✅ 约固定外教：试的KE满意，就能直接约到同一位长期跟。很多地方先试的那位特别优质，轮到正式约KE却怎么都约不到、排期排到怀疑人生\n✅ 不囤KE：短KE时一次只买几节，随买随约没压力。身边不少朋友一囤就是几千上万、还有低消十几节的，娃后来不想上了，退都退不掉\n✅ 内容按娃定制：根据娃发音底子和节奏安排，哪里弱补哪里。别家基本一套教材所有人通用，千人一面\n\n而我跟gem一直是：高频+短时+固定外教+按娃节奏来。娃不累，错音当场改，记忆不断片。\n\n💡 所以我还是决定：继续跟着gem这么学。\n不是伴鱼Polly不好，是这四点刚好都是我们家最在意的。有些\"不顺\"对我是真不顺，对别人可能根本不是事。\n\n📌 一句实话\n选一对一别看名气，就问四件事：外教稳不稳？试完约不约得到？要不要大额囤？内容是不是按娃来的？四个都过关再掏钱，能省一大笔冤枉钱。\n\n你家选的时候踩过哪个坑？评论区聊聊，帮后来人避雷💬", "tags": "#自然拼读 #伴鱼英语 #Polly #菲教一对一 #英语启蒙 #陪娃练口语 #零基础英语 #短KE时 #怎么学自然拼读 #外教一对一", "date": "2026-10-19", "imgs": ["assets/koc_momo_phonics_06_01.jpg"], "zip": ""}, {"id": "koc_momo_phonics_07", "folder": "koc_momo_phonics_07", "account": "A10 Momo拼读课堂", "title": "零基础跟外教拼读，这3类外教我直接pass🧸", "body": "零基础带娃跟外教学自然拼读，前后试过好几个，现在固定跟 gem 那位外教。\n\n不是凑合，是踩过坑才定下来的。给同样在挑外教的朋友，说点大实话：这3类外教，我直接pass🤔\n\n第一类，全程照PPT念、不纠正发音的。\n拼读最核心就是发音准。外教自己读得飘、娃错了也不纠，学完还是错的。gem 会一遍遍把嘴型示范给娃看，错了当场纠，这才叫在教🗣️\n\n第二类，太活泼、控不住场的。\n零基础娃坐不住，外教光逗不教，全程热热闹闹，娃啥也没留下。我要的是\"娃被带着往前走\"，不是综艺现场。\n\n第三类，一套教材通吃、不按娃节奏来的。\n每个娃卡的点不一样，有的卡在 th，有的卡在辅音簇。不观察、不调整，只会往前翻页的，pass。\n\n好外教长什么样？肯纠、控得住、看得见娃。我家的标准就这三条，简单但够用。\n\n之前聊过\"跟着gem学拼读\"、拼读常踩的坑、试了伴鱼Polly还是跟gem，这套是挑人那篇：不是贵就好，是合不合适🎯\n\n你家娃跟的外教，敢不敢纠发音？评论区聊聊，挑外教我有点经验💬", "tags": "#自然拼读 #拼读 #启蒙 #外教一对一 #跟外教学拼读 #零基础拼读 #自然拼读怎么学 #拼读纠正 #家长选外教 #陪娃练口语", "date": "2026-10-29", "imgs": ["assets/koc_momo_phonics_07_01.jpg", "assets/koc_momo_phonics_07_02.jpg", "assets/koc_momo_phonics_07_03.jpg", "assets/koc_momo_phonics_07_04.jpg", "assets/koc_momo_phonics_07_05.jpg"], "zip": ""}, {"id": "koc_momo_phonics_08", "folder": "koc_momo_phonics_08", "account": "A10 Momo拼读课堂", "title": "零基础拼读，我让娃先练这3组音（不是按字母表）", "body": "之前聊过\"3类外教直接pass\"，有妈妈问：那零基础到底从哪组音开始？\n\n我也不是啥专家，就一个陪读妈的实话。别急着按 A-B-C 顺，前几组我让娃先吃这三块：\n\n第一组，单辅音里最常用的 s、a、t、p。\nsat、pat、tap，三个音能拼一堆词。先让娃尝到\"拼出来\"的爽，比背字母名有用。\n\n第二组，短元音 a（CVC 结构）。\ncat、map、pan，一个元音撑起一整类。娃懂了\"元音是骨架\"，后面不慌。\n\n第三组，最容易混的 th 和 sh。\n这两个不早分，以后读全错。跟 gem 的时候他特意慢下来，一遍遍纠嘴型，我现在也盯着这俩。\n\n顺序比教材进度重要。那种急着自己翻页、一套通吃的，就是我说的该pass那种。\n\n之前聊过挑外教、跟 gem 学拼读，这套是\"从哪开始\"：先把这三组吃透，再往前走。\n\n你家娃卡在哪组音？评论区聊聊，拼读坑我踩过不少🧸", "tags": "#自然拼读 #拼读 #启蒙 #外教一对一 #跟外教学拼读 #零基础拼读 #自然拼读怎么学 #拼读顺序 #家长选外教 #陪娃练口语", "date": "2026-11-03", "imgs": ["assets/koc_momo_phonics_08_01.jpg", "assets/koc_momo_phonics_08_02.jpg", "assets/koc_momo_phonics_08_03.jpg", "assets/koc_momo_phonics_08_04.jpg", "assets/koc_momo_phonics_08_05.jpg"], "zip": ""}, {"id": "koc_momo_phonics_09", "folder": "koc_momo_phonics_09", "account": "A10 Momo拼读课堂", "title": "拼读卡壳，我用\"听音拆字\"小游戏拉回来的", "body": "零基础跟外教拼读，最怕的不是不会，是卡住后娃开始躲。之前聊过先练哪三组音、哪类外教要直接pass，今天说个我家的救场小游戏。\n\n娃有阵子一拼就卡，我急，他也烦。后来不硬拼了，改成\"听音拆字\"：\n\n第一，我说一个词，让娃先听。\n不急着读，先把音听进去，耳朵在线了再动手。\n\n第二，让娃把词拆成几块。\n比如拼读里一个简单的词，听成三块音，用手比划一块块拆开。\n\n第三，拆对了再拼回去。\n能拆就能拼，顺序一反过来，娃一下就通了。\n\n全程像玩，不考试。跟外教的时候他也用这招，慢慢来、纠嘴型。\n\n之前聊过挑外教、先练三组音，这套是\"卡了怎么玩着破\"：能拆音，拼读就通了一半。\n\n你家娃卡在哪组音？评论区聊聊，拼读坑我踩过不少🧸", "tags": "#自然拼读 #拼读 #启蒙 #外教一对一 #跟外教学拼读 #零基础拼读 #自然拼读怎么学 #拼读游戏 #家长选外教 #陪娃练口语", "date": "2026-11-03", "imgs": ["assets/koc_momo_phonics_09_01.jpg", "assets/koc_momo_phonics_09_02.jpg", "assets/koc_momo_phonics_09_03.jpg", "assets/koc_momo_phonics_09_04.jpg", "assets/koc_momo_phonics_09_05.jpg"], "zip": ""}, {"id": "koc_momo_raz_01", "folder": "koc_momo_raz_01", "account": "A09 分级账本Momo（RAZ）", "title": "刷RAZ 8个月，从AA到H，我把进度做成了账本📒", "body": "8个月，从 AA 到 H。\n\n不是娃天赋异禀，是我把进度做成了账本，每个月记一页，记满了8页✨\n\n翻回去看，比任何话术都让我安心。\n\n📖 我的账本长这样\n\n1月 AA 12本 每天10分钟\n2月 AA 18本 每天10分钟\n3月 B 20本 每天15分钟\n4月 C 22本 每天15分钟\n5月 D 25本 每天20分钟\n6月 E 28本 每天20分钟\n7月 F 30本 每天20分钟\n8月 H 32本 每天25分钟\n\n数字不好看，但每一页都是真的。\n本数是自己数的，用时是计时器掐的，级别是测出来的⏱️\n\n盯了8个月，我发现真正有用的不是级别，是这三件事👇\n\n1️⃣ 每天的分钟数\n级别会卡，分钟数不会骗人。有一个月娃卡在C级不动，我差点以为方法错了。翻账本才发现：那个月我加班，每天只读5分钟。把分钟数拉回来，两周就过级了。\n\n2️⃣ 重复读的次数\n同一本读三遍，比换三本新书有用。娃第二遍才能读懂笑点，第三遍才愿意自己指着读。我以前急着往前刷，其实是白刷📚\n\n3️⃣ 娃主动翻书的频率\n不用催就拿起来，才是真进去了。我在账本最后一列画小星星，一周有三颗星，我就知道这段时间成了习惯⭐\n\n账本怎么记？就三行，不用买专门的本子：\n\n记分钟数，计时器一按，读完就记，别靠印象\n记本数，读完一本划一本，月底一数就知道\n记娃的反应，哪本自己笑出声、哪本不想读，写一句\n\n一张A4纸就够。坚持记三个月，你会谢谢自己☺️\n\n级别是结果，习惯才是原因。\n\n8个月，AA到H。没有天赋异禀，只有一天一天🌱\n\n如果你也在刷分级，评论区聊聊进度，我对账本很有经验，可以帮你看看卡在哪～", "tags": "#RAZ #分级阅读 #英语启蒙 #陪娃读英语 #牛津树 #英语启蒙这样做 #亲子阅读 #普通家庭英语启蒙 #妈妈的学习记录 #英语分级", "date": "2026-10-17", "imgs": ["assets/koc_momo_raz_01_01.jpg", "assets/koc_momo_raz_01_02.jpg", "assets/koc_momo_raz_01_03.jpg", "assets/koc_momo_raz_01_04.jpg", "assets/koc_momo_raz_01_05.jpg", "assets/koc_momo_raz_01_06.jpg", "assets/koc_momo_raz_01_07.jpg", "assets/koc_momo_raz_01_08.jpg", "assets/koc_momo_raz_01_09.jpg", "assets/koc_momo_raz_01_10.jpg", "assets/koc_momo_raz_01_11.jpg", "assets/koc_momo_raz_01_12.jpg", "assets/koc_momo_raz_01_13.jpg", "assets/koc_momo_raz_01_14.jpg", "assets/koc_momo_raz_01_15.jpg", "assets/koc_momo_raz_01_16.jpg", "assets/koc_momo_raz_01_17.jpg"], "zip": ""}, {"id": "koc_momo_raz_02", "folder": "koc_momo_raz_02", "account": "A09 分级账本Momo（RAZ）", "title": "RAZ卡级别别硬刷，陪娃刷到H级后我悟了", "body": "老粉知道，我家\"外教一对一学RAZ\"这个系列记了很久，从「第180天-H级别」那篇开始，越来越多妈妈在评论区问：卡住了怎么办📖\n\n今天不晒进度，专聊卡点——娃刷RAZ卡在某个级别上不去，多是这三个隐形问题，不一定是\"不够努力\"。\n\n📊 卡点1：级别跳太快，地基松\n表现：看着读得顺，一提问就错；换个问法就懵\n账本记法：我会标\"伪熟练\"——读对了但其实没懂的，单独记一笔\n怎么破：退回低一级，把理解补上再往上走。慢一周，快一个月。\n\n📊 卡点2：只刷不读，输入变成走过场\n表现：每天刷完就完，问讲了什么说不出来\n账本记法：每本记一句\"娃用自己的话讲了啥\"\n怎么破：读完后让娃用一句话复述，说不出来的重读。复述比遍数重要。\n\n📊 卡点3：外教那边和家里各刷各的\n表现：外教反馈的弱项，家里没接住；家里刷的，课上用不上\n账本记法：每周日对齐一次——外教反馈的弱项=下周家里刷的重点\n怎么破：让两条线互相喂，别各走各的。\n\n💡 刷到H级后我悟了\n\nRAZ不是\"刷完多少本\"，是\"每一本真的过了脑子\"。账本上最有用的数字，不是天数，是娃讲出来的那句话。\n\n卡住的妈，评论区说下卡在哪个级别，我帮你看看先补啥👇", "tags": "#RAZ #分级阅读 #RAZ刷级 #RAZ卡级 #分级阅读怎么刷 #英语启蒙 #陪娃读绘本 #英语打卡", "date": "2026-10-24", "imgs": ["assets/koc_momo_raz_02_01.jpg", "assets/koc_momo_raz_02_02.jpg", "assets/koc_momo_raz_02_03.jpg", "assets/koc_momo_raz_02_04.jpg", "assets/koc_momo_raz_02_05.jpg", "assets/koc_momo_raz_02_06.jpg", "assets/koc_momo_raz_02_07.jpg", "assets/koc_momo_raz_02_08.jpg", "assets/koc_momo_raz_02_09.jpg", "assets/koc_momo_raz_02_10.jpg", "assets/koc_momo_raz_02_11.jpg", "assets/koc_momo_raz_02_12.jpg", "assets/koc_momo_raz_02_13.jpg", "assets/koc_momo_raz_02_14.jpg", "assets/koc_momo_raz_02_15.jpg", "assets/koc_momo_raz_02_16.jpg"], "zip": ""}, {"id": "koc_momo_raz_03", "folder": "koc_momo_raz_03", "account": "A09 分级账本Momo（RAZ）", "title": "陪娃刷RAZ大半年，我把\"进步\"重新定义了📒", "body": "陪娃刷RAZ，从AA到H，大半年记满了账本。\n\n之前发过\"第180天到H级别\"的进度，好多妈妈问：怎么判断娃真进步了？我以前也只盯级别，后来发现级别会骗人🤔\n\n举个真实的：有阵子娃卡在C级，级别纹丝不动，我差点以为方法错了。翻账本才发现，那阵子我忙，每天只肯读5分钟。把时间拉回来，两周就过了。\n\n所以我现在的\"进步\"，不看级别，看这三件真东西：\n\n第一，肯自己翻书了吗。\n不催就拿起书，才是真进去了。我在账本最后一列画星星，一周三颗星，我就知道习惯成了🌟\n\n第二，敢开口用了吗。\n读RAZ不只是念，是能蹦出词。有天娃突然用绘本里的词跟我顶嘴，我反而乐了——这说明他真懂了😆\n\n第三，听力跟得上吗。\n我说外语他能不能接下一句，比认了多少词更准。能接，就是耳朵开了。\n\n级别是结果，习惯和耳朵才是原因。\n\n之前聊过卡级别别硬刷、账本怎么记，这套是续集：不焦虑级别，盯住这三件，你比任何测评都清楚娃在哪。\n\n你家刷到哪一级了？评论区报个数，卡住的我帮看看📩", "tags": "#RAZ #分级阅读 #启蒙 #陪娃共读 #RAZ卡级 #分级阅读怎么刷 #亲子阅读 #普通家庭启蒙 #RAZ进度 #妈妈的学习记录", "date": "2026-10-29", "imgs": ["assets/koc_momo_raz_03_01.jpg", "assets/koc_momo_raz_03_02.jpg", "assets/koc_momo_raz_03_03.jpg", "assets/koc_momo_raz_03_04.jpg", "assets/koc_momo_raz_03_05.jpg"], "zip": ""}, {"id": "koc_momo_raz_04", "folder": "koc_momo_raz_04", "account": "A09 分级账本Momo（RAZ）", "title": "陪娃刷RAZ，我这本账就3栏，够用", "body": "之前发过\"不盯级别、盯三件真东西\"，好多妈妈问：那账本到底怎么记？\n\n我也不是啥专家，就一个陪读妈的土办法。我把一整本精简成3栏，记了半年没断过：\n\n第一栏，日期加读了哪本。\n不写级别，写书名。翻起来像日记，娃也有成就感。每天一行，三十秒。\n\n第二栏，今天卡在哪。\n哪个词不会、哪页卡壳，写两个字。卡级的时候回看，一眼看出是\"读太少\"还是\"真不会\"。\n\n第三栏，三颗星。\n肯自己翻书🌟、敢开口用🌟、耳朵跟得上🌟。一周三颗齐，习惯就成了。\n\n就这么三栏，不花哨。重点不是记，是回看——卡了翻一翻，比任何测评都准。\n\n之前聊过进步怎么看、级别会骗人，这套是\"怎么记\"：别买花哨表格，一支笔一张纸就开。\n\n你家怎么记？评论区晒晒，抄作业我也乐意📒", "tags": "#RAZ #分级阅读 #启蒙 #陪娃共读 #RAZ怎么刷 #分级阅读怎么刷 #亲子阅读 #普通家庭启蒙 #妈妈的学习记录 #阅读记录", "date": "2026-11-03", "imgs": ["assets/koc_momo_raz_04_01.jpg", "assets/koc_momo_raz_04_02.jpg", "assets/koc_momo_raz_04_03.jpg", "assets/koc_momo_raz_04_04.jpg", "assets/koc_momo_raz_04_05.jpg"], "zip": ""}, {"id": "koc_momo_raz_05", "folder": "koc_momo_raz_05", "account": "A09 分级账本Momo（RAZ）", "title": "卡级别硬刷，我让娃\"横着读\"破的局", "body": "陪娃刷分级阅读，卡在某一本级好几个月不动，是最磨人的。之前发过账本怎么记、进步怎么看，今天说个具体破局法。\n\n我以前卡级就催：\"快升下一级！\"结果娃越刷越烦，账本上\"今天卡在哪\"全是问号。\n\n后来换成\"横着读\"：同一个级别，不急着往上，先把这个级别的书横向铺开读。\n\n具体三步：\n\n第一，同级别挑5到8本不同的书。\n主题换着来，娃不腻，每本都像新的一样。\n\n第二，每本只抓一个重点。\n这本练流利、那本练某个词，别本本都求全，贪多反而卡更久。\n\n第三，读顺了再升。\n同一级别能轻松读下来，才是真懂，不是级别数字到了。\n\n横着读一个月，娃从\"怕翻开\"变\"自己拿书\"。级别后来自然就上去了。\n\n之前聊过卡级别别硬刷、账本记\"卡在哪\"，这套是\"卡了怎么办\"：别跟数字较劲，跟理解较劲。\n\n你家卡在哪一级了？评论区报个数，我帮看看📒", "tags": "#RAZ #分级阅读 #启蒙 #陪娃共读 #RAZ卡级 #分级阅读怎么刷 #RAZ怎么刷 #亲子阅读 #普通家庭启蒙 #妈妈的学习记录", "date": "2026-11-03", "imgs": ["assets/koc_momo_raz_05_01.jpg", "assets/koc_momo_raz_05_02.jpg", "assets/koc_momo_raz_05_03.jpg", "assets/koc_momo_raz_05_04.jpg", "assets/koc_momo_raz_05_05.jpg"], "zip": ""}, {"id": "koc_v1_01", "folder": "koc_v1_01", "account": "KOC 系列（待归类）", "title": "私信「试听」领免费体验课", "body": "", "tags": "#外教课 #少儿英语 #口语", "date": "2026-11-01", "imgs": [], "zip": ""}, {"id": "koc_v1_02", "folder": "koc_v1_02", "account": "KOC 系列（待归类）", "title": "私信「试听」领免费体验课", "body": "", "tags": "#外教课 #少儿英语 #口语", "date": "2026-11-01", "imgs": [], "zip": ""}, {"id": "koc_v1_03", "folder": "koc_v1_03", "account": "KOC 系列（待归类）", "title": "私信「试听」领免费体验课", "body": "", "tags": "#外教课 #少儿英语 #口语", "date": "2026-11-01", "imgs": [], "zip": ""}, {"id": "koc_xiaobaige_01", "folder": "koc_xiaobaige_01", "account": "A11 小白哥的锅（广州宝爸）", "title": "给娃做了300天早餐，我顺带把英语启蒙做了📒", "body": "不是有计划，是被逼的。\n\n娃坐在对面，指着鸡蛋问这问那。我一边翻锅一边想：嘴里闲着也是闲着，说中文不如说英语。\n\n就这样，早餐桌成了我家唯一的英语环境🍳\n\n我在饭桌上说的，全是这几个场景：\n\n煎蛋的时候：The egg is hot. Blow it first.\n递牛奶的时候：Here's your milk. Careful, don't spill.\n娃挑食的时候：One more bite. You can do it.\n吃完的时候：Yum yum! Who helped clean the table?\n\n就这么几句，翻来覆去说。\n\n三个月后，娃自己指着鸡蛋说了句 The egg is hot。\n\n我锅铲都拿歪了🥄\n\n后来我才知道，这叫「可理解输入」\n\n不是教，是天天在同一个场景说同一句话。娃不用背，看图听声，自然对上。\n\n我也踩过坑。一开始给娃放英文儿歌当背景音，放了半年，娃会哼调，一个词都不会说🎶\n\n后来明白了：没有画面和动作的声音，对娃来说就是噪音。\n\n有场景的一句话，胜过一小时音频🥛\n\n现在娃在跟外教练口语，我反而轻松了\n\n有人问我在哪学的。\n\n实话是，我英语很普通，发音也一般。我做的只是把「敢说」这件事演给娃看。\n\n真正系统的练习，是娃跟外教一起练的。外教一句一句带，错了笑着让娃再来一次，比我有耐心得多。\n\n我在家就干一件事：饭桌上接着随口说。\n\n爸爸先不害怕，娃才不会害怕👨‍🍳\n\n你家饭桌上，都跟娃说点啥？评论区聊聊，我攒了一堆「早餐桌常用句」，挑几句送你～", "tags": "#英语启蒙 #饭桌英语 #亲子英语 #陪娃学英语 #英语启蒙这样做 #爸爸带娃 #广州爸爸 #普通家庭英语启蒙 #幼儿英语启蒙 #生活英语", "date": "2026-10-17", "imgs": ["assets/koc_xiaobaige_01_01.jpg", "assets/koc_xiaobaige_01_02.jpg", "assets/koc_xiaobaige_01_03.jpg", "assets/koc_xiaobaige_01_04.jpg", "assets/koc_xiaobaige_01_05.jpg", "assets/koc_xiaobaige_01_06.jpg", "assets/koc_xiaobaige_01_07.jpg", "assets/koc_xiaobaige_01_08.jpg", "assets/koc_xiaobaige_01_09.jpg", "assets/koc_xiaobaige_01_10.jpg"], "zip": ""}, {"id": "koc_xiaobaige_02", "folder": "koc_xiaobaige_02", "account": "A11 小白哥的锅（广州宝爸）", "title": "陪娃跟外教练了60天口语，娃开始催我了🗣️", "body": "不是催我做饭，是催我开口说英语。\n\n以前都是我推着娃：该练了，该读了。60天后反过来了，娃早上爬起来第一句：爸爸，today我们说什么？\n\n📅 一个宝爸的60天记录，笨办法，但有用\n\n第1周：娃光笑，不说话。外教也不急，就重复。\n第2周：娃开始蹦单词。apple，egg，more。\n第3到4周：娃能接整句了。外教说一句，他跟一句。\n第2个月：娃开始纠正我。我把banana说成ba-NA-na，他说不对，是ba-NAN-a。\n\n那一下我突然懂了：娃不是学会了英语，是学会了不怕说错。\n\n👨‍🍳 外教做对的三件事，我在家照着搬\n\n第一，一次只纠一个音。抓一堆错，娃会挫败，一个就够了。\n第二，错了不批评。外教笑着说 Almost，让娃再来一次，娃就真的愿意再来。\n第三，让娃反过来教你。娃教外教一句，比自己读十遍都认真。回家我照搬：他教我一个，我故意读错让他纠。\n\n这套我在饭桌上也用。一边给娃盛汤一边练，谁都没觉得在学🍲\n\n变化不止在英语上\n\n敢开口了。敢纠我了。敢在饭桌上说整句话了。\n\n这些比「会多少词」值钱得多。\n\n60天，说长不长，说短不短。没什么天赋异禀，就是一天20分钟，外加一个不凶的大人☀️\n\n如果你也在陪娃练口语，评论区聊聊卡在哪。我这儿有份「宝爸陪练笔记」，或许你能用上💬", "tags": "#陪娃练口语 #英语启蒙 #亲子英语 #爸爸带娃 #广州宝爸 #英语启蒙这样做 #外教 #普通家庭英语启蒙 #幼儿英语启蒙 #口语天天练", "date": "2026-10-17", "imgs": ["assets/koc_xiaobaige_02_01.jpg", "assets/koc_xiaobaige_02_02.jpg", "assets/koc_xiaobaige_02_03.jpg", "assets/koc_xiaobaige_02_04.jpg", "assets/koc_xiaobaige_02_05.jpg", "assets/koc_xiaobaige_02_06.jpg", "assets/koc_xiaobaige_02_07.jpg", "assets/koc_xiaobaige_02_08.jpg", "assets/koc_xiaobaige_02_09.jpg", "assets/koc_xiaobaige_02_10.jpg"], "zip": ""}, {"id": "koc_xiaobaige_03", "folder": "koc_xiaobaige_03", "account": "A11 小白哥的锅（广州宝爸）", "title": "第31餐丨娃爱吃的小炒黄牛肉，怎样炒才嫩？🥩", "body": "这个问题我被问过太多次了。今天写个娃也能吃的版本。\n\n不辣。嫩。十分钟上桌。\n\n选肉：别用牛里脊，用牛霖或者黄瓜条\n\n很多教程让买里脊。里脊是嫩，但贵，炒大了反而柴。\n\n娃吃的话，我推荐牛霖。便宜，嫩度够，肉质细。\n\n切法记住一句话：横切牛羊竖切猪。逆着纹路切，怎么切都不老。\n\n腌肉：一斤肉，一勺水，半勺油\n\n分三次加水，每次抓匀到吸干了再加水。这是嫩的关键，比加淀粉重要。\n\n再来点生抽、一点点糖，抓匀，最后封一层油。\n\n油封住，肉不出水，下锅才嫩。\n\n火候：热锅凉油，滑散就出锅🔥\n\n油不用多，锅要烧到冒烟再下肉。下去别马上翻，等五秒定型，滑散，变色就盛出来。\n\n全程大火。家里灶火力不够的，肉分两次炒，别一锅全下去。\n\n娃吃版调味：不加辣，加点甜🥕\n\n糟辣椒、剁椒全部去掉。来点蚝油、生抽、一点点糖。\n\n配菜用娃爱吃的：彩椒、洋葱、胡萝卜。洋葱炒软是甜的，娃不抗拒。\n\n我娃最爱用这个汤汁拌饭，一碗饭干干净净。\n\n一句话总结🔥\n\n横切竖切别搞反，加水抓匀再封油，大火快炒不过火。\n\n三个坑避开，你想炒柴都难。\n\n你家娃爱吃牛肉吗？评论区说说，我看看「第32餐」做啥😋", "tags": "#小炒黄牛肉 #牛肉怎样炒才嫩 #家常菜 #爸爸下厨 #广州美食 #带娃日常 #美食教程 #娃爱吃 #下饭菜 #厨房小技巧", "date": "2026-10-17", "imgs": ["assets/koc_xiaobaige_03_01.jpg", "assets/koc_xiaobaige_03_02.jpg", "assets/koc_xiaobaige_03_03.jpg", "assets/koc_xiaobaige_03_04.jpg", "assets/koc_xiaobaige_03_05.jpg", "assets/koc_xiaobaige_03_06.jpg", "assets/koc_xiaobaige_03_07.jpg", "assets/koc_xiaobaige_03_08.jpg", "assets/koc_xiaobaige_03_09.jpg", "assets/koc_xiaobaige_03_10.jpg"], "zip": ""}, {"id": "kos_v2_01", "folder": "kos_v2_01", "account": "A01 广州Jack麻麻（抖音 KOC）", "title": "私信「试听」领免费体验课", "body": "", "tags": "#外教课 #少儿英语 #口语", "date": "2026-11-01", "imgs": [], "zip": ""}, {"id": "kos_v2_01.bak_1789995440", "folder": "kos_v2_01.bak_1789995440", "account": "A01 广州Jack麻麻（抖音 KOC）", "title": "私信「试听」领免费体验课", "body": "", "tags": "#外教课 #少儿英语 #口语", "date": "2026-11-01", "imgs": [], "zip": ""}, {"id": "kos_v2_01.bak_1789997132", "folder": "kos_v2_01.bak_1789997132", "account": "A01 广州Jack麻麻（抖音 KOC）", "title": "私信「试听」领免费体验课", "body": "", "tags": "#外教课 #少儿英语 #口语", "date": "2026-11-0 var published = {};
Object.assign(published, DATA.published || {});
try { var _ls = JSON.parse(localStorage.getItem('postboard_pub')||'{}'); Object.assign(published, _ls); } catch(e){}
var state = { acc:null, q:'', status:'all' };

function accKey(a){ var m=a.match(/A\d+/); return m?m[0]:a; }
function sortAcc(arr){ return arr.slice().sort(function(a,b){ return accKey(a)<accKey(b)?-1:1; }); }
function postsOf(acc){ return DATA.posts.filter(function(p){ return p.account===acc; }); }
function isPub(id){ return !!published[id]; }

function gate(){
  var v = document.getElementById('pw').value;
  if(v === PWD){ document.getElementById('gate').style.display='none'; document.getElementById('app').style.display='block';
    if(sessionStorage.getItem('pb_ok')!=='1') sessionStorage.setItem('pb_ok','1'); render(); }
  else { document.getElementById('pwerr').textContent='密码错误'; }
}
if(sessionStorage.getItem('pb_ok')==='1'){ document.getElementById('gate').style.display='none'; document.getElementById('app').style.display='block'; render(); }

function saveLocal(){ try{ localStorage.setItem('postboard_pub', JSON.stringify(published)); }catch(e){} }
function showToast(t){ var el=document.getElementById('toast'); el.textContent=t||'已复制 ✅'; el.classList.add('show'); setTimeout(function(){el.classList.remove('show');},1400); }
function copyText(t){ if(navigator.clipboard){ navigator.clipboard.writeText(t).then(function(){showToast();},fallback); } else fallback();
  function fallback(){ var ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(e){} ta.remove(); showToast(); } }

function render(){
  document.getElementById('subline').textContent = '共 '+DATA.posts.length+' 篇 · '+sortAcc(Object.keys(groupByAcc())).length+' 个账号 · 已发布 '+Object.keys(published).filter(function(k){return published[k];}).length+' 篇';
  renderSidebar(); renderList();
}
function groupByAcc(){ var g={}; DATA.posts.forEach(function(p){ (g[p.account]=g[p.account]||[]).push(p); }); return g; }

function renderSidebar(){
  var g = groupByAcc(); var accs = sortAcc(Object.keys(g));
  var html = '<div class="ah">账号（点击切换）</div>';
  html += '<div class="acc-item '+(state.acc===null?'active':'')+'" onclick="pickAcc(null)">全部账号 <span class="cnt">'+DATA.posts.length+'</span></div>';
  accs.forEach(function(a){
    var tot=g[a].length, pub=g[a].filter(function(p){return isPub(p.id);}).length;
    html += '<div class="acc-item '+(state.acc===a?'active':'')+'" onclick="pickAcc('+arg(a)+')">'+esc(a)+' <span class="cnt">'+pub+'/'+tot+'</span></div>';
  });
  document.getElementById('sidebar').innerHTML = html;
}
function pickAcc(a){ state.acc=a; renderSidebar(); renderList(); }

function renderList(){
  state.q = document.getElementById('q').value.trim().toLowerCase();
  state.status = document.getElementById('status').value;
  var g = groupByAcc(); var accs = sortAcc(Object.keys(g));
  var html='';
  accs.forEach(function(a){
    if(state.acc && state.acc!==a) return;
    var ps = g[a].slice().sort(function(x,y){ return (y.date||'').localeCompare(x.date||''); });
    var shown=[];
    ps.forEach(function(p){
      var hay=(p.account+' '+p.title+' '+p.body).toLowerCase();
      if(state.q && hay.indexOf(state.q)<0) return;
      if(state.status==='pub' && !isPub(p.id)) return;
      if(state.status==='unpub' && isPub(p.id)) return;
      shown.push(p);
    });
    if(!shown.length) return;
    html += '<div class="sec-h">'+esc(a)+' <span class="cnt">'+shown.length+' 篇</span></div>';
    shown.forEach(function(p){
      var b = isPub(p.id) ? '<span class="badge pub">已发布</span>' : '<span class="badge unpub">未发布</span>';
      html += '<div class="row" onclick="openDetail('+arg(p.id)+')">'
            + '<span class="date">'+esc(p.date||'')+'</span>'
            + '<span class="ttl">'+esc(p.title)+'</span>'+ b +'</div>';
    });
  });
  if(!html) html = '<div class="empty">没有匹配的帖子</div>';
  document.getElementById('list').innerHTML = html;
}

function openDetail(id){
  var p = DATA.posts.filter(function(x){return x.id===id;})[0]; if(!p) return;
  var imgs = (p.imgs||[]).map(function(s,i){
    return '<div class="gi"><img class="ph" src="'+esc(s)+'" alt="'+esc(p.folder)+'">'
         + '<a class="di" href="'+esc(s)+'" download title="下载这张">⬇</a></div>';
  }).join('');
  var imgBlock = imgs ? ('<div class="blk"><div class="lab">本篇图片（'+p.imgs.length+' 张）</div><div class="gal">'+imgs+'</div>'
         + '<button class="btn" onclick="dlAll()">⬇ 下载本篇全部图片</button></div>') : '';
  var tagsBlock = p.tags ? '<div class="blk"><div class="lab">话题标签</div><div class="tags">'+esc(p.tags)+'</div>'
         + '<button class="btn" onclick="copyText('+arg(p.tags)+')">📋 复制标签</button></div>' : '';
  var pubBtn = isPub(p.id)
    ? '<button class="btn pub-on" id="pubBtn" onclick="togglePub('+arg(p.id)+')">✓ 已发布（点此取消）</button>'
    : '<button class="btn" id="pubBtn" onclick="togglePub('+arg(p.id)+')">标记已发布</button>';
  var panel = '<div class="top"><div><h3>'+esc(p.title)+'</h3><div class="folder">'+esc(p.folder)+' · '+esc(p.date||'')+'</div></div>'
    + '<button class="x" onclick="closeModal()">×</button></div>'
    + '<div class="blk"><div class="lab">标题：</div><div class="pre">'+esc(p.title)+'</div>'
    + '<button class="btn" onclick="copyText('+arg(p.title)+')">📋 复制标题</button></div>'
    + '<div class="blk"><div class="lab">正文：</div><pre class="pre">'+esc(p.body)+'</pre>'
    + '<button class="btn" onclick="copyText('+arg(p.body)+')">📋 复制正文</button></div>'
    + tagsBlock + imgBlock
    + '<div class="blk">'+pubBtn+'</div>';
  document.getElementById('panel').innerHTML = panel;
  document.getElementById('modal').style.display = 'flex';
}
function closeModal(){ document.getElementById('modal').style.display='none'; }
function dlAll(){
  var imgs = document.querySelectorAll('#panel img.ph');
  var i=0; (function nx(){ if(i>=imgs.length){ showToast('已开始下载'); return; }
    var a=document.createElement('a'); a.href=imgs[i].src; a.download=imgs[i].src.split('/').pop();
    document.body.appendChild(a); a.click(); a.remove(); i++; setTimeout(nx,300); })();
}
function togglePub(id){
  published[id]=!published[id]; saveLocal();
  var b=document.getElementById('pubBtn');
  if(published[id]){ b.className='btn pub-on'; b.textContent='✓ 已发布（点此取消）'; }
  else { b.className='btn'; b.textContent='标记已发布'; }
  render();
}
function exportPub(){
  var obj={}; Object.keys(published).forEach(function(k){ if(published[k]) obj[k]=true; });
  var s=JSON.stringify(obj,null,2);
  var a=document.createElement('a'); a.href='data:application/json;charset=utf-8,'+encodeURIComponent(s);
  a.download='published.json'; a.click(); showToast('已导出已发布清单');
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function arg(v){ return JSON.stringify(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
// 兜底：无论通过密码还是 session 恢复，进入即渲染（防止刷新后空白）
if(document.readyState!=='loading'){ render(); } else { document.addEventListener('DOMContentLoaded', render); }
</script>
