们，更多日常\n\n━━━━━━━━━━━━━━━━\n配文正文（可直接复制发布）：\n\n万圣节最尴尬的瞬间：门开了，娃缩你身后，那句 Trick or treat 卡在喉咙里，你比他还急。\n\n先别怪娃胆小。平时他根本没有\"必须说\"的场合，突然要对外人喊一句英文，换谁都怵。其实节日本身就是天然的开口练习场。\n\n出门前在家先练：假装敲门，你带头喊两遍 Trick or treat，他跟着来，就不怕了。\n\n把句子拆小一点给他：先会 Trick or treat，再数数 candy 有几颗，敢蹦出一个词，就算赢。\n\n说真的，降低那点期待。说得不准没关系，敢开口，比说得标准值钱一百倍。节日里练的不是发音，是\"敢\"。\n\n今年万圣节，陪他一起喊。几个词也是进步。收藏起来，明年还能用。\n\n#英语启蒙 #少儿英语 #陪娃练口语 #万圣节 #英语启蒙 #少儿英语 #陪娃练口语 #万圣节", "date": "2026-10-14", "kind": "note", "platforms": ["xhs"], "bucket": "history", "images": ["assets/edgetutor_halloween_01_01.jpg", "assets/edgetutor_halloween_01_02.jpg", "assets/edgetutor_halloween_01_03.jpg", "assets/edgetutor_halloween_01_04.jpg", "assets/edgetutor_halloween_01_05.jpg", "assets/edgetutor_halloween_01_06.jpg", "assets/edgetutor_halloween_01_07.jpg", "assets/edgetutor_halloween_01_08.jpg"], "video": null, "cover": "assets/edgetutor_halloween_01_01.jpg", "files": [{"url": "assets/edgetutor_halloween_01_01.jpg", "name": "edgetutor_halloween_01_01.jpg", "label": "保存配图1"}, {"url": "assets/edgetutor_halloween_01_02.jpg", "name": "edgetutor_halloween_01_02.jpg", "label": "保存配图2"}, {"url": "assets/edgetutor_halloween_01_03.jpg", "name": "edgetutor_halloween_01_03.jpg", "label": "保存配图3"}, {"url": "assets/edgetutor_halloween_01_04.jpg", "name": "edgetutor_halloween_01_04.jpg", "label": "保存配图4"}, {"url": "assets/edgetutor_halloween_01_05.jpg", "name": "edgetutor_halloween_01_05.jpg", "label": "保存配图5"}, {"url": "assets/edgetutor_halloween_01_06.jpg", "name": "edgetutor_halloween_01_06.jpg", "label": "保存配图6"}, {"url": "assets/edgetutor_halloween_01_07.jpg", "name": "edgetutor_halloween_01_07.jpg", "label": "保存配图7"}, {"url": "assets/edgetutor_halloween_01_08.jpg", "name": "edgetutor_halloween_01_08.jpg", "label": "保存配图8"}], "reason": "历史素材文件存在，尚未重新核实文案事实、图片质量与适用平台。"}, {"id": "edgetutor_hot_01", "accountId": "A05", "account": "A05 EDGE Tutor 易知（品牌号）", "title": "发音不好，会把娃带偏吗", "body": "≤17字/行、每页≤6行）——\n配色：主蓝 #2E5BFF + 辅黄 #FFC94D，奶油底\n\nP1 封面\n发音不好，会把娃带偏吗\n最近很多人都 s正版教材，师资透明\n✅ 菲教45–55、欧美140–155，外教资质全公开；1对1真人，教材正版\n❌ 进国内不久品牌新，长期得自己判断；菲教口音需筛选\n\n💡 但我自己，后来是照着反面选的\n\n你看上面这几家，毛病就那几样：外教基本没法选，分到谁算谁，质量参差不齐；娃刚磨合熟又频繁换人；试的时候那位外教特别优质，正式约却约不到、要抢；再就是劝囤大套餐，身边不少朋友一囤几千上万、低消十几节，想退一堆限制。\n\n而我们现在学的这种，刚好反着来：外教自己挑，挑定了能固定，不随便换；试的KE满意，正式直接约同一位，不用抢；短KE时想练就练，一分不用囤；内容按娃的底子和节奏来，不是一套教材通吃。\n\n不是说哪家不好，只是这四件，是我踩过坑后最在意的。你家要选，也挨个问清再掏钱。\n\n之前聊的英语启蒙，选外教只是其中一步，别本末倒置。\n\n⚠️ 每家情况都不一样，别拿我家的当标准——适合自己家的，才是最好的。\n\n你家给娃选的哪种外教？评论区聊聊，踩过坑的妈妈真不少💬", "tags": "#vipkid怎么样 #51talk怎么样 #伴鱼英语 #Polly #欧美外教和菲教哪个好 #外教一对一 #菲教一对一 #英语启蒙 #陪娃练口语 #深圳妈妈 #怎么选外教", "fullText": "给娃选外教，我把VIPKID、51Talk、伴鱼、Polly都扒了一遍\n\n住深圳、娃每天过关去香港上学的第三年，我对英语这件事比一般深圳妈妈敏感得多🍵\n\n之前聊过香港两文三语环境有多狠——全英语教学、粤语英语混着来，娃一进去就被推着开口。不少朋友问我：外教怎么选？欧美和菲教差在哪？今天把我研究过、也问过上过的朋友的真实情况一家家摊开，整理出来给你们避坑。\n\n📊 几个大牌的公开情况（价格为常见参考，以官方为准）：\n\n🔹 VIPKID —— 北美外教\n✅ 100%持证，口音纯正；教材精致低龄娃爱看；品牌老\n❌ 单价偏高，一节约150–230；热门外教要抢约，换人适应成本高；大套餐退费偏繁琐\n\n🔹 51Talk —— 菲教为主，高频练口语的代表\n✅ 便宜，菲教一节约40–60能天天练；外教基数大好约；老牌师资稳\n❌ 菲教口音参差需筛选；外教不固定要自己约，连贯性一般\n\n🔹 伴鱼 —— 绘本资源强，低龄娃接受度高\n✅ 菲教32–52、欧美120–171双师资灵活；绘本+动画趣味强，娃不抗拒；1个月后可申请固定外教\n❌ 高阶体系偏弱，考级配套不足；大套餐退费限制较多\n\n🔹 Polly English —— 牛津Thinkers正版教材，师资透明\n✅ 菲教45–55、欧美140–155，外教资质全公开；1对1真人，教材正版\n❌ 进国内不久品牌新，长期得自己判断；菲教口音需筛选\n\n💡 但我自己，后来是照着反面选的\n\n你看上面这几家，毛病就那几样：外教基本没法选，分到谁算谁，质量参差不齐；娃刚磨合熟又频繁换人；试的时候那位外教特别优质，正式约却约不到、要抢；再就是劝囤大套餐，身边不少朋友一囤几千上万、低消十几节，想退一堆限制。\n\n而我们现在学的这种，刚好反着来：外教自己挑，挑定了能固定，不随便换；试的KE满意，正式直接约同一位，不用抢；短KE时想练就练，一分不用囤；内容按娃的底子和节奏来，不是一套教材通吃。\n\n不是说哪家不好，只是这四件，是我踩过坑后最在意的。你家要选，也挨个问清再掏钱。\n\n之前聊的英语启蒙，选外教只是其中一步，别本末倒置。\n\n⚠️ 每家情况都不一样，别拿我家的当标准——适合自己家的，才是最好的。\n\n你家给娃选的哪种外教？评论区聊聊，踩过坑的妈妈真不少💬\n\n#vipkid怎么样 #51talk怎么样 #伴鱼英语 #Polly #欧美外教和菲教哪个好 #外教一对一 #菲教一对一 #英语启蒙 #陪娃练口语 #深圳妈妈 #怎么选外教", "date": "2026-10-18", "kind": "note", "platforms": ["xhs"], "bucket": "history", "images": ["assets/koc_huacha_03_01.jpg", "assets/koc_huacha_03_02.jpg", "assets/koc_huacha_03_03.jpg", "assets/koc_huacha_03_04.jpg", "assets/koc_huacha_03_05.jpg", "assets/koc_huacha_03_06.jpg"], "video": null, "cover": "assets/koc_huacha_03_01.jpg", "files": [{"url": "assets/koc_huacha_03_01.jpg", "name": "koc_huacha_03_01.jpg", "label": "保存配图1"}, {"url": "assets/koc_huacha_03_02.jpg", "name": "koc_huacha_03_02.jpg", "label": "保存配图2"}, {"url": "assets/koc_huacha_03_03.jpg", "name": "koc_huacha_03_03.jpg", "label": "保存配图3"}, {"url": "assets/koc_huacha_03_04.jpg", "name": "koc_huacha_03_04.jpg", "label": "保存配图4"}, {"url": "assets/koc_huacha_03_05.jpg", "name": "koc_huacha_03_05.jpg", "label": "保存配图5"}, {"url": "assets/koc_huacha_03_06.jpg", "name": "koc_huacha_03_06.jpg", "label": "保存配图6"}], "reason": "历史素材文件存在，尚未重新核实文案事实、图片质量与适用平台。"}, {"id": "koc_huacha_04", "accountId": "A08", "account": "A08 花花的茶（深圳跨境）", "title": "跨境第三年，香港小学官津/直资/国际怎么选？我说点实话", "body": "住深圳、娃每天过关去香港上学，第三年了🍵\n\n之前聊过香港的两文三语环境，也扒过几家外教，今天顺着把\"学校怎么选\"这件事摊开说。先说清楚：我不是中介，就是一个天天跑口岸的妈，把亲眼看到+问了一圈在读家长的情况整理出来。每种学校都没有绝对的好坏，看你家要什么。\n\n📌 官津（政府资助）\n✅ 学费极低；本地体系，中文根基稳；和官小同轨道\n❌ 英文环境看具体学校，差别不小；班级人数多，个性化照顾有限；跨境生的交通膳食要自家解决\n\n📌 直资（直接资助）\n✅ 政府+学费双轨，价位中等；英文比重高，师资和设备好；海外出口选择多\n❌ 要交学费，学校之间差几倍；热门校竞争激烈，面试环节多\n\n📌 国际学校\n✅ 全英文环境，海外体系；活动多、圈子国际化；适合路线已定出国的家庭\n❌ 学费是三类里最贵的一档；中文机会少；圈子文化和通勤成本要考虑\n\n💡 我的真心话\n\n别问\"哪类最好\"，先问自己三个问题：\n1️⃣ 娃的中文根基想不想抓？想抓→官津/直资的本地体系\n2️⃣ 家庭预算能扛多少年？预算紧→官津优先\n3️⃣ 未来路线定没定出国？定了→国际；没定→直资弹性大\n\n我家当时就是按这三条倒推的，现在回头看，选对了。\n\n⚠️ 两句实话\n\n每所学校的两文三语比例、师生比都不一样，别拿别人家的当标准。\n\n学校没有完美的，适合自己家的节奏和路线，才是最好的。\n\n你家在纠结哪一类？评论区聊聊，跑过十几场开放日的妈真不少💬", "tags": "#香港小学 #香港小学怎么选 #跨境学童 #官津 #直资 #国际学校 #官津直资国际区别 #深圳妈妈 #英语启蒙", "fullText": "跨境第三年，香港小学官津/直资/国际怎么选？我说点实话\n\n住深圳、娃每天过关去香港上学，第三年了🍵\n\n之前聊过香港的两文三语环境，也扒过几家外教，今天顺着把\"学校怎么选\"这件事摊开说。先说清楚：我不是中介，就是一个天天跑口岸的妈，把亲眼看到+问了一圈在读家长的情况整理出来。每种学校都没有绝对的好坏，看你家要什么。\n\n📌 官津（政府资助）\n✅ 学费极低；本地体系，中文根基稳；和官小同轨道\n❌ 英文环境看具体学校，差别不小；班级人数多，个性化照顾有限；跨境生的交通膳食要自家解决\n\n📌 直资（直接资助）\n✅ 政府+学费双轨，价位中等；英文比重高，师资和设备好；海外出口选择多\n❌ 要交学费，学校之间差几倍；热门校竞争激烈，面试环节多\n\n📌 国际学校\n✅ 全英文环境，海外体系；活动多、圈子国际化；适合路线已定出国的家庭\n❌ 学费是三类里最贵的一档；中文机会少；圈子文化和通勤成本要考虑\n\n💡 我的真心话\n\n别问\"哪类最好\"，先问自己三个问题：\n1️⃣ 娃的中文根基想不想抓？想抓→官津/直资的本地体系\n2️⃣ 家庭预算能扛多少年？预算紧→官津优先\n3️⃣ 未来路线定没定出国？定了→国际；没定→直资弹性大\n\n我家当时就是按这三条倒推的，现在回头看，选对了。\n\n⚠️ 两句实话\n\n每所学校的两文三语比例、师生比都不一样，别拿别人家的当标准。\n\n学校没有完美的，适合自己家的节奏和路线，才是最好的。\n\n你家在纠结哪一类？评论区聊聊，跑过十几场开放日的妈真不少💬\n\n#香港小学 #香港小学怎么选 #跨境学童 #官津 #直资 #国际学校 #官津直资国际区别 #深圳妈妈 #英语启蒙", "date": "2026-10-24", "kind": "note", "platforms": ["xhs"], "bucket": "history", "images": ["assets/koc_huacha_04_01.jpg", "assets/koc_huacha_04_02.jpg", "assets/koc_huacha_04_03.jpg", "assets/koc_huacha_04_04.jpg", "assets/koc_huacha_04_05.jpg"], "video": null, "cover": "assets/koc_huacha_04_01.jpg", "files": [{"url": "assets/koc_huacha_04_01.jpg", "name": "koc_huacha_04_01.jpg", "label": "保存配图1"}, {"url": "assets/koc_huacha_04_02.jpg", "name": "koc_huacha_04_02.jpg", "label": "保存配图2"}, {"url": "assets/koc_huacha_04_03.jpg", "name": "koc_huacha_04_03.jpg", "label": "保存配图3"}, {"url": "assets/koc_huacha_04_04.jpg", "name": "koc_huacha_04_04.jpg", "label": "保存配图4"}, {"url": "assets/koc_huacha_04_05.jpg", "name": "koc_huacha_04_05.jpg", "label": "保存配图5"}], "reason": "历史素材文件存在，尚未重新核实文案事实、图片质量与适用平台。"}, {"id": "koc_huacha_05", "accountId": "A08", "account": "A08 花花的茶（深圳跨境）", "title": "跨境上学三年，这三类家庭我劝退🍵", "body": "住深圳、每天过关送娃去香港上学的第三年，问我\"要不要也送过去\"的朋友越来越多🤔\n\n先说清楚：我不是中介，没拿任何学校好处，就一个在读家长的实话。香港两文三语环境、全英文教学确实香，但跨境本身有代价，不是挂个深圳户口就能轻松搞定。\n\n这三类家庭，我真心劝你想清楚再动：\n\n第一类，爸妈都上班、家里没老人搭手的。\n过关、校巴、接娃，每天至少得有一个人全天候盯。我家的节奏是早上送、下午接，三年没断过。双职工又没支援的，光通勤就能把人拖垮💔\n\n第二类，娃性格慢热、分离焦虑重的。\n天天过关、换环境、粤语和英文一起砸过来，慢热娃前半年很难受。我家适应了快一年才稳。这类娃不如先在深圳把底子稳住。\n\n第三类，冲着\"香港身份、升学捷径\"来的。", "tags": "#跨境上学 #深港跨境 #香港上学 #深圳妈妈 #两文三语 #香港小学 #跨境学童 #启蒙 #陪娃练口语", "fullText": "跨境上学三年，这三类家庭我劝退🍵\n\n住深圳、每天过关送娃去香港上学的第三年，问我\"要不要也送过去\"的朋友越来越多🤔\n\n先说清楚：我不是中介，没拿任何学校好处，就一个在读家长的实话。香港两文三语环境、全英文教学确实香，但跨境本身有代价，不是挂个深圳户口就能轻松搞定。\n\n这三类家庭，我真心劝你想清楚再动：\n\n第一类，爸妈都上班、家里没老人搭手的。\n过关、校巴、接娃，每天至少得有一个人全天候盯。我家的节奏是早上送、下午接，三年没断过。双职工又没支援的，光通勤就能把人拖垮💔\n\n第二类，娃性格慢热、分离焦虑重的。\n天天过关、换环境、粤语和英文一起砸过来，慢热娃前半年很难受。我家适应了快一年才稳。这类娃不如先在深圳把底子稳住。\n\n第三类，冲着\"香港身份、升学捷径\"来的。\n\n#跨境上学 #深港跨境 #香港上学 #深圳妈妈 #两文三语 #香港小学 #跨境学童 #启蒙 #陪娃练口语", "date": "2026-10-29", "kind": "note", "platforms": ["xhs"], "bucket": "history", "images": ["assets/koc_huacha_05_01.jpg", "assets/koc_huacha_05_02.jpg", "assets/koc_huacha_05_03.jpg", "assets/koc_huacha_05_04.jpg", "assets/koc_huacha_05_05.jpg"], "video": null, "cover": "assets/koc_huacha_05_01.jpg", "files": [{"url": "assets/koc_huacha_05_01.jpg", "name": "koc_huacha_05_01.jpg", "label": "保存配图1"}, {"url": "assets/koc_huacha_05_02.jpg", "name": "koc_huacha_05_02.jpg", "label": "保存配图2"}, {"url": "assets/koc_huacha_05_03.jpg", "name": "koc_huacha_05_03.jpg", "label": "保存配图3"}, {"url": "assets/koc_huacha_05_04.jpg", "name": "koc_huacha_05_04.jpg", "label": "保存配图4"}, {"url": "assets/koc_huacha_05_05.jpg", "name": "koc_huacha_05_05.jpg", "label": "保存配图5"}], "reason": "历史素材文件存在，尚未重新核实文案事实、图片质量与适用平台。"}, {"id": "koc_huacha_06", "accountId": "A08", "account": "A08 花花的茶（深圳跨境）", "title": "决定送娃跨境？这3样不提前备好，前半年会崩溃", "body": "跨境第三年，劝退帖发过好几篇，但有妈妈私信：那要是真决定送了，到底该怎么备？\n\n我不是中介，就一个在读家长的实话。前半年最难的其实不是英文，是这三样，没人提前跟我说：\n\n第一，娃的作息得先调过来。\n香港校早，过关还要时间，我家第一个月每天六点起。没提前两三个月把作息拉过来，开学直接崩。别等开学再调。\n\n第二，娃自己得能管自己。\n过关、换鞋、收书包、记作业，全靠自己。慢热的、依赖强的，先在家练\"自己的事自己做\"，比急着补英文重要。\n\n第三，家里的支援得先排好。\n每天至少得有一个人全天候盯接送。双职工又没老人的，先把\"谁送谁接\"定死，别开学了才吵。\n\n英文反而是最后才愁的——环境一进去，耳朵自己就开了。\n\n之前聊过三类家庭劝退、两文三语环境，这套是\"决定送了怎么备\"：先把这三样搞定，你比中介靠谱。\n\n你家卡在哪一关？评论区聊聊，跨境妈妈互相托底💬", "tags": "#跨境上学 #深港跨境 #香港上学 #深圳妈妈 #跨境准备 #香港小学 #跨境学童 #启蒙 #陪娃练口语", "fullText": "决定送娃跨境？这3样不提前备好，前半年会崩溃\n\n跨境第三年，劝退帖发过好几篇，但有妈妈私信：那要是真决定送了，到底该怎么备？\n\n我不是中介，就一个在读家长的实话。前半年最难的其实不是英文，是这三样，没人提前跟我说：\n\n第一，娃的作息得先调过来。\n香港校早，过关还要时间，我家第一个月每天六点起。没提前两三个月把作息拉过来，开学直接崩。别等开学再调。\n\n第二，娃自己得能管自己。\n过关、换鞋、收书包、记作业，全靠自己。慢热的、依赖强的，先在家练\"自己的事自己做\"，比急着补英文重要。\n\n第三，家里的支援得先排好。\n每天至少得有一个人全天候盯接送。双职工又没老人的，先把\"谁送谁接\"定死，别开学了才吵。\n\n英文反而是最后才愁的——环境一进去，耳朵自己就开了。\n\n之前聊过三类家庭劝退、两文三语环境，这套是\"决定送了怎么备\"：先把这三样搞定，你比中介靠谱。\n\n你家卡在哪一关？评论区聊聊，跨境妈妈互相托底💬\n\n#跨境上学 #深港跨境 #香港上学 #深圳妈妈 #跨境准备 #香港小学 #跨境学童 #启蒙 #陪娃练口语", "date": "2026-11-03", "kind": "note", "platforms": ["xhs"], "bucket": "history", "images": ["assets/koc_huacha_06_01.jpg", "assets/koc_huacha_06_02.jpg", "assets/koc_huacha_06_03.jpg", "assets/koc_huacha_06_04.jpg", "assets/koc_huacha_06_05.jpg"], "video": null, "cover": "assets/koc_huacha_06_01.jpg", "files": [{"url": "assets/koc_huacha_06_01.jpg", "name": "koc_huacha_06_01.jpg", "label": "保存配图1"}, {"url": "assets/koc_huacha_06_02.jpg", "name": "koc_huacha_06_02.jpg", "label": "保存配图2"}, {"url": "assets/koc_huacha_06_03.jpg", "name": "koc_huacha_06_03.jpg", "label": "保存配图3"}, {"url": "assets/koc_huacha_06_04.jpg", "name": "koc_huacha_06_04.jpg", "label": "保存配图4"}, {"url": "assets/koc_huacha_06_05.jpg", "name": "koc_huacha_06_05.jpg", "label": "保存配图5"}], "reason": "历史素材文件存在，尚未重新核实文案事实、图片质量与适用平台。"}, {"id": "koc_huacha_07", "accountId": "A08", "account": "A08 花花的茶（深圳跨境）", "title": "过关那20分钟，我把它变成娃的免费磨耳朵时间", "body": "住深圳每天过关送娃去香港上学，单程差不多20分钟。头一年这20分钟基本浪费在发呆和催娃。\n\n后来我想通了：与其焦虑英文，不如把这碎片时间变成\"磨耳朵\"。不报班、不刷题，就听。\n\n我家的做法很简单，三件事：\n\n第一，上车就放儿歌或分级音频。\n不要求懂，就当背景音，耳朵先熟悉节奏再说。\n\n第二，挑娃感兴趣的放。\n他爱车，就放车相关的简单对话，肯听才有效，硬塞的他自动屏蔽。\n\n第三，不考不问。\n听完绝不问\"听懂没\"，不把磨耳朵变成考试，娃才不抗拒。\n\n坚持半年，最明显的变化是：进了全英文环境他不懵，因为耳朵早就开过门了。\n\n之前聊过决定送了怎么备、英文反而是最后才愁的，这套是\"碎片时间怎么用\"：别小看每天这20分钟。\n\n你家过关或者通勤路上都听点啥？评论区聊聊，跨境妈妈互相抄作业💬", "tags": "#跨境上学 #深港跨境 #香港上学 #深圳妈妈 #磨耳朵 #英语启蒙 #碎片时间 #启蒙 #陪娃练口语", "fullText": "过关那20分钟，我把它变成娃的免费磨耳朵时间\n\n住深圳每天过关送娃去香港上学，单程差不多20分钟。头一年这20分钟基本浪费在发呆和催娃。\n\n后来我想通了：与其焦虑英文，不如把这碎片时间变成\"磨耳朵\"。不报班、不刷题，就听。\n\n我家的做法很简单，三件事：\n\n第一，上车就放儿歌或分级音频。\n不要求懂，就当背景音，耳朵先熟悉节奏再说。\n\n第二，挑娃感兴趣的放。\n他爱车，就放车相关的简单对话，肯听才有效，硬塞的他自动屏蔽。\n\n第三，不考不问。\n听完绝不问\"听懂没\"，不把磨耳朵变成考试，娃才不抗拒。\n\n坚持半年，最明显的变化是：进了全英文环境他不懵，因为耳朵早就开过门了。\n\n之前聊过决定送了怎么备、英文反而是最后才愁的，这套是\"碎片时间怎么用\"：别小看每天这20分钟。\n\n你家过关或者通勤路上都听点啥？评论区聊聊，跨境妈妈互相抄作业💬\n\n#跨境上学 #深港跨境 #香港上学 #深圳妈妈 #磨耳朵 #英语启蒙 #碎片时间 #启蒙 #陪娃练口语", "date": "2026-11-03", "kind": "note", "platforms": ["xhs"], "bucket": "history", "images": ["assets/koc_huacha_07_01.jpg", "assets/koc_huacha_07_02.jpg", "assets/koc_huacha_07_03.jpg", "assets/koc_huacha_07_04.jpg", "assets/koc_huacha_07_05.jpg"], "video": null, "cover": "assets/koc_huacha_07_01.jpg", "files": [{"url": "assets/koc_huacha_07_01.jpg", "name": "koc_huacha_07_01.jpg", "label": "保存配图1"}, {"url": "assets/koc_huacha_07_02.jpg", "name": "koc_huacha_07_02.jpg", "label": "保存配图2"}, {"url": "assets/koc_huacha_07_03.jpg", "name": "koc_huacha_07_03.jpg", "label": "保存配图3"}, {"url": "assets/koc_huacha_07_04.jpg", "name": "koc_huacha_07_04.jpg", "label": "保存配图4"}, {"url": "assets/koc_huacha_07_05.jpg", "name": "koc_huacha_07_05.jpg", "label": "保存配图5"}], "reason": "历史素材文件存在，尚未重新核实文案事实、图片质量与适用平台。"}, {"id": "koc_huacha_08", "accountId": "A08", "account": "A08 花花的茶（深圳跨境）", "title": "跨境一年，我重新算的账：最贵的真不是学费", "body": "标题：跨境一年，我重新算的账：最贵的真不是学费\n\n跨境第三年，被问最多的问题不是难不难，是贵不贵🤔\n之前聊过决定送了怎么备、过关20分钟怎么磨耳朵。今天说点中介不会主动讲的：跨境一年的真实成本，最贵的那笔，很多人想错方向了。\n先说学费。香港官津学校免学费，直资也不算离谱。所以送香港等于烧钱，是个误会，至少学费这块没想象中吓人。\n真正贵的是这三笔隐形账，开学前没人跟我算：\n第一笔，通勤和时间。每天过关来回，至少得有一个人全天搭进去。这笔账不是钱，是工。双职工把接送算成请假和精力损耗，一年下来比学费贵💔\n第二笔，补习和配套。进了全英文环境，娃跟不上的部分要补。不是补英文，是补思维和表达。这笔钱丰俭由人，但别以为免学费就零支出。\n第三笔，最容易被忽略：资料和物料。课本、练习、活动费，加上过关用的各种小东西，零零散散也是一笔。\n所以值不值，别只比学费。把这三笔一起算，再决定。我家留下，是因为综合看，环境给娃的底气值这个价🌟\n之前聊过三类家庭劝退、怎么备、怎么磨耳朵，这套是算账：送之前，先把账算明白。\n你家算过这笔账没？评论区聊聊，跨境妈妈互相托底💬", "tags": "#跨境上学 #深港跨境 #香港上学 #深圳妈妈 #跨境花费 #香港小学 #跨境成本 #启蒙 #陪娃练口语", "fullText": "跨境一年，我重新算的账：最贵的真不是学费\n\n标题：跨境一年，我重新算的账：最贵的真不是学费\n\n跨境第三年，被问最多的问题不是难不难，是贵不贵🤔\n之前聊过决定送了怎么备、过关20分钟怎么磨耳朵。今天说点中介不会主动讲的：跨境一年的真实成本，最贵的那笔，很多人想错方向了。\n先说学费。香港官津学校免学费，直资也不算离谱。所以送香港等于烧钱，是个误会，至少学费这块没想象中吓人。\n真正贵的是这三笔隐形账，开学前没人跟我算：\n第一笔，通勤和时间。每天过关来回，至少得有一个人全天搭进去。这笔账不是钱，是工。双职工把接送算成请假和精力损耗，一年下来比学费贵💔\n第二笔，补习和配套。进了全英文环境，娃跟不上的部分要补。不是补英文，是补思维和表达。这笔钱丰俭由人，但别以为免学费就零支出。\n第三笔，最容易被忽略：资料和物料。课本、练习、活动费，加上过关用的各种小东西，零零散散也是一笔。\n所以值不值，别只比学费。把这三笔一起算，再决定。我家留下，是因为综合看，环境给娃的底气值这个价🌟\n之前聊过三类家庭劝退、怎么备、怎么磨耳朵，这套是算账：送之前，先把账算明白。\n你家算过这笔账没？评论区聊聊，跨境妈妈互相托底💬\n\n#跨境上学 #深港跨境 #香港上学 #深圳妈妈 #跨境花费 #香港小学 #跨境成本 #启蒙 #陪娃练口语", "date": "2026-11-04", "kind": "note", "platforms": ["xhs"], "bucket": "history", "images": ["assets/koc_huacha_08_01.jpg", "assets/koc_huacha_08_02.jpg", "assets/koc_huacha_08_03.jpg", "assets/koc_huacha_08_04.jpg", "assets/koc_huacha_08_05.jpg"], "video": null, "cover": "assets/koc_huacha_08_01.jpg", "files": [{"url": "assets/koc_huacha_08_01.jpg", "name": "koc_huacha_08_01.jpg", "label": "保存配图1"}, {"url": "assets/koc_huacha_08_02.jpg", "name": "koc_huacha_08_02.jpg", "label": "保存配图2"}, {"url": "assets/koc_huacha_08_03.jpg", "name": "koc_huacha_08_03.jpg", "label": "保存配图3"}, {"url": "assets/koc_huacha_08_04.jpg", "name": "koc_huacha_08_04.jpg", "label": "保存配图4"}, {"url": "assets/koc_huacha_08_05.jpg", "name": "koc_huacha_08_05.jpg", "label": "保存配图5"}], "reason": "历史素材文件存在，尚未重新核实文案事实、图片质量与适用平台。"}, {"id": "koc_jackmom_02", "accountId": "A01", "account": "A01 广州Jack麻麻（抖音 KOC）", "title": "账号：A01 广州 Jack 妈妈（KOC 软广 · 有教育思考的妈妈视角）", "body": "（可直接发）\n\n**越秀家长还在抢 KET，可政策其实早就改了**\n\n这学期开学，我群里又有人在问：\"要不要给娃报 KET？\"\n\n我本来也心动。后来把越秀区 2026 年的招生细则从头到尾翻了一遍，发现跟我们以为的不太一样。\n\n先说三件白纸黑字的事：\n\n**一、电脑派位跟成绩、证书完全无关。**\n\n招生问答里写得很清楚：派位系统只录电脑号、姓名、性别和志愿，学生的毕业成绩、平时成绩根本不进派位系统。派位当天给每个孩子随机一个九位数号码，按号码和志愿录取，公证处现场公证，参加派位的孩子人人有学位。\n\n**二、2026 年\"均衡分班\"正式写进细则。**\n\n学校必须按随机原则编班、公布编班结果，严禁设重点班、快慢班，也不得以\"国际部\"\"国际课程班\"的名义招生。\n\n**三、免试就近入学，全面取消特长生招生。**\n\n公办初中 95% 以上的生源由就近入学方式确定。\n\n所以结论其实挺硬：如果你家走的是对口直升或者分组派位，KET 对派位结果没有直接作用。这是政策明文，不是我猜的。\n\n但另一头也是真的——禁止重点班之后，分层没有消失，只是挪了地方：挪到简历、面谈、民办、外国语、国际路线那几条路上。这些地方，KET/PET 依然是很多家庭默认的\"通用语言\"。\n\n所以我的判断是这样的：\n\n**KET 既不是智商税，也不是救命稻草，它是一张\"保留选择权\"的票。**\n\n要不要考，先问自己家走哪条路——\n\n**走对口 / 派位** → 真不用为证书焦虑，把钱和时间花在\"孩子能不能真的用英语\"上，回报更实在。\n\n**想冲外国语、民办、国际路线** → 那它基本就是门票。家长圈普遍的说法是时间窗口卡在五升六之前，六年级才起步就来不及了（这是经验之谈，官方不会这么说）。\n\n**最亏的是中间那一类**：路还没想清楚，先砸一笔钱刷个证，考完一扔。证拿到了，能力没长，选择权也没多。\n\n还有一点我自己的感受：2026 之后，越秀这边\"拼学校\"的收益在变小，\"拼孩子真实能力\"的收益在变大。所以 Jack 的英语，我先把\"能开口聊\"放在第一位，证书是顺带的结果，不是目标。\n\n你们家走的是哪条路？评论区说说，我看看是不是我太乐观了。\n\n====================", "tags": "#广州妈妈 #越秀区 #小升初 #广州小升初 #英语启蒙 #少儿英语", "fullText": "账号：A01 广州 Jack 妈妈（KOC 软广 · 有教育思考的妈妈视角）\n\n（可直接发）\n\n**越秀家长还在抢 KET，可政策其实早就改了**\n\n这学期开学，我群里又有人在问：\"要不要给娃报 KET？\"\n\n我本来也心动。后来把越秀区 2026 年的招生细则从头到尾翻了一遍，发现跟我们以为的不太一样。\n\n先说三件白纸黑字的事：\n\n**一、电脑派位跟成绩、证书完全无关。**\n\n招生问答里写得很清楚：派位系统只录电脑号、姓名、性别和志愿，学生的毕业成绩、平时成绩根本不进派位系统。派位当天给每个孩子随机一个九位数号码，按号码和志愿录取，公证处现场公证，参加派位的孩子人人有学位。\n\n**二、2026 年\"均衡分班\"正式写进细则。**\n\n学校必须按随机原则编班、公布编班结果，严禁设重点班、快慢班，也不得以\"国际部\"\"国际课程班\"的名义招生。\n\n**三、免试就近入学，全面取消特长生招生。**\n\n公办初中 95% 以上的生源由就近入学方式确定。\n\n所以结论其实挺硬：如果你家走的是对口直升或者分组派位，KET 对派位结果没有直接作用。这是政策明文，不是我猜的。\n\n但另一头也是真的——禁止重点班之后，分层没有消失，只是挪了地方：挪到简历、面谈、民办、外国语、国际路线那几条路上。这些地方，KET/PET 依然是很多家庭默认的\"通用语言\"。\n\n所以我的判断是这样的：\n\n**KET 既不是智商税，也不是救命稻草，它是一张\"保留选择权\"的票。**\n\n要不要考，先问自己家走哪条路——\n\n**走对口 / 派位** → 真不用为证书焦虑，把钱和时间花在\"孩子能不能真的用英语\"上，回报更实在。\n\n**想冲外国语、民办、国际路线** → 那它基本就是门票。家长圈普遍的说法是时间窗口卡在五升六之前，六年级才起步就来不及了（这是经验之谈，官方不会这么说）。\n\n**最亏的是中间那一类**：路还没想清楚，先砸一笔钱刷个证，考完一扔。证拿到了，能力没长，选择权也没多。\n\n还有一点我自己的感受：2026 之后，越秀这边\"拼学校\"的收益在变小，\"拼孩子真实能力\"的收益在变大。所以 Jack 的英语，我先把\"能开口聊\"放在第一位，证书是顺带的结果，不是目标。\n\n你们家走的是哪条路？评论区说说，我看看是不是我太乐观了。\n\n====================\n\n#广州妈妈 #越秀区 #小升初 #广州小升初 #英语启蒙 #少儿英语", "date": "2026-10-15", "kind": "note", "platforms": [], "bucket": "issue", "images": [], "video": null, "cover": null, "files": [], "reason": "没有可用媒体"}, {"id": "koc_jackmom_03", "accountId": "A01", "account": "A01 广州Jack麻麻（抖音 KOC）", "title": "账号：A01 广州 Jack 妈妈（KOC 软广 · 有教育思考的妈妈视角）", "body": "（可直接发）\n\n**越秀家长抢破头的 KET，派位系统里根本没有这一栏**\n\n先把话说难听一点：如果你家娃走的是越秀的对口直升或者分组派位，KET 这笔钱，大概率是白花的。\n\n别急着骂我。我一开始也准备掏钱，后来把越秀区 2026 年的招生细则和初中招生问答从头翻到尾，才发现我们焦虑的那件事，根本不在那张表上。\n\n招生问答里写得清清楚楚：\n\n派位系统只录电脑号、姓名、性别和志愿。学生的毕业成绩、平时成绩**根本不进派位系统**——学业表现跟派位没有任何关联。派位当天，每个孩子随机一个九位数号码，按号码和志愿录取，公证处现场公证，参加派位的孩子人人有学位。\n\n2026 年起，\"均衡分班\"还正式写进了细则：学校必须按随机原则编班、公布编班结果，严禁重点班、快慢班，也不得以\"国际部\"\"国际课程班\"的名义招生。\n\n再加上免试就近入学、全面取消特长生招生、公办初中 95% 以上的生源由就近入学方式确定——\n\n说白了：**派位这条路上，没有\"证书\"这个变量。**\n\n那 KET 就一无是处吗？也不是。\n\n禁止明面分层之后，分层没有消失，只是挪了地方：挪到简历、面谈、民办、外国语、国际路线那几条路上。在这些地方，KET/PET 依然是很多家庭默认的通用语言。\n\n所以我的判断只有一句：\n\n**证书不是升学门票，它是选择权的价格。**\n\n**走对口 / 派位** → 别为证书焦虑。把这笔钱和时间花在\"孩子能不能真的用英语\"上，回报更实在。\n\n**想冲外国语 / 民办 / 国际路线** → 那它基本就是门票。家长圈普遍的说法是窗口卡在五升六之前，六年级才起步就来不及了（这是经验之谈，官方不会这么说）。\n\n**最亏的是中间那一类**：路还没想清楚，先砸一笔钱刷个证，考完一扔。证拿到了，能力没长，选择权也没多。\n\n我差点就走了第三条路。所以现在 Jack 的英语，我先把\"能开口聊\"放在第一位，证书是顺带的结果，不是目标。\n\n你们家走的是哪条路？评论区说说，我看看是不是我太乐观了。\n\n====================", "tags": "#广州妈妈 #越秀区 #小升初 #广州小升初 #KET #英语启蒙", "fullText": "账号：A01 广州 Jack 妈妈（KOC 软广 · 有教育思考的妈妈视角）\n\n（可直接发）\n\n**越秀家长抢破头的 KET，派位系统里根本没有这一栏**\n\n先把话说难听一点：如果你家娃走的是越秀的对口直升或者分组派位，KET 这笔钱，大概率是白花的。\n\n别急着骂我。我一开始也准备掏钱，后来把越秀区 2026 年的招生细则和初中招生问答从头翻到尾，才发现我们焦虑的那件事，根本不在那张表上。\n\n招生问答里写得清清楚楚：\n\n派位系统只录电脑号、姓名、性别和志愿。学生的毕业成绩、平时成绩**根本不进派位系统**——学业表现跟派位没有任何关联。派位当天，每个孩子随机一个九位数号码，按号码和志愿录取，公证处现场公证，参加派位的孩子人人有学位。\n\n2026 年起，\"均衡分班\"还正式写进了细则：学校必须按随机原则编班、公布编班结果，严禁重点班、快慢班，也不得以\"国际部\"\"国际课程班\"的名义招生。\n\n再加上免试就近入学、全面取消特长生招生、公办初中 95% 以上的生源由就近入学方式确定——\n\n说白了：**派位这条路上，没有\"证书\"这个变量。**\n\n那 KET 就一无是处吗？也不是。\n\n禁止明面分层之后，分层没有消失，只是挪了地方：挪到简历、面谈、民办、外国语、国际路线那几条路上。在这些地方，KET/PET 依然是很多家庭默认的通用语言。\n\n所以我的判断只有一句：\n\n**证书不是升学门票，它是选择权的价格。**\n\n**走对口 / 派位** → 别为证书焦虑。把这笔钱和时间花在\"孩子能不能真的用英语\"上，回报更实在。\n\n**想冲外国语 / 民办 / 国际路线** → 那它基本就是门票。家长圈普遍的说法是窗口卡在五升六之前，六年级才起步就来不及了（这是经验之谈，官方不会这么说）。\n\n**最亏的是中间那一类**：路还没想清楚，先砸一笔钱刷个证，考完一扔。证拿到了，能力没长，选择权也没多。\n\n我差点就走了第三条路。所以现在 Jack 的英语，我先把\"能开口聊\"放在第一位，证书是顺带的结果，不是目标。\n\n你们家走的是哪条路？评论区说说，我看看是不是我太乐观了。\n\n====================\n\n#广州妈妈 #越秀区 #小升初 #广州小升初 #KET #英语启蒙", "date": "2026-10-15", "kind": "note", "platforms": ["xhs"], "bucket": "history", "images": ["assets/koc_jackmom_03_01.jpg", "assets/koc_jackmom_03_02.jpg", "assets/koc_jackmom_03_03.jpg", "assets/koc_jackmom_03_04.jpg", "assets/koc_jackmom_03_05.jpg", "assets/koc_jackmom_03_06.jpg", "assets/koc_jackmom_03_07.jpg", "assets/koc_jackmom_03_08.jpg", "assets/koc_jackmom_03_09.jpg", "assets/koc_jackmom_03_10.jpg", "assets/koc_jackmom_03_11.jpg", "assets/koc_jackmom_03_12.jpg"], "video": null, "cover": "assets/koc_jackmom_03_01.jpg", "files": [{"url": "assets/koc_jackmom_03_01.jpg", "name": "koc_jackmom_03_01.jpg", "label": "保存配图1"}, {"url": "assets/koc_jackmom_03_02.jpg", "name": "koc_jackmom_03_02.jpg", "label": "保存配图2"}, {"url": "assets/koc_jackmom_03_03.jpg", "name": "koc_jackmom_03_03.jpg", "label": "保存配图3"}, {"url": "assets/koc_jackmom_03_04.jpg", "name": "koc_jackmom_03_04.jpg", "label": "保存配图4"}, {"url": "assets/koc_jackmom_03_05.jpg", "name": "koc_jackmom_03_05.jpg", "label": "保存配图5"}, {"url": "assets/koc_jackmom_03_06.jpg", "name": "koc_jackmom_03_06.jpg", "label": "保存配图6"}, {"url": "assets/koc_jackmom_03_07.jpg", "name": "koc_jackmom_03_07.jpg", "label": "保存配图7"}, {"url": "assets/koc_jackmom_03_08.jpg", "name": "koc_jackmom_03_08.jpg", "label": "保存配图8"}, {"url": "assets/koc_jackmom_03_09.jpg", "name": "koc_jackmom_03_09.jpg", "label": "保存配图9"}, {"url": "assets/koc_jackmom_03_10.jpg", "name": "koc_jackmom_03_10.jpg", "label": "保存配图10"}, {"url": "assets/koc_jackmom_03_11.jpg", "name": "koc_jackmom_03_11.jpg", "label": "保存配图11"}, {"url": "assets/koc_jackmom_03_12.jpg", "name": "koc_jackmom_03_12.jpg", "label": "保存配图12"}], "reason": "历史素材文件存在，尚未重新核实文案事实、图片质量与适用平台。"}, {"id": "koc_momo_phonics_03", "accountId": "A10", "account": "A10 Momo拼读课堂", "title": "娃见词能拼，听写却崩了？拼读只练了一半👂", "body": "陪娃学自然拼读几个月，我摔在一个坑上：他看着词能拼出来，我说一个词让他写，他愣住。\n\n见词会读，听词写不出。我以为他不专心，后来才知道，这不是态度问题，是练的结构缺了一半。\n\n🔄 拼读其实有两半\n\n一半是\"看\"：见词能拼，眼睛到嘴。娃练的多数是这半，卡片、绘本跟读，全是练输出。\n\n另一半是\"听\"：听音能辨，耳朵到手。这半最容易被跳过，但拼写的根基恰恰在这——写不出来，多半是没听清这个音在词里长什么样。\n\n🍽 我家补\"耳朵\"的三个土办法\n\n1️⃣ 饭桌\"我说你拼\"：我念一个词，他口头拆音，不写字，就练耳朵。一餐饭三五个词就够\n2️⃣ 拍手数节拍：念个词拍几下，先让他感觉一个词里装了几个音\n3️⃣ 绘本先听后看：翻开新书前两页，先合上书听我念，猜猜是什么词\n\n没有一个是正经\"学\"，全是顺嘴玩。但两周下来，听写那种愣住的表情明显少了😊\n\n✍️ 我的结论\n\n拼读不是背规则，是耳朵先打开。选材料的时候别只问\"教了哪些组合\"，先问\"娃的耳朵有没有被练到\"。\n\n耳朵的功夫到不了，嘴巴练再多也是空的。\n\n你家娃听写崩过吗？都用什么办法练耳朵？评论区交换一下💬", "tags": "#自然拼读 #英语启蒙 #亲子英语 #陪娃练口语 #英语听力 #幼小衔接 #深圳妈妈 #日常说英语", "fullText": "娃见词能拼，听写却崩了？拼读只练了一半👂\n\n陪娃学自然拼读几个月，我摔在一个坑上：他看着词能拼出来，我说一个词让他写，他愣住。\n\n见词会读，听词写不出。我以为他不专心，后来才知道，这不是态度问题，是练的结构缺了一半。\n\n🔄 拼读其实有两半\n\n一半是\"看\"：见词能拼，眼睛到嘴。娃练的多数是这半，卡片、绘本跟读，全是练输出。\n\n另一半是\"听\"：听音能辨，耳朵到手。这半最容易被跳过，但拼写的根基恰恰在这——写不出来，多半是没听清这个音在词里长什么样。\n\n🍽 我家补\"耳朵\"的三个土办法\n\n1️⃣ 饭桌\"我说你拼\"：我念一个词，他口头拆音，不写字，就练耳朵。一餐饭三五个词就够\n2️⃣ 拍手数节拍：念个词拍几下，先让他感觉一个词里装了几个音\n3️⃣ 绘本先听后看：翻开新书前两页，先合上书听我念，猜猜是什么词\n\n没有一个是正经\"学\"，全是顺嘴玩。但两周下来，听写那种愣住的表情明显少了😊\n\n✍️ 我的结论\n\n拼读不是背规则，是耳朵先打开。选材料的时候别只问\"教了哪些组合\"，先问\"娃的耳朵有没有被练到\"。\n\n耳朵的功夫到不了，嘴巴练再多也是空的。\n\n你家娃听写崩过吗？都用什么办法练耳朵？评论区交换一下💬\n\n#自然拼读 #英语启蒙 #亲子英语 #陪娃练口语 #英语听力 #幼小衔接 #深圳妈妈 #日常说英语", "date": "2026-10-17", "kind": "note", "platforms": ["xhs"], "bucket": "history", "images": ["assets/koc_momo_phonics_03_01.jpg", "assets/koc_momo_phonics_03_02.jpg", "assets/koc_momo_phonics_03_03.jpg", "assets/koc_momo_phonics_03_04.jpg", "assets/koc_momo_phonics_03_05.jpg"], "video": null, "cover": "assets/koc_momo_phonics_03_01.jpg", "files": [{"url": "assets/koc_momo_phonics_03_01.jpg", "name": "koc_momo_phonics_03_01.jpg", "label": "保存配图1"}, {"url": "assets/koc_momo_phonics_03_02.jpg", "name": "koc_momo_phonics_03_02.jpg", "label": "保存配图2"}, {"url": "assets/koc_momo_phonics_03_03.jpg", "name": "koc_momo_phonics_03_03.jpg", "label": "保存配图3"}, {"url": "assets/koc_momo_phonics_03_04.jpg", "name": "koc_momo_phonics_03_04.jpg", "label": "保存配图4"}, {"url": "assets/koc_momo_phonics_03_05.jpg", "name": "koc_momo_phonics_03_05.jpg", "label": "保存配图5"}], "reason": "历史素材文件存在，尚未重新核实文案事实、图片质量与适用平台。"}, {"id": "koc_momo_phonics_04", "accountId": "A10", "account": "A10 Momo拼读课堂", "title": "自然拼读到底怎么学？我把伴鱼、app、真人外教都试了一遍", "body": "关注我的应该知道，我家娃跟着gem（外教）一KE一KE学自然拼读，一个音纠正8遍那种——\"跟着gem学拼读\"那个系列我一直在更😊\n\n但在找gem之前，我也踩过坑。今天顺着聊：自然拼读到底怎么学才走得通，把试过的几种方式真实摊开说。\n\n一开始图省事，试了某app、也看了伴鱼、51Talk、Polly——规则教得挺清楚，价格也不贵。可娃拼着拼着，拼成了拼音腔，还是不敢开口。后来才明白：拼读关键不是\"学没学规则\"，是\"有没有人肯一遍遍纠正、能不能高频练\"。\n\n📊 几种方式我都扒了：\n\n🔹 自然拼读app / 伴鱼这类 —— 规则清楚、能反复看\n✅ 便宜、随时能学；动画趣味强，低龄娃不抗拒\n❌ 读错了没人当场纠，拼读容易拼成中式英语，娃自己都不知道错；高阶体系偏弱\n\n🔹 欧美外教 —— 纠音地道、表达自然\n✅ 口音准、纠音专业，敢开口后提升快\n❌ 单价高（一节约120–180），很难天天练，钱包扛不住；外教不固定要抢约\n\n🔹 菲教一对一 —— 高频纠音的性价比路线\n✅ 价格友好（一节约40–60），能天天练；外教一遍遍带娃纠音，开口机会多\n❌ 口音有个体差异，得多试几位外教\n\n💡 我的真心话\n\n这几家都能学，看你家节奏和预算——预算紧就高频菲教纠音，追求地道口音就上欧美外教，只想先认规则、培养兴趣，app或绘本类也够用。没有标准答案。\n\n也正是试过错，才更珍惜现在gem这样肯一遍遍纠正的外教。之后\"跟着gem学拼读\"继续更，欢迎来看娃的真实变化。\n\n⚠️ 几句实话\n\n每个娃节奏不一样，别看别人家\"3个月拼读自由\"就焦虑。\n\n自然拼读不是必须砸钱报大牌，但\"有人肯一遍遍纠正\"这件事，挺关键。\n\n你家娃怎么学自然拼读的？还是还在犹豫？评论区聊聊，卡这关的妈妈真不少💬", "tags": "#自然拼读 #伴鱼自然拼读 #Polly #51talk #自然拼读app #真人外教 #菲教一对一 #英语启蒙 #陪娃练口语 #零基础英语 #怎么学自然拼读", "fullText": "自然拼读到底怎么学？我把伴鱼、app、真人外教都试了一遍\n\n关注我的应该知道，我家娃跟着gem（外教）一KE一KE学自然拼读，一个音纠正8遍那种——\"跟着gem学拼读\"那个系列我一直在更😊\n\n但在找gem之前，我也踩过坑。今天顺着聊：自然拼读到底怎么学才走得通，把试过的几种方式真实摊开说。\n\n一开始图省事，试了某app、也看了伴鱼、51Talk、Polly——规则教得挺清楚，价格也不贵。可娃拼着拼着，拼成了拼音腔，还是不敢开口。后来才明白：拼读关键不是\"学没学规则\"，是\"有没有人肯一遍遍纠正、能不能高频练\"。\n\n📊 几种方式我都扒了：\n\n🔹 自然拼读app / 伴鱼这类 —— 规则清楚、能反复看\n✅ 便宜、随时能学；动画趣味强，低龄娃不抗拒\n❌ 读错了没人当场纠，拼读容易拼成中式英语，娃自己都不知道错；高阶体系偏弱\n\n🔹 欧美外教 —— 纠音地道、表达自然\n✅ 口音准、纠音专业，敢开口后提升快\n❌ 单价高（一节约120–180），很难天天练，钱包扛不住；外教不固定要抢约\n\n🔹 菲教一对一 —— 高频纠音的性价比路线\n✅ 价格友好（一节约40–60），能天天练；外教一遍遍带娃纠音，开口机会多\n❌ 口音有个体差异，得多试几位外教\n\n💡 我的真心话\n\n这几家都能学，看你家节奏和预算——预算紧就高频菲教纠音，追求地道口音就上欧美外教，只想先认规则、培养兴趣，app或绘本类也够用。没有标准答案。\n\n也正是试过错，才更珍惜现在gem这样肯一遍遍纠正的外教。之后\"跟着gem学拼读\"继续更，欢迎来看娃的真实变化。\n\n⚠️ 几句实话\n\n每个娃节奏不一样，别看别人家\"3个月拼读自由\"就焦虑。\n\n自然拼读不是必须砸钱报大牌，但\"有人肯一遍遍纠正\"这件事，挺关键。\n\n你家娃怎么学自然拼读的？还是还在犹豫？评论区聊聊，卡这关的妈妈真不少💬\n\n#自然拼读 #伴鱼自然拼读 #Polly #51talk #自然拼读app #真人外教 #菲教一对一 #英语启蒙 #陪娃练口语 #零基础英语 #怎么学自然拼读", "date": "2026-10-18", "kind": "note", "platforms": ["xhs"], "bucket": "history", "images": ["assets/koc_momo_phonics_04_01.jpg", "assets/koc_momo_phonics_04_02.jpg", "assets/koc_momo_phonics_04_03.jpg", "assets/koc_momo_phonics_04_04.jpg", "assets/koc_momo_phonics_04_05.jpg", "assets/koc_momo_phonics_04_06.jpg"], "video": null, "cover": "assets/koc_momo_phonics_04_01.jpg", "files": [{"url": "assets/koc_momo_phonics_04_01.jpg", "name": "koc_momo_phonics_04_01.jpg", "label": "保存配图1"}, {"url": "assets/koc_momo_phonics_04_02.jpg", "name": "koc_momo_phonics_04_02.jpg", "label": "保存配图2"}, {"url": "assets/koc_momo_phonics_04_03.jpg", "name": "koc_momo_phonics_04_03.jpg", "label": "保存配图3"}, {"url": "assets/koc_momo_phonics_04_04.jpg", "name": "koc_momo_phonics_04_04.jpg", "label": "保存配图4"}, {"url": "assets/koc_momo_phonics_04_05.jpg", "name": "koc_momo_phonics_04_05.jpg", "label": "保存配图5"}, {"url": "assets/koc_momo_phonics_04_06.jpg", "name": "koc_momo_phonics_04_06.jpg", "label": "保存配图6"}], "reason": "历史素材文件存在，尚未重新核实文案事实、图片质量与适用平台。"}, {"id": "koc_momo_phonics_05", "accountId": "A10", "account": "A10 Momo拼读课堂", "title": "娃拼读常踩的3个坑，gem是这样一个个纠的", "body": "关注我的知道，我家娃跟着gem（外教）学自然拼读有段时间了，\"跟着gem学拼读\"系列一直在更😊\n\n今天不聊选哪家，聊点更实在的：娃拼读最常踩的3个坑，gem在课上是怎么一个个纠的。家里有同款娃的，可以对号入座。\n\n坑1️⃣ 拼成\"拼音腔\"\nc 不读 /k/，读成了\"ci\"；a 不读 /æ/，读成了\"阿\"\ngem怎么纠：不急着吼\"不对\"，先让娃摸到嘴巴怎么动——对着镜子看口型，一个音一个音拆慢了带。娃自己发现嘴巴和gem不一样，比家长说一百遍都管用。\n\n坑2️⃣ 见词就乱猜，根本不拼\n看着图猜词，图不认识就直接卡壳\ngem怎么纠：手指指着字母一个一个划，划完再读，立下\"见词就拼\"的规矩。一开始慢，但规矩立住了，后面才快。\n\n坑3️⃣ 单字会拼，连成句就不会\n单个词读得飞起，一到句子就散架\ngem怎么纠：从词到短语再到短句，一级一级来；每句先慢后快，读顺了再提速。娃发现自己能读完一整句的时候，眼睛是亮的。\n\n💡 我最大的感受\n\n拼读这事，\"学规则\"几天就够，\"改习惯\"要以月算。有个肯一遍遍纠的人在身边，比刷十本练习册管用。\n\n家里有同款坑的，评论区聊聊，卡第几个了👇", "tags": "#自然拼读 #孩子拼读 #自然拼读常见错误 #拼读发音 #自然拼读怎么学 #英语启蒙 #陪娃练口语 #亲子英语", "fullText": "娃拼读常踩的3个坑，gem是这样一个个纠的\n\n关注我的知道，我家娃跟着gem（外教）学自然拼读有段时间了，\"跟着gem学拼读\"系列一直在更😊\n\n今天不聊选哪家，聊点更实在的：娃拼读最常踩的3个坑，gem在课上是怎么一个个纠的。家里有同款娃的，可以对号入座。\n\n坑1️⃣ 拼成\"拼音腔\"\nc 不读 /k/，读成了\"ci\"；a 不读 /æ/，读成了\"阿\"\ngem怎么纠：不急着吼\"不对\"，先让娃摸到嘴巴怎么动——对着镜子看口型，一个音一个音拆慢了带。娃自己发现嘴巴和gem不一样，比家长说一百遍都管用。\n\n坑2️⃣ 见词就乱猜，根本不拼\n看着图猜词，图不认识就直接卡壳\ngem怎么纠：手指指着字母一个一个划，划完再读，立下\"见词就拼\"的规矩。一开始慢，但规矩立住了，后面才快。\n\n坑3️⃣ 单字会拼，连成句就不会\n单个词读得飞起，一到句子就散架\ngem怎么纠：从词到短语再到短句，一级一级来；每句先慢后快，读顺了再提速。娃发现自己能读完一整句的时候，眼睛是亮的。\n\n💡 我最大的感受\n\n拼读这事，\"学规则\"几天就够，\"改习惯\"要以月算。有个肯一遍遍纠的人在身边，比刷十本练习册管用。\n\n家里有同款坑的，评论区聊聊，卡第几个了👇\n\n#自然拼读 #孩子拼读 #自然拼读常见错误 #拼读发音 #自然拼读怎么学 #英语启蒙 #陪娃练口语 #亲子英语", "date": "2026-10-24", "kind": "note", "platforms": ["xhs"], "bucket": "history", "images": ["assets/koc_momo_phonics_05_01.jpg", "assets/koc_momo_phonics_05_02.jpg", "assets/koc_momo_phonics_05_03.jpg", "assets/koc_momo_phonics_05_04.jpg", "assets/koc_momo_phonics_05_05.jpg"], "video": null, "cover": "assets/koc_momo_phonics_05_01.jpg", "files": [{"url": "assets/koc_momo_phonics_05_01.jpg", "name": "koc_momo_phonics_05_01.jpg", "label": "保存配图1"}, {"url": "assets/koc_momo_phonics_05_02.jpg", "name": "koc_momo_phonics_05_02.jpg", "label": "保存配图2"}, {"url": "assets/koc_momo_phonics_05_03.jpg", "name": "koc_momo_phonics_05_03.jpg", "label": "保存配图3"}, {"url": "assets/koc_momo_phonics_05_04.jpg", "name": "koc_momo_phonics_05_04.jpg", "label": "保存配图4"}, {"url": "assets/koc_momo_phonics_05_05.jpg", "name": "koc_momo_phonics_05_05.jpg", "label": "保存配图5"}], "reason": "历史素材文件存在，尚未重新核实文案事实、图片质量与适用平台。"}, {"id": "koc_momo_phonics_06", "accountId": "A10", "account": "A10 Momo拼读课堂", "title": "试了伴鱼和Polly之后，我还是决定继续跟着gem这么学", "body": "关注我的应该知道，我家娃跟着gem（外教）一KE一KE学自然拼读，一个音纠正8遍那种——\"跟着gem学拼读\"那个系列我一直在更😊\n\n但前阵子，我还是好奇，去试了一阵子伴鱼和Polly。不是因为gem不好，是想看看大牌那种标准化方式，会不会更适合我们。试完一段时间，加上身边妈妈们踩过的坑，今天掏心窝说。\n\n🔹 先说它们好的地方\n伴鱼绘本资源强、低龄娃接受度高；Polly牛津教材正版、师资透明，体系完整。这点我不否认，适合想稳稳跟着走的家庭。\n\n🔹 但对比下来，我现在这种一对一（短KE时）赢在这四点，都是真实踩出来的：\n✅ 外教质量：随便选不踩雷。之前试过的地方，水平参差还频繁换人，娃刚跟一位磨合熟，又来新面孔，几乎每次从头再来\n✅ 约固定外教：试的KE满意，就能直接约到同一位长期跟。很多地方先试的那位特别优质，轮到正式约KE却怎么都约不到、排期排到怀疑人生\n✅ 不囤KE：短KE时一次只买几节，随买随约没压力。身边不少朋友一囤就是几千上万、还有低消十几节的，娃后来不想上了，退都退不掉\n✅ 内容按娃定制：根据娃发音底子和节奏安排，哪里弱补哪里。别家基本一套教材所有人通用，千人一面\n\n而我跟gem一直是：高频+短时+固定外教+按娃节奏来。娃不累，错音当场改，记忆不断片。\n\n💡 所以我还是决定：继续跟着gem这么学。\n不是伴鱼Polly不好，是这四点刚好都是我们家最在意的。有些\"不顺\"对我是真不顺，对别人可能根本不是事。\n\n📌 一句实话\n选一对一别看名气，就问四件事：外教稳不稳？试完约不约得到？要不要大额囤？内容是不是按娃来的？四个都过关再掏钱，能省一大笔冤枉钱。\n\n你家选的时候踩过哪个坑？评论区聊聊，帮后来人避雷💬", "tags": "#自然拼读 #伴鱼英语 #Polly #菲教一对一 #英语启蒙 #陪娃练口语 #零基础英语 #短KE时 #怎么学自然拼读 #外教一对一", "fullText": "试了伴鱼和Polly之后，我还是决定继续跟着gem这么学\n\n关注我的应该知道，我家娃跟着gem（外教）一KE一KE学自然拼读，一个音纠正8遍那种——\"跟着gem学拼读\"那个系列我一直在更😊\n\n但前阵子，我还是好奇，去试了一阵子伴鱼和Polly。不是因为gem不好，是想看看大牌那种标准化方式，会不会更适合我们。试完一段时间，加上身边妈妈们踩过的坑，今天掏心窝说。\n\n🔹 先说它们好的地方\n伴鱼绘本资源强、低龄娃接受度高；Polly牛津教材正版、师资透明，体系完整。这点我不否认，适合想稳稳跟着走的家庭。\n\n🔹 但对比下来，我现在这种一对一（短KE时）赢在这四点，都是真实踩出来的：\n✅ 外教质量：随便选不踩雷。之前试过的地方，水平参差还频繁换人，娃刚跟一位磨合熟，又来新面孔，几乎每次从头再来\n✅ 约固定外教：试的KE满意，就能直接约到同一位长期跟。很多地方先试的那位特别优质，轮到正式约KE却怎么都约不到、排期排到怀疑人生\n✅ 不囤KE：短KE时一次只买几节，随买随约没压力。身边不少朋友一囤就是几千上万、还有低消十几节的，娃后来不想上了，退都退不掉\n✅ 内容按娃定制：根据娃发音底子和节奏安排，哪里弱补哪里。别家基本一套教材所有人通用，千人一面\n\n而我跟gem一直是：高频+短时+固定外教+按娃节奏来。娃不累，错音当场改，记忆不断片。\n\n💡 所以我还是决定：继续跟着gem这么学。\n不是伴鱼Polly不好，是这四点刚好都是我们家最在意的。有些\"不顺\"对我是真不顺，对别人可能根本不是事。\n\n📌 一句实话\n选一对一别看名气，就问四件事：外教稳不稳？试完约不约得到？要不要大额囤？内容是不是按娃来的？四个都过关再掏钱，能省一大笔冤枉钱。\n\n你家选的时候踩过哪个坑？评论区聊聊，帮后来人避雷💬\n\n#自然拼读 #伴鱼英语 #Polly #菲教一对一 #英语启蒙 #陪娃练口语 #零基础英语 #短KE时 #怎么学自然拼读 #外教一对一", "date": "2026-10-19", "kind": "note", "platforms": ["xhs"], "bucket": "history", "images": ["assets/koc_momo_phonics_06_01.jpg"], "video": null, "cover": "assets/koc_momo_phonics_06_01.jpg", "files": [{"url": "assets/koc_momo_phonics_06_01.jpg", "name": "koc_momo_phonics_06_01.jpg", "label": "保存配图1"}], "reason": "历史素材文件存在，尚未重新核实文案事实、图片质量与适用平台。"}, {"id": "koc_momo_phonics_07", "accountId": "A10", "account": "A10 Momo拼读课堂", "title": "零基础跟外教拼读，这3类外教我直接pass🧸", "body": "零基础带娃跟外教学自然拼读，前后试过好几个，现在固定跟 gem 那位外教。\n\n不是凑合，是踩过坑才定下来的。给同样在挑外教的朋友，说点大实话：这3类外教，我直接pass🤔\n\n第一类，全程照PPT念、不纠正发音的。\n拼读最核心就是发音准。外教自己读得飘、娃错了也不纠，学完还是错的。gem 会一遍遍把嘴型示范给娃看，错了当场纠，这才叫在教🗣️\n\n第二类，太活泼、控不住场的。\n零基础娃坐不住，外教光逗不教，全程热热闹闹，娃啥也没留下。我要的是\"娃被带着往前走\"，不是综艺现场。\n\n第三类，一套教材通吃、不按娃节奏来的。\n每个娃卡的点不一样，有的卡在 th，有的卡在辅音簇。不观察、不调整，只会往前翻页的，pass。\n\n好外教长什么样？肯纠、控得住、看得见娃。我家的标准就这三条，简单但够用。\n\n之前聊过\"跟着gem学拼读\"、拼读常踩的坑、试了伴鱼Polly还是跟gem，这套是挑人那篇：不是贵就好，是合不合适🎯\n\n你家娃跟的外教，敢不敢纠发音？评论区聊聊，挑外教我有点经验💬", "tags": "#自然拼读 #拼读 #启蒙 #外教一对一 #跟外教学拼读 #零基础拼读 #自然拼读怎么学 #拼读纠正 #家长选外教 #陪娃练口语", "fullText": "零基础跟外教拼读，这3类外教我直接pass🧸\n\n零基础带娃跟外教学自然拼读，前后试过好几个，现在固定跟 gem 那位外教。\n\n不是凑合，是踩过坑才定下来的。给同样在挑外教的朋友，说点大实话：这3类外教，我直接pass🤔\n\n第一类，全程照PPT念、不纠正发音的。\n拼读最核心就是发音准。外教自己读得飘、娃错了也不纠，学完还是错的。gem 会一遍遍把嘴型示范给娃看，错了当场纠，这才叫在教🗣️\n\n第二类，太活泼、控不住场的。\n零基础娃坐不住，外教光逗不教，全程热热闹闹，娃啥也没留下。我要的是\"娃被带着往前走\"，不是综艺现场。\n\n第三类，一套教材通吃、不按娃节奏来的。\n每个娃卡的点不一样，有的卡在 th，有的卡在辅音簇。不观察、不调整，只会往前翻页的，pass。\n\n好外教长什么样？肯纠、控得住、看得见娃。我家的标准就这三条，简单但够用。\n\n之前聊过\"跟着gem学拼读\"、拼读常踩的坑、试了伴鱼Polly还是跟gem，这套是挑人那篇：不是贵就好，是合不合适🎯\n\n你家娃跟的外教，敢不敢纠发音？评论区聊聊，挑外教我有点经验💬\n\n#自然拼读 #拼读 #启蒙 #外教一对一 #跟外教学拼读 #零基础拼读 #自然拼读怎么学 #拼读纠正 #家长选外教 #陪娃练口语", "date": "2026-10-29", "kind": "note", "platforms": ["xhs"], "bucket": "history", "images": ["assets/koc_momo_phonics_07_01.jpg", "assets/koc_momo_phonics_07_02.jpg", "assets/koc_momo_phonics_07_03.jpg", "assets/koc_momo_phonics_07_04.jpg", "assets/koc_momo_phonics_07_05.jpg"], "video": null, "cover": "assets/koc_momo_phonics_07_01.jpg", "files": [{"url": "assets/koc_momo_phonics_07_01.jpg", "name": "koc_momo_phonics_07_01.jpg", "label": "保存配图1"}, {"url": "assets/koc_momo_phonics_07_02.jpg", "name": "koc_momo_phonics_07_02.jpg", "label": "保存配图2"}, {"url": "assets/koc_momo_phonics_07_03.jpg", "name": "koc_momo_phonics_07_03.jpg", "label": "保存配图3"}, {"url": "assets/koc_momo_phonics_07_04.jpg", "name": "koc_momo_phonics_07_04.jpg", "label": "保存配图4"}, {"url": "assets/koc_momo_phonics_07_05.jpg", "name": "koc_momo_phonics_07_05.jpg", "label": "保存配图5"}], "reason": "历史素材文件存在，尚未重新核实文案事实、图片质量与适用平台。"}, {"id": "koc_momo_phonics_08", "accountId": "A10", "account": "A10 Momo拼读课堂", "title": "零基础拼读，我让娃先练这3组音（不是按字母表）", "body": "之前聊过\"3类外教直接pass\"，有妈妈问：那零基础到底从哪组音开始？\n\n我也不是啥专家，就一个陪读妈的实话。别急着按 A-B-C 顺，前几组我让娃先吃这三块：\n\n第一组，单辅音里最常用的 s、a、t、p。\nsat、pat、tap，三个音能拼一堆词。先让娃尝到\"拼出来\"的爽，比背字母名有用。\n\n第二组，短元音 a（CVC 结构）。\ncat、map、pan，一个元音撑起一整类。娃懂了\"元音是骨架\"，后面不慌。\n\n第三组，最容易混的 th 和 sh。\n这两个不早分，以后读全错。跟 gem 的时候他特意慢下来，一遍遍纠嘴型，我现在也盯着这俩。\n\n顺序比教材进度重要。那种急着自己翻页、一套通吃的，就是我说的该pass那种。\n\n之前聊过挑外教、跟 gem 学拼读，这套是\"从哪开始\"：先把这三组吃透，再往前走。\n\n你家娃卡在哪组音？评论区聊聊，拼读坑我踩过不少🧸", "tags": "#自然拼读 #拼读 #启蒙 #外教一对一 #跟外教学拼读 #零基础拼读 #自然拼读怎么学 #拼读顺序 #家长选外教 #陪娃练口语", "fullText": "零基础拼读，我让娃先练这3组音（不是按字母表）\n\n之前聊过\"3类外教直接pass\"，有妈妈问：那零基础到底从哪组音开始？\n\n我也不是啥专家，就一个陪读妈的实话。别急着按 A-B-C 顺，前几组我让娃先吃这三块：\n\n第一组，单辅音里最常用的 s、a、t、p。\nsat、pat、tap，三个音能拼一堆词。先让娃尝到\"拼出来\"的爽，比背字母名有用。\n\n第二组，短元音 a（CVC 结构）。\ncat、map、pan，一个元音撑起一整类。娃懂了\"元音是骨架\"，后面不慌。\n\n第三组，最容易混的 th 和 sh。\n这两个不早分，以后读全错。跟 gem 的时候他特意慢下来，一遍遍纠嘴型，我现在也盯着这俩。\n\n顺序比教材进度重要。那种急着自己翻页、一套通吃的，就是我说的该pass那种。\n\n之前聊过挑外教、跟 gem 学拼读，这套是\"从哪开始\"：先把这三组吃透，再往前走。\n\n你家娃卡在哪组音？评论区聊聊，拼读坑我踩过不少🧸\n\n#自然拼读 #拼读 #启蒙 #外教一对一 #跟外教学拼读 #零基础拼读 #自然拼读怎么学 #拼读顺序 #家长选外教 #陪娃练口语", "date": "2026-11-03", "kind": "note", "platforms": ["xhs"], "bucket": "history", "images": ["assets/koc_momo_phonics_08_01.jpg", "assets/koc_momo_phonics_08_02.jpg", "assets/koc_momo_phonics_08_03.jpg", "assets/koc_momo_phonics_08_04.jpg", "assets/koc_momo_phonics_08_05.jpg"], "video": null, "cover": "assets/koc_momo_phonics_08_01.jpg", "files": [{"url": "assets/koc_momo_phonics_08_01.jpg", "name": "koc_momo_phonics_08_01.jpg", "label": "保存配图1"}, {"url": "assets/koc_momo_phonics_08_02.jpg", "name": "koc_momo_phonics_08_02.jpg", "label": "保存配图2"}, {"url": "assets/koc_momo_phonics_08_03.jpg", "name": "koc_momo_phonics_08_03.jpg", "label": "保存配图3"}, {"url": "assets/koc_momo_phonics_08_04.jpg", "name": "koc_momo_phonics_08_04.jpg", "label": "保存配图4"}, {"url": "assets/koc_momo_phonics_08_05.jpg", "name": "koc_momo_phonics_08_05.jpg", "label": "保存配图5"}], "reason": "历史素材文件存在，尚未重新核实文案事实、图片质量与适用平台。"}, {"id": "koc_momo_phonics_09", "accountId": "A10", "account": "A10 Momo拼读课堂", "title": "拼读卡壳，我用\"听音拆字\"小游戏拉回来的", "body": "零基础跟外教拼读，最怕的不是不会，是卡住后娃开始躲。之前聊过先练哪三组音、哪类外教要直接pass，今天说个我家的救场小游戏。\n\n娃有阵子一拼就卡，我急，他也烦。后来不硬拼了，改成\"听音拆字\"：\n\n第一，我说一个词，让娃先听。\n不急着读，先把音听进去，耳朵在线了再动手。\n\n第二，让娃把词拆成几块。\n比如拼读里一个简单的词，听成三块音，用手比划一块块拆开。\n\n第三，拆对了再拼回去。\n能拆就能拼，顺序一反过来，娃一下就通了。\n\n全程像玩，不考试。跟外教的时候他也用这招，慢慢来、纠嘴型。\n\n之前聊过挑外教、先练三组音，这套是\"卡了怎么玩着破\"：能拆音，拼读就通了一半。\n\n你家娃卡在哪组音？评论区聊聊，拼读坑我踩过不少🧸", "tags": "#自然拼读 #拼读 #启蒙 #外教一对一 #跟外教学拼读 #零基础拼读 #自然拼读怎么学 #拼读游戏 #家长选外教 #陪娃练口语", "fullText": "拼读卡壳，我用\"听音拆字\"小游戏拉回来的\n\n零基础跟外教拼读，最怕的不是不会，是卡住后娃开始躲。之前聊过先练哪三组音、哪类外教要直接pass，今天说个我家的救场小游戏。\n\n娃有阵子一拼就卡，我急，他也烦。后来不硬拼了，改成\"听音拆字\"：\n\n第一，我说一个词，让娃先听。\n不急着读，先把音听进去，耳朵在线了再动手。\n\n第二，让娃把词拆成几块。\n比如拼读里一个简单的词，听成三块音，用手比划一块块拆开。\n\n第三，拆对了再拼回去。\n能拆就能拼，顺序一反过来，娃一下就通了。\n\n全程像玩，不考试。跟外教的时候他也用这招，慢慢来、纠嘴型。\n\n之前聊过挑外教、先练三组音，这套是\"卡了怎么玩着破\"：能拆音，拼读就通了一半。\n\n你家娃卡在哪组音？评论区聊聊，拼读坑我踩过不少🧸\n\n#自然拼读 #拼读 #启蒙 #外教一对一 #跟外教学拼读 #零基础拼读 #自然拼读怎么学 #拼读游戏 #家长选外教 #陪娃练口语", "date": "2026-11-03", "kind": "note", "platforms": ["xhs"], "bucket": "history", "images": ["assets/koc_momo_phonics_09_01.jpg", "assets/koc_momo_phonics_09_02.jpg", "assets/koc_momo_phonics_09_03.jpg", "assets/koc_momo_phonics_09_04.jpg", "assets/koc_momo_phonics_09_05.jpg"], "video": null, "cover": "assets/koc_momo_phonics_09_01.jpg", "files": [{"url": "assets/koc_momo_phonics_09_01.jpg", "name": "koc_momo_phonics_09_01.jpg", "label": "保存配图1"}, {"url": "assets/koc_momo_phonics_09_02.jpg", "name": "koc_momo_phonics_09_02.jpg", "label": "保存配图2"}, {"url": "assets/koc_momo_phonics_09_03.jpg", "name": "koc_momo_phonics_09_03.jpg", "label": "保存配图3"}, {"url": "assets/koc_momo_phonics_09_04.jpg", "name": "koc_momo_phonics_09_04.jpg", "label": "保存配图4"}, {"url": "assets/koc_momo_phonics_09_05.jpg", "name": "koc_momo_phonics_09_05.jpg", "label": "保存配图5"}], "reason": "历史素材文件存在，尚未重新核实文案事实、图片质量与适用平台。"}, {"id": "koc_momo_phonics_10", "accountId": "A10", "account": "A10 Momo拼读课堂", "title": "拼读会了却读不连贯？我用指读加跟读两天破的", "body": "标题：拼读会了却读不连贯？我用指读加跟读两天破的\n\n零基础跟外教拼读，最常见的卡点不是不会拼，是拼出来了、连不起来🤔\n之前聊过先练哪三组音、卡壳了用听音拆字玩着破。今天说个我家实操的进阶招：拼读会了但读得不顺，怎么办。\n娃有阵子单个词能拼，一读书就断，读完上句忘下句。我急，他也烦。后来不硬读了，改成指读加跟读：\n第一，手指指着词，一个一个过。不贪快，指到哪读到哪。手指帮眼睛定住，不乱跳，娃才知道读是逐词走的👆\n第二，我读一句，他跟一句。先听完整节奏，再模仿。跟读几次，他摸到了停顿和语调，不再一个字一个字蹦。\n第三，两句连起来读。跟熟了，把上下句接上，慢慢就不用我带了。\n全程不考不问，像玩游戏。跟外教的时候他也用这招，慢慢来、纠嘴型。\n之前聊过挑外教、先练三组音、听音拆字，这套是拼完怎么读顺：能拆能拼，还要能连🎯\n你家娃拼读卡在哪一步？评论区聊聊，拼读坑我踩过不少🧸", "tags": "#自然拼读 #拼读 #启蒙 #外教一对一 #跟外教学拼读 #零基础拼读 #自然拼读怎么学 #拼读指读 #家长选外教 #陪娃练口语", "fullText": "拼读会了却读不连贯？我用指读加跟读两天破的\n\n标题：拼读会了却读不连贯？我用指读加跟读两天破的\n\n零基础跟外教拼读，最常见的卡点不是不会拼，是拼出来了、连不起来🤔\n之前聊过先练哪三组音、卡壳了用听音拆字玩着破。今天说个我家实操的进阶招：拼读会了但读得不顺，怎么办。\n娃有阵子单个词能拼，一读书就断，读完上句忘下句。我急，他也烦。后来不硬读了，改成指读加跟读：\n第一，手指指着词，一个一个过。不贪快，指到哪读到哪。手指帮眼睛定住，不乱跳，娃才知道读是逐词走的👆\n第二，我读一句，他跟一句。先听完整节奏，再模仿。跟读几次，他摸到了停顿和语调，不再一个字一个字蹦。\n第三，两句连起来读。跟熟了，把上下句接上，慢慢就不用我带了。\n全程不考不问，像玩游戏。跟外教的时候他也用这招，慢慢来、纠嘴型。\n之前聊过挑外教、先练三组音、听音拆字，这套是拼完怎么读顺：能拆能拼，还要能连🎯\n你家娃拼读卡在哪一步？评论区聊聊，拼读坑我踩过不少🧸\n\n#自然拼读 #拼读 #启蒙 #外教一对一 #跟外教学拼读 #零基础拼读 #自然拼读怎么学 #拼读指读 #家长选外教 #陪娃练口语", "date": "2026-11-04", "kind": "note", "platforms": ["xhs"], "bucket": "history", "images": ["assets/koc_momo_phonics_10_01.jpg", "assets/koc_momo_phonics_10_02.jpg", "assets/koc_momo_phonics_10_03.jpg", "assets/koc_momo_phonics_10_04.jpg", "assets/koc_momo_phonics_10_05.jpg"], "video": null, "cover": "assets/koc_momo_phonics_10_01.jpg", "files": [{"url": "assets/koc_momo_phonics_10_01.jpg", "name": "koc_momo_phonics_10_01.jpg", "label": "保存配图1"}, {"url": "assets/koc_momo_phonics_10_02.jpg", "name": "koc_momo_phonics_10_02.jpg", "label": "保存配图2"}, {"url": "assets/koc_momo_phonics_10_03.jpg", "name": "koc_momo_phonics_10_03.jpg", "label": "保存配图3"}, {"url": "assets/koc_momo_phonics_10_04.jpg", "name": "koc_momo_phonics_10_04.jpg", "label": "保存配图4"}, {"url": "assets/koc_momo_phonics_10_05.jpg", "name": "koc_momo_phonics_10_05.jpg", "label": "保存配图5"}], "reason": "历史素材文件存在，尚未重新核实文案事实、图片质量与适用平台。"}, {"id": "koc_momo_raz_01", "accountId": "A09", "account": "A09 分级账本Momo（RAZ）", "title": "刷RAZ 8个月，从AA到H，我把进度做成了账本📒", "body": "8个月，从 AA 到 H。\n\n不是娃天赋异禀，是我把进度做成了账本，每个月记一页，记满了8页✨\n\n翻回去看，比任何话术都让我安心。\n\n📖 我的账本长这样\n\n1月 AA 12本 每天10分钟\n2月 AA 18本 每天10分钟\n3月 B 20本 每天15分钟\n4月 C 22本 每天15分钟\n5月 D 25本 每天20分钟\n6月 E 28本 每天20分钟\n7月 F 30本 每天20分钟\n8月 H 32本 每天25分钟\n\n数字不好看，但每一页都是真的。\n本数是自己数的，用时是计时器掐的，级别是测出来的⏱️\n\n盯了8个月，我发现真正有用的不是级别，是这三件事👇\n\n1️⃣ 每天的分钟数\n级别会卡，分钟数不会骗人。有一个月娃卡在C级不动，我差点以为方法错了。翻账本才发现：那个月我加班，每天只读5分钟。把分钟数拉回来，两周就过级了。\n\n2️⃣ 重复读的次数\n同一本读三遍，比换三本新书有用。娃第二遍才能读懂笑点，第三遍才愿意自己指着读。我以前急着往前刷，其实是白刷📚\n\n3️⃣ 娃主动翻书的频率\n不用催就拿起来，才是真进去了。我在账本最后一列画小星星，一周有三颗星，我就知道这段时间成了习惯⭐\n\n账本怎么记？就三行，不用买专门的本子：\n\n记分钟数，计时器一按，读完就记，别靠印象\n记本数，读完一本划一本，月底一数就知道\n记娃的反应，哪本自己笑出声、哪本不想读，写一句\n\n一张A4纸就够。坚持记三个月，你会谢谢自己☺️\n\n级别是结果，习惯才是原因。\n\n8个月，AA到H。没有天赋异禀，只有一天一天🌱\n\n如果你也在刷分级，评论区聊聊进度，我对账本很有经验，可以帮你看看卡在哪～", "tags": "#RAZ #分级阅读 #英语启蒙 #陪娃读英语 #牛津树 #英语启蒙这样做 #亲子阅读 #普通家庭英语启蒙 #妈妈的学习记录 #英语分级", "fullText": "刷RAZ 8个月，从AA到H，我把进度做成了账本📒\n\n8个月，从 AA 到 H。\n\n不是娃天赋异禀，是我把进度做成了账本，每个月记一页，记满了8页✨\n\n翻回去看，比任何话术都让我安心。\n\n📖 我的账本长这样\n\n1月 AA 12本 每天10分钟\n2月 AA 18本 每天10分钟\n3月 B 20本 每天15分钟\n4月 C 22本 每天15分钟\n5月 D 25本 每天20分钟\n6月 E 28本 每天20分钟\n7月 F 30本 每天20分钟\n8月 H 32本 每天25分钟\n\n数字不好看，但每一页都是真的。\n本数是自己数的，用时是计时器掐的，级别是测出来的⏱️\n\n盯了8个月，我发现真正有用的不是级别，是这三件事👇\n\n1️⃣ 每天的分钟数\n级别会卡，分钟数不会骗人。有一个月娃卡在C级不动，我差点以为方法错了。翻账本才发现：那个月我加班，每天只读5分钟。把分钟数拉回来，两周就过级了。\n\n2️⃣ 重复读的次数\n同一本读三遍，比换三本新书有用。娃第二遍才能读懂笑点，第三遍才愿意自己指着读。我以前急着往前刷，其实是白刷📚\n\n3️⃣ 娃主动翻书的频率\n不用催就拿起来，才是真进去了。我在账本最后一列画小星星，一周有三颗星，我就知道这段时间成了习惯⭐\n\n账本怎么记？就三行，不用买专门的本子：\n\n记分钟数，计时器一按，读完就记，别靠印象\n记本数，读完一本划一本，月底一数就知道\n记娃的反应，哪本自己笑出声、哪本不想读，写一句\n\n一张A4纸就够。坚持记三个月，你会谢谢自己☺️\n\n级别是结果，习惯才是原因。\n\n8个月，AA到H。没有天赋异禀，只有一天一天🌱\n\n如果你也在刷分级，评论区聊聊进度，我对账本很有经验，可以帮你看看卡在哪～\n\n#RAZ #分级阅读 #英语启蒙 #陪娃读英语 #牛津树 #英语启蒙这样做 #亲子阅读 #普通家庭英语启蒙 #妈妈的学习记录 #英语分级", "date": "2026-10-17", "kind": "note", "platforms": ["xhs"], "bucket": "history", "images": ["assets/koc_momo_raz_01_01.jpg", "assets/koc_momo_raz_01_02.jpg", "assets/koc_momo_raz_01_03.jpg", "assets/koc_momo_raz_01_04.jpg", "assets/koc_momo_raz_01_05.jpg", "assets/koc_momo_raz_01_06.jpg", "assets/koc_momo_raz_01_07.jpg"], "video": null, "cover": "assets/koc_momo_raz_01_01.jpg", "files": [{"url": "assets/koc_momo_raz_01_01.jpg", "name": "koc_momo_raz_01_01.jpg", "label": "保存配图1"}, {"url": "assets/koc_momo_raz_01_02.jpg", "name": "koc_momo_raz_01_02.jpg", "label": "保存配图2"}, {"url": "assets/koc_momo_raz_01_03.jpg", "name": "koc_momo_raz_01_03.jpg", "label": "保存配图3"}, {"url": "assets/koc_momo_raz_01_04.jpg", "name": "koc_momo_raz_01_04.jpg", "label": "保存配图4"}, {"url": "assets/koc_momo_raz_01_05.jpg", "name": "koc_momo_raz_01_05.jpg", "label": "保存配图5"}, {"url": "assets/koc_momo_raz_01_06.jpg", "name": "koc_momo_raz_01_06.jpg", "label": "保存配图6"}, {"url": "assets/koc_momo_raz_01_07.jpg", "name": "koc_momo_raz_01_07.jpg", "label": "保存配图7"}], "reason": "历史素材文件存在，尚未重新核实文案事实、图片质量与适用平台。"}, {"id": "koc_momo_raz_02", "accountId": "A09", "account": "A09 分级账本Momo（RAZ）", "title": "RAZ卡级别别硬刷，陪娃刷到H级后我悟了", "body": "老粉知道，我家\"外教一对一学RAZ\"这个系列记了很久，从「第180天-H级别」那篇开始，越来越多妈妈在评论区问：卡住了怎么办📖\n\n今天不晒进度，专聊卡点——娃刷RAZ卡在某个级别上不去，多是这三个隐形问题，不一定是\"不够努力\"。\n\n📊 卡点1：级别跳太快，地基松\n表现：看着读得顺，一提问就错；换个问法就懵\n账本记法：我会标\"伪熟练\"——读对了但其实没懂的，单独记一笔\n怎么破：退回低一级，把理解补上再往上走。慢一周，快一个月。\n\n📊 卡点2：只刷不读，输入变成走过场\n表现：每天刷完就完，问讲了什么说不出来\n账本记法：每本记一句\"娃用自己的话讲了啥\"\n怎么破：读完后让娃用一句话复述，说不出来的重读。复述比遍数重要。\n\n📊 卡点3：外教那边和家里各刷各的\n表现：外教反馈的弱项，家里没接住；家里刷的，课上用不上\n账本记法：每周日对齐一次——外教反馈的弱项=下周家里刷的重点\n怎么破：让两条线互相喂，别各走各的。\n\n💡 刷到H级后我悟了\n\nRAZ不是\"刷完多少本\"，是\"每一本真的过了脑子\"。账本上最有用的数字，不是天数，是娃讲出来的那句话。\n\n卡住的妈，评论区说下卡在哪个级别，我帮你看看先补啥👇", "tags": "#RAZ #分级阅读 #RAZ刷级 #RAZ卡级 #分级阅读怎么刷 #英语启蒙 #陪娃读绘本 #英语打卡", "fullText": "RAZ卡级别别硬刷，陪娃刷到H级后我悟了\n\n老粉知道，我家\"外教一对一学RAZ\"这个系列记了很久，从「第180天-H级别」那篇开始，越来越多妈妈在评论区问：卡住了怎么办📖\n\n今天不晒进度，专聊卡点——娃刷RAZ卡在某个级别上不去，多是这三个隐形问题，不一定是\"不够努力\"。\n\n📊 卡点1：级别跳太快，地基松\n表现：看着读得顺，一提问就错；换个问法就懵\n账本记法：我会标\"伪熟练\"——读对了但其实没懂的，单独记一笔\n怎么破：退回低一级，把理解补上再往上走。慢一周，快一个月。\n\n📊 卡点2：只刷不读，输入变成走过场\n表现：每天刷完就完，问讲了什么说不出来\n账本记法：每本记一句\"娃用自己的话讲了啥\"\n怎么破：读完后让娃用一句话复述，说不出来的重读。复述比遍数重要。\n\n📊 卡点3：外教那边和家里各刷各的\n表现：外教反馈的弱项，家里没接住；家里刷的，课上用不上\n账本记法：每周日对齐一次——外教反馈的弱项=下周家里刷的重点\n怎么破：让两条线互相喂，别各走各的。\n\n💡 刷到H级后我悟了\n\nRAZ不是\"刷完多少本\"，是\"每一本真的过了脑子\"。账本上最有用的数字，不是天数，是娃讲出来的那句话。\n\n卡住的妈，评论区说下卡在哪个级别，我帮你看看先补啥👇\n\n#RAZ #分级阅读 #RAZ刷级 #RAZ卡级 #分级阅读怎么刷 #英语启蒙 #陪娃读绘本 #英语打卡", "date": "2026-10-24", "kind": "note", "platforms": ["xhs"], "bucket": "history", "images": ["assets/koc_momo_raz_02_01.jpg", "assets/koc_momo_raz_02_02.jpg", "assets/koc_momo_raz_02_03.jpg", "assets/koc_momo_raz_02_04.jpg", "assets/koc_momo_raz_02_05.jpg"], "video": null, "cover": "assets/koc_momo_raz_02_01.jpg", "files": [{"url": "assets/koc_momo_raz_02_01.jpg", "name": "koc_momo_raz_02_01.jpg", "label": "保存配图1"}, {"url": "assets/koc_momo_raz_02_02.jpg", "name": "koc_momo_raz_02_02.jpg", "label": "保存配图2"}, {"url": "assets/koc_momo_raz_02_03.jpg", "name": "koc_momo_raz_02_03.jpg", "label": "保存配图3"}, {"url": "assets/koc_momo_raz_02_04.jpg", "name": "koc_momo_raz_02_04.jpg", "label": "保存配图4"}, {"url": "assets/koc_momo_raz_02_05.jpg", "name": "koc_momo_raz_02_05.jpg", "label": "保存配图5"}], "reason": "历史素材文件存在，尚未重新核实文案事实、图片质量与适用平台。"}, {"id": "koc_momo_raz_03", "accountId": "A09", "account": "A09 分级账本Momo（RAZ）", "title": "陪娃刷RAZ大半年，我把\"进步\"重新定义了📒", "body": "陪娃刷RAZ，从AA到H，大半年记满了账本。\n\n之前发过\"第180天到H级别\"的进度，好多妈妈问：怎么判断娃真进步了？我以前也只盯级别，后来发现级别会骗人🤔\n\n举个真实的：有阵子娃卡在C级，级别纹丝不动，我差点以为方法错了。翻账本才发现，那阵子我忙，每天只肯读5分钟。把时间拉回来，两周就过了。\n\n所以我现在的\"进步\"，不看级别，看这三件真东西：\n\n第一，肯自己翻书了吗。\n不催就拿起书，才是真进去了。我在账本最后一列画星星，一周三颗星，我就知道习惯成了🌟\n\n第二，敢开口用了吗。\n读RAZ不只是念，是能蹦出词。有天娃突然用绘本里的词跟我顶嘴，我反而乐了——这说明他真懂了😆\n\n第三，听力跟得上吗。\n我说外语他能不能接下一句，比认了多少词更准。能接，就是耳朵开了。\n\n级别是结果，习惯和耳朵才是原因。\n\n之前聊过卡级别别硬刷、账本怎么记，这套是续集：不焦虑级别，盯住这三件，你比任何测评都清楚娃在哪。\n\n你家刷到哪一级了？评论区报个数，卡住的我帮看看📩", "tags": "#RAZ #分级阅读 #启蒙 #陪娃共读 #RAZ卡级 #分级阅读怎么刷 #亲子阅读 #普通家庭启蒙 #RAZ进度 #妈妈的学习记录", "fullText": "陪娃刷RAZ大半年，我把\"进步\"重新定义了📒\n\n陪娃刷RAZ，从AA到H，大半年记满了账本。\n\n之前发过\"第180天到H级别\"的进度，好多妈妈问：怎么判断娃真进步了？我以前也只盯级别，后来发现级别会骗人🤔\n\n举个真实的：有阵子娃卡在C级，级别纹丝不动，我差点以为方法错了。翻账本才发现，那阵子我忙，每天只肯读5分钟。把时间拉回来，两周就过了。\n\n所以我现在的\"进步\"，不看级别，看这三件真东西：\n\n第一，肯自己翻书了吗。\n不催就拿起书，才是真进去了。我在账本最后一列画星星，一周三颗星，我就知道习惯成了🌟\n\n第二，敢开口用了吗。\n读RAZ不只是念，是能蹦出词。有天娃突然用绘本里的词跟我顶嘴，我反而乐了——这说明他真懂了😆\n\n第三，听力跟得上吗。\n我说外语他能不能接下一句，比认了多少词更准。能接，就是耳朵开了。\n\n级别是结果，习惯和耳朵才是原因。\n\n之前聊过卡级别别硬刷、账本怎么记，这套是续集：不焦虑级别，盯住这三件，你比任何测评都清楚娃在哪。\n\n你家刷到哪一级了？评论区报个数，卡住的我帮看看📩\n\n#RAZ #分级阅读 #启蒙 #陪娃共读 #RAZ卡级 #分级阅读怎么刷 #亲子阅读 #普通家庭启蒙 #RAZ进度 #妈妈的学习记录", "date": "2026-10-29", "kind": "note", "platforms": ["xhs"], "bucket": "history", "images": ["assets/koc_momo_raz_03_01.jpg", "assets/koc_momo_raz_03_02.jpg", "assets/koc_momo_raz_03_03.jpg", "assets/koc_momo_raz_03_04.jpg", "assets/koc_momo_raz_03_05.jpg"], "video": null, "cover": "assets/koc_momo_raz_03_01.jpg", "files": [{"url": "assets/koc_momo_raz_03_01.jpg", "name": "koc_momo_raz_03_01.jpg", "label": "保存配图1"}, {"url": "assets/koc_momo_raz_03_02.jpg", "name": "koc_momo_raz_03_02.jpg", "label": "保存配图2"}, {"url": "assets/koc_momo_raz_03_03.jpg", "name": "koc_momo_raz_03_03.jpg", "label": "保存配图3"}, {"url": "assets/koc_momo_raz_03_04.jpg", "name": "koc_momo_raz_03_04.jpg", "label": "保存配图4"}, {"url": "assets/koc_momo_raz_03_05.jpg", "name": "koc_momo_raz_03_05.jpg", "label": "保存配图5"}], "reason": "历史素材文件存在，尚未重新核实文案事实、图片质量与适用平台。"}, {"id": "koc_momo_raz_04", "accountId": "A09", "account": "A09 分级账本Momo（RAZ）", "title": "陪娃刷RAZ，我这本账就3栏，够用", "body": "之前发过\"不盯级别、盯三件真东西\"，好多妈妈问：那账本到底怎么记？\n\n我也不是啥专家，就一个陪读妈的土办法。我把一整本精简成3栏，记了半年没断过：\n\n第一栏，日期加读了哪本。\n不写级别，写书名。翻起来像日记，娃也有成就感。每天一行，三十秒。\n\n第二栏，今天卡在哪。\n哪个词不会、哪页卡壳，写两个字。卡级的时候回看，一眼看出是\"读太少\"还是\"真不会\"。\n\n第三栏，三颗星。\n肯自己翻书🌟、敢开口用🌟、耳朵跟得上🌟。一周三颗齐，习惯就成了。\n\n就这么三栏，不花哨。重点不是记，是回看——卡了翻一翻，比任何测评都准。\n\n之前聊过进步怎么看、级别会骗人，这套是\"怎么记\"：别买花哨表格，一支笔一张纸就开。\n\n你家怎么记？评论区晒晒，抄作业我也乐意📒", "tags": "#RAZ #分级阅读 #启蒙 #陪娃共读 #RAZ怎么刷 #分级阅读怎么刷 #亲子阅读 #普通家庭启蒙 #妈妈的学习记录 #阅读记录", "fullText": "陪娃刷RAZ，我这本账就3栏，够用\n\n之前发过\"不盯级别、盯三件真东西\"，好多妈妈问：那账本到底怎么记？\n\n我也不是啥专家，就一个陪读妈的土办法。我把一整本精简成3栏，记了半年没断过：\n\n第一栏，日期加读了哪本。\n不写级别，写书名。翻起来像日记，娃也有成就感。每天一行，三十秒。\n\n第二栏，今天卡在哪。\n哪个词不会、哪页卡壳，写两个字。卡级的时候回看，一眼看出是\"读太少\"还是\"真不会\"。\n\n第三栏，三颗星。\n肯自己翻书🌟、敢开口用🌟、耳朵跟得上🌟。一周三颗齐，习惯就成了。\n\n就这么三栏，不花哨。重点不是记，是回看——卡了翻一翻，比任何测评都准。\n\n之前聊过进步怎么看、级别会骗人，这套是\"怎么记\"：别买花哨表格，一支笔一张纸就开。\n\n你家怎么记？评论区晒晒，抄作业我也乐意📒\n\n#RAZ #分级阅读 #启蒙 #陪娃共读 #RAZ怎么刷 #分级阅读怎么刷 #亲子阅读 #普通家庭启蒙 #妈妈的学习记录 #阅读记录", "date": "2026-11-03", "kind": "note", "platforms": ["xhs"], "bucket": "history", "images": ["assets/koc_momo_raz_04_01.jpg", "assets/koc_momo_raz_04_02.jpg", "assets/koc_momo_raz_04_03.jpg", "assets/koc_momo_raz_04_04.jpg", "assets/koc_momo_raz_04_05.jpg"], "video": null, "cover": "assets/koc_momo_raz_04_01.jpg", "files": [{"url": "assets/koc_momo_raz_04_01.jpg", "name": "koc_momo_raz_04_01.jpg", "label": "保存配图1"}, {"url": "assets/koc_momo_raz_04_02.jpg", "name": "koc_momo_raz_04_02.jpg", "label": "保存配图2"}, {"url": "assets/koc_momo_raz_04_03.jpg", "name": "koc_momo_raz_04_03.jpg", "label": "保存配图3"}, {"url": "assets/koc_momo_raz_04_04.jpg", "name": "koc_momo_raz_04_04.jpg", "label": "保存配图4"}, {"url": "assets/koc_momo_raz_04_05.jpg", "name": "koc_momo_raz_04_05.jpg", "label": "保存配图5"}], "reason": "历史素材文件存在，尚未重新核实文案事实、图片质量与适用平台。"}, {"id": "koc_momo_raz_05", "accountId": "A09", "account": "A09 分级账本Momo（RAZ）", "title": "卡级别硬刷，我让娃\"横着读\"破的局", "body": "陪娃刷分级阅读，卡在某一本级好几个月不动，是最磨人的。之前发过账本怎么记、进步怎么看，今天说个具体破局法。\n\n我以前卡级就催：\"快升下一级！\"结果娃越刷越烦，账本上\"今天卡在哪\"全是问号。\n\n后来换成\"横着读\"：同一个级别，不急着往上，先把这个级别的书横向铺开读。\n\n具体三步：\n\n第一，同级别挑5到8本不同的书。\n主题换着来，娃不腻，每本都像新的一样。\n\n第二，每本只抓一个重点。\n这本练流利、那本练某个词，别本本都求全，贪多反而卡更久。\n\n第三，读顺了再升。\n同一级别能轻松读下来，才是真懂，不是级别数字到了。\n\n横着读一个月，娃从\"怕翻开\"变\"自己拿书\"。级别后来自然就上去了。\n\n之前聊过卡级别别硬刷、账本记\"卡在哪\"，这套是\"卡了怎么办\"：别跟数字较劲，跟理解较劲。\n\n你家卡在哪一级了？评论区报个数，我帮看看📒", "tags": "#RAZ #分级阅读 #启蒙 #陪娃共读 #RAZ卡级 #分级阅读怎么刷 #RAZ怎么刷 #亲子阅读 #普通家庭启蒙 #妈妈的学习记录", "fullText": "卡级别硬刷，我让娃\"横着读\"破的局\n\n陪娃刷分级阅读，卡在某一本级好几个月不动，是最磨人的。之前发过账本怎么记、进步怎么看，今天说个具体破局法。\n\n我以前卡级就催：\"快升下一级！\"结果娃越刷越烦，账本上\"今天卡在哪\"全是问号。\n\n后来换成\"横着读\"：同一个级别，不急着往上，先把这个级别的书横向铺开读。\n\n具体三步：\n\n第一，同级别挑5到8本不同的书。\n主题换着来，娃不腻，每本都像新的一样。\n\n第二，每本只抓一个重点。\n这本练流利、那本练某个词，别本本都求全，贪多反而卡更久。\n\n第三，读顺了再升。\n同一级别能轻松读下来，才是真懂，不是级别数字到了。\n\n横着读一个月，娃从\"怕翻开\"变\"自己拿书\"。级别后来自然就上去了。\n\n之前聊过卡级别别硬刷、账本记\"卡在哪\"，这套是\"卡了怎么办\"：别跟数字较劲，跟理解较劲。\n\n你家卡在哪一级了？评论区报个数，我帮看看📒\n\n#RAZ #分级阅读 #启蒙 #陪娃共读 #RAZ卡级 #分级阅读怎么刷 #RAZ怎么刷 #亲子阅读 #普通家庭启蒙 #妈妈的学习记录", "date": "2026-11-03", "kind": "note", "platforms": ["xhs"], "bucket": "history", "images": ["assets/koc_momo_raz_05_01.jpg", "assets/koc_momo_raz_05_02.jpg", "assets/koc_momo_raz_05_03.jpg", "assets/koc_momo_raz_05_04.jpg", "assets/koc_momo_raz_05_05.jpg"], "video": null, "cover": "assets/koc_momo_raz_05_01.jpg", "files": [{"url": "assets/koc_momo_raz_05_01.jpg", "name": "koc_momo_raz_05_01.jpg", "label": "保存配图1"}, {"url": "assets/koc_momo_raz_05_02.jpg", "name": "koc_momo_raz_05_02.jpg", "label": "保存配图2"}, {"url": "assets/koc_momo_raz_05_03.jpg", "name": "koc_momo_raz_05_03.jpg", "label": "保存配图3"}, {"url": "assets/koc_momo_raz_05_04.jpg", "name": "koc_momo_raz_05_04.jpg", "label": "保存配图4"}, {"url": "assets/koc_momo_raz_05_05.jpg", "name": "koc_momo_raz_05_05.jpg", "label": "保存配图5"}], "reason": "历史素材文件存在，尚未重新核实文案事实、图片质量与适用平台。"}, {"id": "koc_momo_raz_06", "accountId": "A09", "account": "A09 分级账本Momo（RAZ）", "title": "分级阅读刷到哪算够？我给娃定的这条毕业线", "body": "标题：分级阅读刷到哪算够？我给娃定的这条毕业线\n\n陪娃刷分级阅读，最容易陷进一个坑：盯着级别数字往上爬，爬到很高，其实没真懂😅\n之前聊过账本怎么记、卡级了横着读破局。今天说个具体的：到底刷到哪一级，算够了？\n我不是专家，就一个陪读妈的土标准。我家不追最高级，定了三条毕业线，满足就转下一阶段：\n第一条，这个级别的书，娃能自己流利读下来。不是磕磕绊绊念完，是读着读着有语调、有停顿，像说话。能这样，说明耳朵和嘴都对得上🌟\n第二条，不认识的词，娃会自己试着拼。遇到生词不卡死、不喊妈，拿起书上的图或拼读规则猜一个，错了也敢试。这比认了多少词重要。\n第三条，愿意自己拿书读。账本上肯自己翻书那颗星，连续几周都亮着。爱读，比级别号值钱📚\n这三条满足，我就不再死磕更高级，转去广泛读：杂书、科普、故事，啥都看。\n之前聊过进步怎么看、卡级别硬刷，这套是刷到哪停：别跟数字较劲，跟能力较劲。\n你家刷到哪一级了？评论区报个数，卡住的我帮看看📒", "tags": "#RAZ #分级阅读 #启蒙 #陪娃共读 #RAZ怎么刷 #分级阅读怎么刷 #RAZ进度 #亲子阅读 #普通家庭启蒙 #妈妈的学习记录", "fullText": "分级阅读刷到哪算够？我给娃定的这条毕业线\n\n标题：分级阅读刷到哪算够？我给娃定的这条毕业线\n\n陪娃刷分级阅读，最容易陷进一个坑：盯着级别数字往上爬，爬到很高，其实没真懂😅\n之前聊过账本怎么记、卡级了横着读破局。今天说个具体的：到底刷到哪一级，算够了？\n我不是专家，就一个陪读妈的土标准。我家不追最高级，定了三条毕业线，满足就转下一阶段：\n第一条，这个级别的书，娃能自己流利读下来。不是磕磕绊绊念完，是读着读着有语调、有停顿，像说话。能这样，说明耳朵和嘴都对得上🌟\n第二条，不认识的词，娃会自己试着拼。遇到生词不卡死、不喊妈，拿起书上的图或拼读规则猜一个，错了也敢试。这比认了多少词重要。\n第三条，愿意自己拿书读。账本上肯自己翻书那颗星，连续几周都亮着。爱读，比级别号值钱📚\n这三条满足，我就不再死磕更高级，转去广泛读：杂书、科普、故事，啥都看。\n之前聊过进步怎么看、卡级别硬刷，这套是刷到哪停：别跟数字较劲，跟能力较劲。\n你家刷到哪一级了？评论区报个数，卡住的我帮看看📒\n\n#RAZ #分级阅读 #启蒙 #陪娃共读 #RAZ怎么刷 #分级阅读怎么刷 #RAZ进度 #亲子阅读 #普通家庭启蒙 #妈妈的学习记录", "date": "2026-11-04", "kind": "note", "platforms": ["xhs"], "bucket": "history", "images": ["assets/koc_momo_raz_06_01.jpg", "assets/koc_momo_raz_06_02.jpg", "assets/koc_momo_raz_06_03.jpg", "assets/koc_momo_raz_06_04.jpg", "assets/koc_momo_raz_06_05.jpg"], "video": null, "cover": "assets/koc_momo_raz_06_01.jpg", "files": [{"url": "assets/koc_momo_raz_06_01.jpg", "name": "koc_momo_raz_06_01.jpg", "label": "保存配图1"}, {"url": "assets/koc_momo_raz_06_02.jpg", "name": "koc_momo_raz_06_02.jpg", "label": "保存配图2"}, {"url": "assets/koc_momo_raz_06_03.jpg", "name": "koc_momo_raz_06_03.jpg", "label": "保存配图3"}, {"url": "assets/koc_momo_raz_06_04.jpg", "name": "koc_momo_raz_06_04.jpg", "label": "保存配图4"}, {"url": "assets/koc_momo_raz_06_05.jpg", "name": "koc_momo_raz_06_05.jpg", "label": "保存配图5"}], "reason": "历史素材文件存在，尚未重新核实文案事实、图片质量与适用平台。"}, {"id": "koc_v1_01", "accountId": "unknown", "account": "KOC 系列（待归类）", "title": "私信「试听」领免费体验课", "body": "", "tags": "#外教课 #少儿英语 #口语", "fullText": "私信「试听」领免费体验课\n\n\n\n#外教课 #少儿英语 #口语", "date": "2026-11-01", "kind": "video", "platforms": [], "bucket": "issue", "images": [], "video": "assets/aeacb0eed34b13795c.mp4", "cover": null, "files": [], "reason": "缺少正文；原生成器按前缀归类，账号或声音归属未核实；旧视频待重新审看；旧页面未提供视频预览字段"}, {"id": "koc_v1_02", "accountId": "unknown", "account": "KOC 系列（待归类）", "title": "私信「试听」领免费体验课", "body": "", "tags": "#外教课 #少儿英语 #口语", "fullText": "私信「试听」领免费体验课\n\n\n\n#外教课 #少儿英语 #口语", "date": "2026-11-01", "kind": "video", "platforms": [], "bucket": "issue", "images": [], "video": "assets/f557e551a6ce4851bf.mp4", "cover": null, "files": [], "reason": "缺少正文；原生成器按前缀归类，账号或声音归属未核实；旧视频待重新审看；旧页面未提供视频预览字段"}, {"id": "koc_v1_03", "accountId": "unknown", "account": "KOC 系列（待归类）", "title": "私信「试听」领免费体验课", "body": "", "tags": "#外教课 #少儿英语 #口语", "fullText": "私信「试听」领免费体验课\n\n\n\n#外教课 #少儿英语 #口语", "date": "2026-11-01", "kind": "video", "platforms": [], "bucket": "issue", "images": [], "video": "assets/564f5f3874b3b445e7.mp4", "cover": null, "files": [], "reason": "缺少正文；原生成器按前缀归类，账号或声音归属未核实；旧视频待重新审看；旧页面未提供视频预览字段"}, {"id": "koc_xiaobaige_01", "accountId": "A11", "account": "A11 小白哥的锅（广州宝爸）", "title": "给娃做了300天早餐，我顺带把英语启蒙做了📒", "body": "不是有计划，是被逼的。\n\n娃坐在对面，指着鸡蛋问这问那。我一边翻锅一边想：嘴里闲着也是闲着，说中文不如说英语。\n\n就这样，早餐桌成了我家唯一的英语环境🍳\n\n我在饭桌上说的，全是这几个场景：\n\n煎蛋的时候：The egg is hot. Blow it first.\n递牛奶的时候：Here's your milk. Careful, don't spill.\n娃挑食的时候：One more bite. You can do it.\n吃完的时候：Yum yum! Who helped clean the table?\n\n就这么几句，翻来覆去说。\n\n三个月后，娃自己指着鸡蛋说了句 The egg is hot。\n\n我锅铲都拿歪了🥄\n\n后来我才知道，这叫「可理解输入」\n\n不是教，是天天在同一个场景说同一句话。娃不用背，看图听声，自然对上。\n\n我也踩过坑。一开始给娃放英文儿歌当背景音，放了半年，娃会哼调，一个词都不会说🎶\n\n后来明白了：没有画面和动作的声音，对娃来说就是噪音。\n\n有场景的一句话，胜过一小时音频🥛\n\n现在娃在跟外教练口语，我反而轻松了\n\n有人问我在哪学的。\n\n实话是，我英语很普通，发音也一般。我做的只是把「敢说」这件事演给娃看。\n\n真正系统的练习，是娃跟外教一起练的。外教一句一句带，错了笑着让娃再来一次，比我有耐心得多。\n\n我在家就干一件事：饭桌上接着随口说。\n\n爸爸先不害怕，娃才不会害怕👨‍🍳\n\n你家饭桌上，都跟娃说点啥？评论区聊聊，我攒了一堆「早餐桌常用句」，挑几句送你～", "tags": "#英语启蒙 #饭桌英语 #亲子英语 #陪娃学英语 #英语启蒙这样做 #爸爸带娃 #广州爸爸 #普通家庭英语启蒙 #幼儿英语启蒙 #生活英语", "fullText": "给娃做了300天早餐，我顺带把英语启蒙做了📒\n\n不是有计划，是被逼的。\n\n娃坐在对面，指着鸡蛋问这问那。我一边翻锅一边想：嘴里闲着也是闲着，说中文不如说英语。\n\n就这样，早餐桌成了我家唯一的英语环境🍳\n\n我在饭桌上说的，全是这几个场景：\n\n煎蛋的时候：The egg is hot. Blow it first.\n递牛奶的时候：Here's your milk. Careful, don't spill.\n娃挑食的时候：One more bite. You can do it.\n吃完的时候：Yum yum! Who helped clean the table?\n\n就这么几句，翻来覆去说。\n\n三个月后，娃自己指着鸡蛋说了句 The egg is hot。\n\n我锅铲都拿歪了🥄\n\n后来我才知道，这叫「可理解输入」\n\n不是教，是天天在同一个场景说同一句话。娃不用背，看图听声，自然对上。\n\n我也踩过坑。一开始给娃放英文儿歌当背景音，放了半年，娃会哼调，一个词都不会说🎶\n\n后来明白了：没有画面和动作的声音，对娃来说就是噪音。\n\n有场景的一句话，胜过一小时音频🥛\n\n现在娃在跟外教练口语，我反而轻松了\n\n有人问我在哪学的。\n\n实话是，我英语很普通，发音也一般。我做的只是把「敢说」这件事演给娃看。\n\n真正系统的练习，是娃跟外教一起练的。外教一句一句带，错了笑着让娃再来一次，比我有耐心得多。\n\n我在家就干一件事：饭桌上接着随口说。\n\n爸爸先不害怕，娃才不会害怕👨‍🍳\n\n你家饭  外教做对的三件事，我在家照着搬\n\n第一，一次只纠一个音。抓一堆错，娃会挫败，一个就够了。\n第二，错了不批评。外教笑着说 Almost，让娃再来一次，娃就真的愿意再来。\n第三，让娃反过来教你。娃教外教一句，比自己读十遍都认真。回家我照搬：他教我一个，我故意读错让他纠。\n\n这套我在饭桌上也用。一边给娃盛汤一边练，谁都没觉得在学🍲\n\n变化不止在英语上\n\n敢开口了。敢纠我了。敢在饭桌上说整句话了。\n\n这些比「会多少词」值钱得多。\n\n60天，说长不长，说短不短。没什么天赋异禀，就是一天20分钟，外加一个不凶的大人☀️\n\n如果你也在陪娃练口语，评论区聊聊卡在哪。我这儿有份「宝爸陪练笔记」，或许你能用上💬", "tags": "#陪娃练口语 #英语启蒙 #亲子英语 #爸爸带娃 #广州宝爸 #英语启蒙这样做 #外教 #普通家庭英语启蒙 #幼儿英语启蒙 #口语天天练", "fullText": "陪娃跟外教练了60天口语，娃开始催我了🗣️\n\n不是催我做饭，是催我开口说英语。\n\n以前都是我推着娃：该练了，该读了。60天后反过来了，娃早上爬起来第一句：爸爸，today我们说什么？\n\n📅 一个宝爸的60天记录，笨办法，但有用\n\n第1周：娃光笑，不说话。外教也不急，就重复。\n第2周：娃开始蹦单词。apple，egg，more。\n第3到4周：娃能接整句了。外教说一句，他跟一句。\n第2个月：娃开始纠正我。我把banana说成ba-NA-na，他说不对，是ba-NAN-a。\n\n那一下我突然懂了：娃不是学会了英语，是学会了不怕说错。\n\n👨‍🍳 外教做对的三件事，我在家照着搬\n\n第一，一次只纠一个音。抓一堆错，娃会挫败，一个就够了。\n第二，错了不批评。外教笑着说 Almost，让娃再来一次，娃就真的愿意再来。\n第三，让娃反过来教你。娃教外教一句，比自己读十遍都认真。回家我照搬：他教我一个，我故意读错让他纠。\n\n这套我在饭桌上也用。一边给娃盛汤一边练，谁都没觉得在学🍲\n\n变化不止在英语上\n\n敢开口了。敢纠我了。敢在饭桌上说整句话了。\n\n这些比「会多少词」值钱得多。\n\n60天，说长不长，说短不短。没什么天赋异禀，就是一天20分钟，外加一个不凶的大人☀️\n\n如果你也在陪娃练口语，评论区聊聊卡在哪。我这儿有份「宝爸陪练笔记」，或许你能用上💬\n\n#陪娃练口语 #英语启蒙 #亲子英语 #爸爸带娃 #广州宝爸 #英语启蒙这样做 #外教 #普通家庭英语启蒙 #幼儿英语启蒙 #口语天天练", "date": "2026-10-17", "kind": "note", "platforms": ["xhs"], "bucket": "history", "images": ["assets/koc_xiaobaige_02_01.jpg", "assets/koc_xiaobaige_02_02.jpg", "assets/koc_xiaobaige_02_03.jpg", "assets/koc_xiaobaige_02_04.jpg", "assets/koc_xiaobaige_02_05.jpg", "assets/koc_xiaobaige_02_06.jpg", "assets/koc_xiaobaige_02_07.jpg", "assets/koc_xiaobaige_02_08.jpg", "assets/koc_xiaobaige_02_09.jpg", "assets/koc_xiaobaige_02_10.jpg"], "video": null, "cover": "assets/koc_xiaobaige_02_01.jpg", "files": [{"url": "assets/koc_xiaobaige_02_01.jpg", "name": "koc_xiaobaige_02_01.jpg", "label": "保存配图1"}, {"url": "assets/koc_xiaobaige_02_02.jpg", "name": "koc_xiaobaige_02_02.jpg", "label": "保存配图2"}, {"url": "assets/koc_xiaobaige_02_03.jpg", "name": "koc_xiaobaige_02_03.jpg", "label": "保存配图3"}, {"url": "assets/koc_xiaobaige_02_04.jpg", "name": "koc_xiaobaige_02_04.jpg", "label": "保存配图4"}, {"url": "assets/koc_xiaobai function openPost(id){active=DATA.posts.find(p=>p.id===id);const p=active,st=state(p);$('detailTitle').textContent=p.title;
 const media=p.video?`<video controls playsinline preload="metadata" poster="${esc(p.cover)}"><source src="${esc(p.video)}" type="video/mp4"></video><p class="summary" id="mediaState">${p.seconds?Number(p.seconds).toFixed(1)+'秒 · ':''}视频内已放首帧封面</p>`:`<div class="gallery">${p.images.map((u,i)=>`<a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" alt="第${i+1}张${i===0?'封面':'配图'}"></a>`).join('')}</div>`;
 $('detail').innerHTML=`<div class="detail"><div class="media">${media}<div class="links">${p.files.map(f=>`<a class="btn" href="${esc(f.url)}" download="${esc(f.name)}">${esc(f.label)}</a>`).join('')}</div></div><div>${p.reason?`<p class="note">${esc(p.reason)}</p>`:''}<p class="summary">${esc(p.account)} · ${p.platforms.map(x=>LABEL[x]).join(' / ')}</p>${[['title','标题',p.title],['body','正文',p.body],['tags','话题',p.tags]].map(([k,l,t])=>`<section class="copybox"><h3>${l}<button class="btn" data-copy="${k}">复制${l}</button></h3><p>${esc(t)}</p></section>`).join('')}<button class="btn primary" id="copyAll">复制全部文案</button>${p.bucket!=='issue'?`<div class="publish"><label>审核状态 <select id="review"><option value="draft">待审核</option><option value="ready">已审核</option><option value="rejected">需修改</option></select></label><p>记录发布平台（不会替你发到社交平台）：</p><div class="links">${p.platforms.map(x=>`<button class="btn" data-publish="${x}">${st.published.includes(x)?'撤销'+LABEL[x]+'已发':'标记'+LABEL[x]+'已发'}</button>`).join('')}</div></div>`:''}</div></div>`;
 for(const b of $('detail').querySelectorAll('[data-copy]'))b.onclick=()=>copy(p[b.dataset.copy]);$('copyAll').onclick=()=>copy(p.fullText||p.title+'\n\n'+p.body+'\n\n'+p.tags);
 const v=$('detail').querySelector('video');if(v){v.onloadeddata=()=>{$('mediaState').textContent='视频已加载，可以播放；首帧含封面。'};v.onerror=()=>{$('mediaState').textContent='视频加载失败，请尝试下载原文件，或标记需修改。'}}
 if($('review')){$('review').value=st.status;$('review').onchange=e=>{saved[p.id]={...state(p),status:e.target.value,updatedAt:new Date().toISOString()};persist();render()}}
 for(const b of $('detail').querySelectorAll('[data-publish]'))b.onclick=()=>{let a=state(p).published.slice(),x=b.dataset.publish;a=a.includes(x)?a.filter(y=>y!==x):[...a,x];saved[p.id]={...state(p),published:a,updatedAt:new Date().toISOString()};persist();render();openPost(id)};
 if(!$('dialog').open)$('dialog').showModal();
}
$('close').onclick=()=>{$('dialog').querySelectorAll('video').forEach(v=>v.pause());$('dialog').close()};$('dialog').addEventListener('cancel',()=>{$('dialog').querySelectorAll('video').forEach(v=>v.pause())});
for(const id of ['search','kind','platform','status'])$(id).addEventListener(id==='search'?'input':'change',render);
$('export').onclick=()=>{const blob=new Blob([JSON.stringify({schemaVersion:2,exportedAt:new Date().toISOString(),states:saved},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='矩阵发布状态_'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)};
$('import').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());if(d.schemaVersion!==2||!d.states||typeof d.states!=='object')throw Error();for(const p of DATA.posts){const s=d.states[p.id];if(s&&['draft','ready','rejected'].includes(s.status)&&Array.isArray(s.published))saved[p.id]={status:s.status,published:s.published.filter(x=>p.platforms.includes(x))}}persist();render();toast('状态已合并导入')}catch(e){toast('文件格式不正确，请选择从本台导出的状态文件')}finally{e.target.value=''}};
</script></html>
